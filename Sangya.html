<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>व्याकरण मास्टर - संज्ञा, लिंग, वचन, कारक</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 450px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">हिन्दी व्याकरण मास्टर टेस्ट</h2>
        <p>विषय: संज्ञा, लिंग, वचन और कारक<br>कृपया अपना सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">व्याकरण क्विज़</h1>
        <p>100 प्रश्न | 4 पेज | स्तर: मध्यम से कठिन</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">कुल स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    const questionsPool = [
        // 1-25: संज्ञा आधारित
        { q: "'हरियाली' में कौन-सी संज्ञा प्रयुक्त है?", o: ["जातिवाचक", "समूहवाचक", "भाववाचक", "व्यक्तिवाचक"], a: 2, t: "विशेषण 'हरा' से बनी भाववाचक संज्ञा है।" },
        { q: "'राज्यपाल' में कौन-सी संज्ञा है?", o: ["व्यक्तिवाचक", "जातिवाचक", "भाववाचक", "समूहवाचक"], a: 1, t: "सभी संवैधानिक पद जातिवाचक होते हैं।" },
        { q: "'बुढ़ापा' एक प्रकार का अभिशाप है। 'बुढ़ापा' शब्द है:", o: ["जातिवाचक", "भाववाचक", "व्यक्तिवाचक", "समूहवाचक"], a: 1, t: "अवस्था सूचक शब्द भाववाचक संज्ञा है।" },
        { q: "निम्न में से कौन-सा शब्द 'द्रव्यवाचक' संज्ञा है?", o: ["खटाई", "मिठाई", "दूध", "ठंड"], a: 2, t: "दूध को मापा-तोला जाता है।" },
        { q: "लड़का दौड़ता है। इस वाक्य में 'लड़का' है:", o: ["व्यक्तिवाचक", "जातिवाचक", "भाववाचक", "द्रव्यवाचक"], a: 1, t: "पूरी श्रेणी का बोध कराने वाला।" },
        { q: "'पंडित' से बनी भाववाचक संज्ञा क्या है?", o: ["पंडिताऊ", "पांडित्य", "पंडितानी", "पांडित्य और पंडिताई"], a: 3, t: "पांडित्य और पंडिताई दोनों भाववाचक हैं।" },
        { q: "क्रिया से बनने वाली भाववाचक संज्ञा है:", o: ["थकावट", "बुढ़ापा", "आलस्य", "बुराई"], a: 0, t: "थकना (क्रिया) + आवट।" },
        { q: "'भीड़' शब्द व्याकरण की दृष्टि से क्या है?", o: ["जातिवाचक", "भाववाचक", "समूहवाचक", "व्यक्तिवाचक"], a: 2, t: "व्यक्तियों का समूह।" },
        { q: "'कक्षा' शब्द संज्ञा के किस भेद में आता है?", o: ["समूहवाचक", "जातिवाचक", "भाववाचक", "द्रव्यवाचक"], a: 0, t: "छात्रों का समूह।" },
        { q: "'आज भी भारत में श्रवण कुमार पैदा होते हैं।' यहाँ 'श्रवण कुमार' है:", o: ["व्यक्तिवाचक", "जातिवाचक", "भाववाचक", "विशेषण"], a: 1, t: "गुण विशेष के कारण व्यक्तिवाचक संज्ञा जातिवाचक बन गई है।" },
        { q: "स्वत्व' में कौन-सी संज्ञा है?", o: ["जातिवाचक", "व्यक्तिवाचक", "भाववाचक", "द्रव्यवाचक"], a: 2, t: "भाववाचक।" },
        { q: "निम्नलिखित में से संज्ञा शब्द है:", o: ["नीला", "पुराना", "गंगा", "मोटा"], a: 2, t: "गंगा व्यक्तिवाचक संज्ञा है, बाकी विशेषण हैं।" },
        { q: "राष्ट्र की भाववाचक संज्ञा है:", o: ["राष्ट्रीय", "राष्ट्रीयता", "सौराष्ट्र", "राष्"], a: 1, t: "राष्ट्रीयता।" },
        { q: "सुंदर की भाववाचक संज्ञा है:", o: ["सुंदरता", "सौंदर्य", "दोनों A और B", "सुंदरपन"], a: 2, t: "दोनों शुद्ध हैं।" },
        { q: "'कोयला' शब्द में संज्ञा है:", o: ["जातिवाचक", "द्रव्यवाचक", "समूहवाचक", "भाववाचक"], a: 1, t: "ईंधन द्रव्यवाचक में आता है।" },
        { q: "'जटिलता' शब्द में संज्ञा है:", o: ["भाववाचक", "जातिवाचक", "विशेषण", "समूहवाचक"], a: 0, t: "जटिल (विशेषण) से जटिलता (भाव)।" },
        { q: "जिन संज्ञाओं से एक ही प्रकार की वस्तुओं का बोध हो, वे हैं:", o: ["व्यक्तिवाचक", "जातिवाचक", "भाववाचक", "द्रव्यवाचक"], a: 1, t: "जातिवाचक।" },
        { q: "'कवि' शब्द में कौन-सी संज्ञा है?", o: ["व्यक्तिवाचक", "जातिवाचक", "द्रव्यवाचक", "भाववाचक"], a: 1, t: "पूरी श्रेणी का बोध।" },
        { q: "'सच्चरित्रता' किस मूल शब्द से बना है?", o: ["सतचरित्र", "चरित्र", "चरित्रता", "सच्चरित्र"], a: 1, t: "मूल शब्द 'चरित्र' है।" },
        { q: "'मिठास' शब्द है:", o: ["द्रव्यवाचक", "जातिवाचक", "भाववाचक", "व्यक्तिवाचक"], a: 2, t: "स्वाद का अनुभव।" },
        { q: "मानव शब्द के लिए उपयुक्त भाववाचक संज्ञा है:", o: ["मनस्वी", "मनुष्यत्व", "मानवता", "आदमीयत"], a: 2, t: "मानवता।" },
        { q: "जातिवाचक संज्ञा शब्द है:", o: ["कामायनी", "आम", "रसीला", "वकील"], a: 3, t: "वकील एक वर्ग को दर्शाता है।" },
        { q: "सभा में बीसियों लोग थे। यहाँ संज्ञा का कौन-सा भेद है?", o: ["जातिवाचक", "व्यक्तिवाचक", "समूहवाचक", "भाववाचक"], a: 2, t: "सभा समूह को दर्शाती है।" },
        { q: "गांधीजी को राष्ट्रपिता कहा गया है। यहाँ गांधीजी है:", o: ["जातिवाचक से व्यक्तिवाचक", "व्यक्तिवाचक से जातिवाचक", "विशेषण", "भाववाचक"], a: 0, t: "उपनाम का प्रयोग विशेष व्यक्ति के लिए।" },
        { q: "निम्नलिखित में से समूहवाचक संज्ञा नहीं है:", o: ["सभा", "कक्षा", "भीड़", "दौड़"], a: 3, t: "दौड़ एक भाव/क्रिया है।" },

        // 26-50: लिंग (Gender)
        { q: "'दही' शब्द का लिंग क्या है?", o: ["पुल्लिंग", "स्त्रीलिंग", "नपुंसक लिंग", "उभय लिंग"], a: 0, t: "दही खट्टा है (अपवाद: ई-कारांत पुल्लिंग)।" },
        { q: "'कवि' का शुद्ध स्त्रीलिंग रूप है:", o: ["कवयित्री", "कवियित्री", "कवयत्री", "कवियत्री"], a: 0, t: "शुद्ध वर्तनी 'कवयित्री' है।" },
        { q: "'विद्वान' शब्द का स्त्रीलिंग है:", o: ["विदुषी", "विद्वंती", "विद्यामती", "विद्वानिन"], a: 0, t: "विदुषी।" },
        { q: "निम्नलिखित में पुल्लिंग शब्द है:", o: ["आशा", "कष्ट", "क्षमा", "सेना"], a: 1, t: "कष्ट हुआ।" },
        { q: "इनमें से कौन-सा शब्द स्त्रीलिंग है?", o: ["विवाद", "सार", "रूप", "आय"], a: 3, t: "आय बढ़ी।" },
        { q: "'ठाकुर' का स्त्रीलिंग है:", o: ["ठाकुराइन", "ठाकुरानी", "ठाकुरिन", "ठाकुरी"], a: 0, t: "ठाकुराइन।" },
        { q: "'गीदड़' का स्त्रीलिंग क्या होगा?", o: ["गीदड़िन", "गीदड़नी", "गीदड़ी", "गीदड़िया"], a: 2, t: "गीदड़ी।" },
        { q: "'दाता' का स्त्रीलिंग शब्द है:", o: ["दाती", "दात्री", "धात्री", "दातृ"], a: 1, t: "दात्री।" },
        { q: "'महान' का स्त्रीलिंग रूप है:", o: ["महती", "महता", "महानी", "महतनी"], a: 0, t: "महती।" },
        { q: "निम्नलिखित में से कौन-सा शब्द पुल्लिंग है?", o: ["मंजिल", "मर्यादा", "भरमार", "पुलिंदा"], a: 3, t: "पुलिंदा भारी है।" },
        { q: "'नेत्री' का पुल्लिंग रूप है:", o: ["नेता", "नेत्र", "नेति", "नेताजी"], a: 0, t: "नेता।" },

        // 51-75: वचन (Number)
        { q: "'प्राण' शब्द का प्रयोग सदैव होता है:", o: ["एकवचन", "बहुवचन", "दोनों", "कोई नहीं"], a: 1, t: "प्राण हमेशा बहुवचन है।" },
        { q: "'चिड़िया' का बहुवचन रूप है:", o: ["चिड़ियाँ", "चिड़ियों", "चिड़ियाएँ", "चिड़ियाओं"], a: 0, t: "स्त्रीलिंग शब्दों के अंत में 'या' होने पर चंद्रबिंदु लगता है।" },

        'D': [50,99,2,75,12,88,33,64,1,44,81,19,92,7,55,30,85,11,66,23,77,4,41,95,20,69,8,52,15,83,37,70,98,28,61,46,90,16,59,10,48,93,24,63,89,35,72,9,51,84,18,60,97,26,56,40,87,31,67,91,22,54,86,13,58,94,32,65,74,39,82,14,53,79,25,68,96,3,45,80,17,62,71,34,57,78,6,43,76,21,49,73,5,42,47,38,29,36,0,13,11]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `मास्टर टेस्ट - SET ${type}`;

        const indices = orders[type];
        currentQuestions = indices.map(idx => questionsPool[idx]);

        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);

        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br>व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब: <b>${item.o[item.a]}</b> <br>व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            buttons[selIdx].classList.add('correct');
            feed.innerHTML = `✅ सही उत्तर! <br>व्याख्या: ${item.t}`;
        } else {
            buttons[selIdx].classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब: <b>${item.o[item.a]}</b> <br>व्याख्या: ${item.t}`;
        }
        feed.style.display = "block";
    }

    function changePage(dir) {
        currentPage += dir;
        renderPage(currentPage);
    }
</script>
