<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>संज्ञा-लिंग-वचन-कारक मास्टर क्विज़</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f1f2f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Screen */
        #selection-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .selection-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 90%;
        }
        .set-btn {
            display: inline-block;
            width: 130px;
            padding: 18px;
            margin: 10px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.1); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; }
    </style>
</head>
<body>

<div id="selection-screen">
    <div class="selection-box">
        <h1 style="margin-top:0; color: #2c3e50;">हिन्दी व्याकरण: मास्टर टेस्ट</h1>
        <p style="font-size: 1.1em; color: #555;">संज्ञा, लिंग, वचन और कारक (100 प्रश्न)<br>एक सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadMixedSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadMixedSet('B')">SET B</button><br>
        <button class="set-btn btn-c" onclick="loadMixedSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadMixedSet('D')">SET D</button>
        <p style="font-size: 0.9em; margin-top: 15px; color: #7f8c8d;">नोट: प्रत्येक सेट का क्रम फिक्स है।</p>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">व्याकरण क्विज़</h1>
        <p>उच्च स्तरीय अभ्यास - 4 पेज</p>
    </header>

    <div class="stats-bar">
        <div id="scoreDisplay">स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>

    <div id="quiz-content"></div>

    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    // 100 UNIQUE QUESTIONS - Sangya, Ling, Vachan, Karak
    const baseData = [
        // संज्ञा (Sangya) - 25 Questions
        { q: "'हरियाली' में कौन-सी संज्ञा है?", o: ["जातिवाचक", "समूहवाचक", "भाववाचक", "व्यक्तिवाचक"], a: 2, t: "विशेषण 'हरा' से बनी भाववाचक संज्ञा।" },
        { q: "निम्न में से कौन-सा शब्द 'व्यक्तिवाचक संज्ञा' है?", o: ["गाय", "पहाड़", "यमुना", "आम"], a: 2, t: "यमुना एक विशेष नदी का नाम है।" },
        { q: "'बुढ़ापा' एक प्रकार का अभिशाप है। रेखांकित शब्द की संज्ञा है:", o: ["जातिवाचक", "भाववाचक", "व्यक्तिवाचक", "समूहवाचक"], a: 1, t: "अवस्था या गुण दर्शाने वाले शब्द भाववाचक होते हैं।" },
        { q: "'जातिवाचक संज्ञा' शब्द है:", o: ["कामायनी", "आम", "रसीला", "वकील"], a: 3, t: "वकील एक पूरे व्यवसाय/जाति का बोध कराता है।" },
        { q: "स्त्रीत्व शब्द में कौन-सी संज्ञा है?", o: ["जातिवाचक", "व्यक्तिवाचक", "भाववाचक", "द्रव्यवाचक"], a: 2, t: "भाववाचक संज्ञा।" },
        { q: "भाववाचक संज्ञा बनाइए:", o: ["लड़का", "लड़काई", "लड़कपन", "लड़कापन"], a: 2, t: "लड़कपन शुद्ध भाववाचक रूप है।" },
        { q: "'सच्चरित्रता' किस मूल शब्द से बना है?", o: ["सतचरित्र", "चरित्र", "चरित्रता", "सच्चरित्र"], a: 1, t: "मूल शब्द 'चरित्र' है।" },
        { q: "निम्नलिखित में से कौन-सा शब्द 'द्रव्यवाचक संज्ञा' है?", o: ["खटाई", "मिठाई", "दूध", "ठंड"], a: 2, t: "मापी-तोली जाने वाली वस्तुएं द्रव्यवाचक होती हैं।" },
        { q: "राज्यपाल में कौन-सी संज्ञा है?", o: ["व्यक्तिवाचक", "जातिवाचक", "भाववाचक", "समूहवाचक"], a: 1, t: "पद का नाम हमेशा जातिवाचक होता है।" },
        { q: "'भीड़' शब्द व्याकरण की दृष्टि से क्या है?", o: ["जातिवाचक", "भाववाचक", "समूहवाचक", "द्रव्यवाचक"], a: 2, t: "व्यक्तियों का समूह।" },
        { q: "'पंडित' से बनी भाववाचक संज्ञा है:", o: ["पंडिताऊ", "पांडित्य", "पंडितानी", "ये सभी"], a: 1, t: "पांडित्य शुद्ध भाववाचक संज्ञा है।" },
        { q: "'सुंदर' की भाववाचक संज्ञा क्या है?", o: ["सुंदरता", "सौंदर्य", "केवल A", "A और B दोनों"], a: 3, t: "सुंदरता और सौंदर्य दोनों सही हैं।" },
        { q: "'मिठास' शब्द है:", o: ["द्रव्यवाचक", "जातिवाचक", "भाववाचक", "व्यक्तिवाचक"], a: 2, t: "स्वाद का अनुभव भाववाचक है।" },
        { q: "'कोयला' में कौन-सी संज्ञा है?", o: ["जातिवाचक", "द्रव्यवाचक", "समूहवाचक", "भाववाचक"], a: 1, t: "ईंधन द्रव्यवाचक में आता है।" },
        { q: "'कक्षा' शब्द संज्ञा के किस भेद के अंतर्गत आता है?", o: ["व्यक्तिवाचक", "जातिवाचक", "समूहवाचक", "भाववाचक"], a: 2, t: "छात्रों का समूह।" },
        { q: "'गांधी' को राष्ट्रपिता कहा गया है। यहाँ 'गांधी' शब्द है:", o: ["जातिवाचक से व्यक्तिवाचक", "व्यक्तिवाचक से जातिवाचक", "विशेषण", "भाववाचक"], a: 0, t: "यहाँ गांधी उपनाम एक विशेष व्यक्ति (महात्मा गांधी) के लिए प्रयुक्त है।" },
        { q: "'आज भी भारत में श्रवण कुमार पैदा होते हैं।' वाक्य में 'श्रवण कुमार' है:", o: ["व्यक्तिवाचक", "भाववाचक", "जातिवाचक", "समूहवाचक"], a: 2, t: "यहाँ विशेष गुण वाले व्यक्तियों की श्रेणी/जाति का बोध हो रहा है।" },
        { q: "'पशु' चर रहे हैं। रेखांकित पद है:", o: ["व्यक्तिवाचक", "जातिवाचक", "भाववाचक", "द्रव्यवाचक"], a: 1, t: "संपूर्ण पशु वर्ग का बोध।" },
        { q: "'क्रोध' शब्द में संज्ञा है:", o: ["भाववाचक", "जातिवाचक", "व्यक्तिवाचक", "समूहवाचक"], a: 0, t: "भाव।" },
        { q: "क्रिया से बनने वाली भाववाचक संज्ञा है:", o: ["थकावट", "बुढ़ापा", "आलस्य", "बुराई"], a: 0, t: "थकना (क्रिया) + आवट = थकावट।" },
        { q: "निम्नलिखित में से संज्ञा शब्द है:", o: ["नीला", "पुराना", "गंगा", "मोटा"], a: 2, t: "गंगा नाम है, बाकी विशेषण हैं।" },
        { q: "लड़का दौड़ता है। इस वाक्य में 'लड़का' किस संज्ञा का उदाहरण है?", o: ["व्यक्तिवाचक", "जातिवाचक", "भाववाचक", "समूहवाचक"], a: 1, t: "जातिवाचक।" },
        { q: "कवि शब्द में कौन सी संज्ञा है?", o: ["व्यक्तिवाचक", "जातिवाचक", "द्रव्यवाचक", "समूहवाचक"], a: 1, t: "पूरी श्रेणी का बोध।" },
        { q: "जिन संज्ञाओं से एक ही प्रकार की वस्तुओं अथवा व्यक्तियों का बोध हो, उन्हें कहते हैं:", o: ["व्यक्तिवाचक", "जातिवाचक", "भाववाचक", "द्रव्यवाचक"], a: 1, t: "जातिवाचक की परिभाषा।" },
        { q: "मना की भाववाचक संज्ञा क्या है?", o: ["मनास", "मनाही", "मन", "मनसा"], a: 1, t: "मनाही।" },

        // लिंग (Ling) - 25 Questions
        { q: "निम्नलिखित में से कौन-सा शब्द 'पुल्लिंग' है?", o: ["आशा", "कष्ट", "क्षमा", "सेना"], a: 1, t: "कष्ट हुआ (पुल्लिंग), बाकी स्त्रीलिंग हैं।" },
        { q: "निम्न में से 'स्त्रीलिंग' शब्द कौन-सा है?", o: ["विवाद", "सार", "रूप", "आय"], a: 3, t: "आय हुई (स्त्रीलिंग)।" },
        { q: "'दही' शब्द का लिंग क्या है?", o: ["पुल्लिंग", "स्त्रीलिंग", "नपुंसक लिंग", "उभय लिंग"], a: 0, t: "दही खट्टा है (अपवाद: ई-कारांत होते हुए भी पुल्लिंग)।" },
        { q: "इनमें से कौन-सा शब्द स्त्रीलिंग है?", o: ["छाछ", "तिल", "काढ़ा", "टेसू"], a: 0, t: "छाछ पी (स्त्रीलिंग)।" },
        { q: "'कवि' का स्त्रीलिंग रूप है:", o: ["कवयित्री", "कवियित्री", "कवयित्री", "कवयत्री"], a: 2, t: "शुद्ध वर्तनी 'कवयित्री' (C) है।" },
        { q: "'विद्वान' शब्द का स्त्रीलिंग क्या होगा?", o: ["विदुषी", "विद्वंती", "विद्यामती", "विद्वानिन"], a: 0, t: "विदुषी।" },
        { q: "'ठाकुर' शब्द का स्त्रीलिंग है:", o: ["ठाकुराइन", "ठाकुरानी", "ठाकुरिन", "ठाकुरी"], a: 0, t: "ठाकुराइन।" },
        { q: "कौन-सा शब्द पुल्लिंग है?", o: ["मंज़िल", "भरमार", "मर्यादा", "पुलिंदा"], a: 3, t: "पुलिंदा बड़ा है।" },
        { q: "निम्नलिखित में से 'गीदड़' का स्त्रीलिंग क्या होगा?", o: ["गीदड़िन", "गीदड़नी", "गीदड़ी", "गीदड़िया"], a: 2, t: "गीदड़ी।" },
        { q: "लिंग की दृष्टि से 'दही' क्या है?", o: ["स्त्रीलिंग", "पुल्लिंग", "नपुंसक लिंग", "उभयलिंग"], a: 1, t: "पुल्लिंग।" },
        { q: "निम्न में स्त्रीलिंग शब्द है:", o: ["दुःख", "गरिमा", "लेख", "स्पर्श"], a: 1, t: "गरिमा बढ़ी।" },
        { q: "'दाता' शब्द का स्त्रीलिंग शब्द क्या है?", o: ["दाती", "दातृ", "दात्री", "धात्री"], a: 2, t: "दात्री।" },

        { q: "कौन-सा शब्द स्त्रीलिंग है?", o: ["सहारा", "सूचीपत्र", "सीआर", "परिषद"], a: 3, t: "परिषद बैठी।" },

        { q: "बालक का स्त्रीलिंग है:", o: ["बालिका", "बालकी", "बालि", "बाला"], a: 0, t: "बालिका।" },
        { q: "वीर का स्त्रीलिंग है:", o: ["वारांगना", "वीरगति", "वीरांगना", "वीरावती"], a: 2, t: "वीरांगना।" },
        { q: "ऋषि का स्त्रीलिंग है:", o: ["ऋषिणी", "ऋषिपत्नी", "ऋषिका", "ऋषि"], a: 2, t: "ऋषिका।" },
        { q: "जेठ का स्त्रीलिंग शब्द क्या है?", o: ["जेठिन", "जेठराइन", "जेठानी", "जेठिनि"], a: 2, t: "जेठानी।" },
        { q: "अध्यापक का स्त्रीलिंग है:", o: ["अध्यापकी", "अध्यापिका", "अध्यापकिन", "अध्यापिकि"], a: 1, t: "अध्यापिका।" },
        { q: "महान का स्त्रीलिंग है:", o: ["महती", "महता", "महानी", "महतनी"], a: 0, t: "महती।" },
        { q: "निम्नलिखित में पुल्लिंग शब्द है:", o: ["नदी", "पानी", "इलायची", "प्यास"], a: 1, t: "पानी पिया (अपवाद)।" },
        { q: "हाथी का स्त्रीलिंग होगा:", o: ["हाथिन", "हाथिनी", "हथिनी", "हथिनि"], a: 2, t: "हथिनी शुद्ध रूप है।" },

        // वचन (Vachan) - 25 Questions

        // कारक (Karak) - 25 Questions
        { q: "'माँ ने बच्चे को सुलाया।' इस वाक्य में 'को' किस कारक की विभक्ति है?", o: ["कर्ता", "कर्म", "करण", "सम्प्रदान"], a: 1, t: "क्रिया का प्रभाव बच्चे पर है।" },

        { q: "'लड़के ने पुस्तक पढ़ी है।' वाक्य में कारक है:", o: ["कर्ता", "कर्म", "करण", "अपादान"], a: 0, t: "लड़के 'ने'।" },
        { q: "'हे प्रभु! रक्षा करो।' इसमें कौन सा कारक है?", o: ["कर्ता", "संबोधन", "अधिकरण", "संबंध"], a: 1, t: "पुकारने का भाव।" },
        { q: "'को' और 'के लिए' किस कारक के चिह्न हैं?", o: ["सम्प्रदान", "करण", "अपादान", "संबोधन"], a: 0, t: "सम्प्रदान।" },
        { q: "'गरीबों को वस्त्र दो।' वाक्य में कारक है:", o: ["करण", "सम्प्रदान", "अपादान", "कर्म"], a: 1, t: "दान देने या किसी के हित में कार्य करने पर सम्प्रदान होता है।" },
        { q: "'राम की गाय चरती है।' वाक्य में कारक है:", o: ["कर्ता", "कर्म", "संबंध", "अधिकरण"], a: 2, t: "'की' संबंध कारक है।" },

        { q: "क्रिया का आधार सूचित करने वाला कारक है:", o: ["अपादान", "संबंध", "अधिकरण", "सम्प्रदान"], a: 2, t: "अधिकरण आधार बताता है।" },
        { q: "'ठीक समय पर आ जाना।' वाक्य में कारक है:", o: ["कर्म", "करण", "सम्प्रदान", "अधिकरण"], a: 3, t: "'पर' अधिकरण।" },
        { q: "कारक के कितने भेद हैं?", o: ["सात", "आठ", "नौ", "दस"], a: 1, t: "आठ।" },
        { q: "'वृक्षों से पत्ते झड़ते हैं।' इसमें 'से' किस कारक का चिह्न है?", o: ["करण", "सम्प्रदान", "अपादान", "अधिकरण"], a: 2, t: "अपादान।" },
        { q: "'अपादान' कारक का उदाहरण है:", o: ["सुरेश ने धोबी को कपड़े दिए", "राम ने बाण से मारा", "गंगा हिमालय से निकलती है", "राजा ने मंत्री को बुलाया"], a: 2, t: "हिमालय से अलग होना।" },
        { q: "'राम ने' में कौन सा कारक है?", o: ["कर्ता", "कर्म", "करण", "सम्प्रदान"], a: 0, t: "कर्ता 'ने'।" },
        { q: "'मैं तीन मिनट में आ रहा हूँ।' वाक्य में कारक है:", o: ["कर्ता", "संबंध", "अधिकरण", "सम्प्रदान"], a: 2, t: "समय का आधार अधिकरण है।" },
        { q: "'कुर्सी पर मास्टर जी बैठे हैं।' इसमें 'कुर्सी' शब्द किस कारक में है?", o: ["करण", "सम्प्रदान", "संबंध", "अधिकरण"], a: 3, t: "अधिकरण।" },
        { q: "'राजा भिक्षुक को दान देता है।' वाक्य में कौन सा कारक है?", o: ["कर्म", "अपादान", "सम्प्रदान", "करण"], a: 2, t: "सम्प्रदान।" },
        { q: "'पेड़ से फल गिरा।' वाक्य में 'से' विभक्ति है:", o: ["करण", "अपादान", "संबंध", "अधिकरण"], a: 1, t: "अपादान।" },
        { q: "'राम अयोध्या के राजा थे।' वाक्य में कारक है:", o: ["कर्ता", "कर्म", "संबंध", "अधिकरण"], a: 2, t: "अयोध्या 'के' राजा।" },
        { q: "'वह कुल्हाड़ी से वृक्ष काटता है।' वाक्य में कारक है:", o: ["कर्ता", "करण", "अपादान", "सम्प्रदान"], a: 1, t: "कुल्हाड़ी साधन है।" },
        { q: "'का, की, के' किस कारक की विभक्तियाँ हैं?", o: ["कर्ता", "संबंध", "अपादान", "करण"], a: 1, t: "संबंध।" },
        { q: "'क्रिया का जनक' किसे कहा जाता है?", o: ["संज्ञा", "कारक", "विशेषण", "वचन"], a: 1, t: "कारक।" }
    ];

    // --- Hardcoded Fixed Orders ---
    const orders = {
        'A': Array.from({length: 100}, (_, i) => i),
        'B': Array.from({length: 100}, (_, i) => 99 - i),
        'C': [42,8,91,25,67,5,84,33,19,56,4,72,99,0,88,11,37,64,22,95,50,6,81,15,44,79,3,28,60,93,48,7,12,85,55,2,39,70,96,17,45,29,62,82,31,69,94,20,53,86,9,26,41,74,30,63,97,18,51,87,1,43,24,65,35,76,92,10,54,89,21,46,73,98,34,58,16,49,71,40,68,23,57,80,36,61,90,14,52,78,32,59,83,47,66,75,38,27,77,13],
        'D': [50,99,2,75,12,88,33,64,1,44,81,19,92,7,55,30,85,11,66,23,77,4,41,95,20,69,8,52,15,83,37,70,98,28,61,46,90,16,59,10,48,93,24,63,89,35,72,9,51,84,18,60,97,26,56,40,87,31,67,91,22,54,86,13,58,94,32,65,74,39,82,14,53,79,25,68,96,3,45,80,17,62,71,34,57,78,6,43,76,21,49,73,5,42,65,47,38,29,36,0]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadMixedSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `व्याकरण मास्टर - SET ${type}`;

        const indices = orders[type];
        currentQuestions = indices.map(idx => baseData[idx]);

        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);

        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br> व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब है: <b>${item.o[item.a]}</b> <br> व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            buttons[selIdx].classList.add('correct');
            feed.innerHTML = `✅ सही! <br> व्याख्या: ${item.t}`;
        } else {
            buttons[selIdx].classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही: <b>${item.o[item.a]}</b> <br> व्याख्या: ${item.t}`;
        }
        feed.style.display = "block";
    }

    function changePage(dir) {
        currentPage += dir;
        renderPage(currentPage);
    }
</script>
