<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON मास्टर क्विज़ सिस्टम</title>
    <style>
        :root {
            --primary: #1a73e8;
            --dark: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Loading & Selection Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000; color: white; text-align: center;
        }
        .menu-box {
            background: white; padding: 30px; border-radius: 15px; color: #333;
            width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn-list { max-height: 350px; overflow-y: auto; margin-top: 20px; padding: 5px; }
        
        /* Professional Buttons */
        .btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            font-size: 1.1em; font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; transition: 0.3s;
        }
        .topic-btn { background: var(--primary); color: white; text-transform: uppercase; }
        .set-btn { background: #8e44ad; color: white; display: inline-block; width: 45%; margin: 5px; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--primary); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; background: var(--dark); color: white; padding: 15px 20px; border-radius: 0 0 10px 10px; margin-bottom: 20px; font-weight: bold; }
        .q-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--primary); }
        .exam-tag { font-size: 0.85em; color: #1a73e8; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; line-height: 1.4; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 14px; border: 1px solid #dee2e6; background: #fff; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1em; transition: 0.2s; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 15px; border-radius: 5px; background: #e8f0fe; border-left: 4px solid var(--primary); line-height: 1.6; font-size: 0.95em; }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 12px 30px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="topic-screen" class="overlay">
    <div class="menu-box">
        <h2 id="loading-msg">डेटाबेस स्कैन किया जा रहा है...</h2>
        <div id="file-list" class="btn-list"></div>
        <button class="btn" style="background:#666; color:white; margin-top:20px;" onclick="window.location.href='index.html'">वापस डैशबोर्ड पर</button>
    </div>
</div>

<div id="set-screen" class="overlay" style="display: none;">
    <div class="menu-box">
        <h2 id="selected-topic-title" style="color:var(--primary)">विषय</h2>
        <p>कृपया अभ्यास के लिए सेट चुनें (क्रम स्थिर रहेगा):</p>
        <button class="btn set-btn" onclick="applySet('A')">SET A</button>
        <button class="btn set-btn" onclick="applySet('B')">SET B</button>
        <button class="btn set-btn" onclick="applySet('C')">SET C</button>
        <button class="btn set-btn" onclick="applySet('D')">SET D</button>
    </div>
</div>

<div class="container" id="quiz-container">
    <header>
        <h1 id="quiz-header-title">हिन्दी टेस्ट</h1>
    </header>

    <div class="stats-bar">
        <div id="scoreDisplay">स्कोर: 0 / 0</div>
        <div id="pageDisplay">पेज: 1</div>
    </div>

    <div id="quiz-content"></div>

    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    // --- कॉन्फ़िगरेशन (आपकी रिपॉजिटरी से लिंक) ---
    const GITHUB_USER = "govindmobilebhaisma-sys"; 
    const GITHUB_REPO = "quizzz";

    let rawQuestions = [];  // JSON से आया शुद्ध डेटा
    let quizData = [];     // सेट के हिसाब से जंबल्ड डेटा
    let userSelections = {};
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;

    // 1. रिपॉजिटरी से JSON फाइलें ढूंढना
    async function scanRepoForJSON() {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
        try {
            const res = await fetch(url);
            const files = await res.json();
            const jsonFiles = files.filter(f => f.name.endsWith('.json'));
            
            const listDiv = document.getElementById('file-list');
            document.getElementById('loading-msg').innerText = "अपना टेस्ट चुनें:";
            
            if(jsonFiles.length === 0) {
                listDiv.innerHTML = "<p style='color:red'>कोई JSON फाइल नहीं मिली!</p>";
                return;
            }

            jsonFiles.forEach(file => {
                const btn = document.createElement('button');
                btn.className = 'btn topic-btn';
                btn.innerText = file.name.replace('.json', '').replace(/_/g, ' ');
                btn.onclick = () => fetchJSONContent(file.download_url, file.name);
                listDiv.appendChild(btn);
            });
        } catch (e) {
            document.getElementById('loading-msg').innerText = "GitHub कनेक्शन एरर!";
        }
    }

    // 2. फाइल लोड करना और आपके फॉर्मेट के हिसाब से मैप करना
    async function fetchJSONContent(url, filename) {
        document.getElementById('loading-msg').innerText = "प्रश्न लोड हो रहे हैं...";
        try {
            const res = await fetch(url);
            const data = await res.json();
            
            // आपके JSON फॉर्मेट को कनवर्ट करना (a,b,c,d -> 0,1,2,3)
            rawQuestions = data.map(item => ({
                id: item.id,
                tag: item.exam_tag || "HINDI EXAM",
                q: item.question,
                o: [item.options.a, item.options.b, item.options.c, item.options.d],
                a: item.answer.toLowerCase().trim().charCodeAt(0) - 97, // a=0, b=1...
                exp: item.explanation
            }));

            document.getElementById('topic-screen').style.display = 'none';
            document.getElementById('set-screen').style.display = 'flex';
            document.getElementById('selected-topic-title').innerText = filename.replace('.json', '').toUpperCase();
        } catch (e) {
            alert("JSON लोड करने में समस्या: " + e.message);
        }
    }

    // 3. फिक्स्ड मिक्सिंग लॉजिक (A, B, C, D)
    function applySet(setID) {
        document.getElementById('set-screen').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('quiz-header-title').innerText = document.getElementById('selected-topic-title').innerText + " (" + setID + ")";

        const total = rawQuestions.length;
        let indices = Array.from({length: total}, (_, i) => i);

        // Fixed Mixed Orders
        if (setID === 'B') indices.reverse();
        if (setID === 'C') {
            let odd = indices.filter(i => i % 2 !== 0);
            let even = indices.filter(i => i % 2 === 0);
            indices = odd.concat(even);
        }
        if (setID === 'D') {
            // Pseudo-random fixed jump
            let jumpIndices = [];
            for(let i=0; i<total; i++) jumpIndices.push((i * 7) % total);
            indices = [...new Set(jumpIndices)];
            // Fill any missing gaps
            for(let i=0; i<total; i++) if(!indices.includes(i)) indices.push(i);
        }

        quizData = indices.map(i => rawQuestions[i]);
        renderPage(0);
    }

    // 4. रेंडरिंग इंजन
    function renderPage(page) {
        const content = document.getElementById('quiz-content');
        content.innerHTML = "";
        const start = page * qPerPage;
        const end = Math.min(start + qPerPage, quizData.length);
        const pageQs = quizData.slice(start, end);

        pageQs.forEach((item, i) => {
            const idx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="exam-tag">${item.tag}</div>
                <div class="q-text">${idx + 1}. ${item.q}</div>
                <div class="options" id="opts-${idx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="handleAnswer(${idx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${idx}"></div>
            `;
            content.appendChild(card);
            if (userSelections[idx] !== undefined) restoreQuestionState(idx);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / ${Math.ceil(quizData.length/qPerPage)}`;
        document.getElementById('scoreDisplay').innerText = `स्कोर: ${score} / ${quizData.length}`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (end >= quizData.length);
        window.scrollTo(0,0);
    }

    function handleAnswer(qIdx, selIdx, btn) {
        const item = quizData[qIdx];
        const buttons = document.getElementById(`opts-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);

        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
        }
        
        feed.innerHTML = `<strong>व्याख्या:</strong><br>${item.exp}`;
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `स्कोर: ${score} / ${quizData.length}`;
    }

    function restoreQuestionState(idx) {
        const selIdx = userSelections[idx];
        const item = quizData[idx];
        const buttons = document.getElementById(`opts-${idx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${idx}`);
        
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) buttons[selIdx].classList.add('correct');
        else {
            buttons[selIdx].classList.add('wrong');
            buttons[item.a].classList.add('correct');
        }
        feed.innerHTML = `<strong>व्याख्या:</strong><br>${item.exp}`;
        feed.style.display = "block";
    }

    function changePage(dir) {
        currentPage += dir;
        renderPage(currentPage);
    }

    // Initialize
    scanRepoForJSON();
</script>
</body>
</html>
