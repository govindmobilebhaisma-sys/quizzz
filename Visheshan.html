<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विशेषण मास्टर क्विज़ - 100 प्रश्न</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 450px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">हिन्दी व्याकरण: विशेषण मास्टर</h2>
        <p>प्रतियोगी परीक्षा हेतु 100 महत्वपूर्ण प्रश्न।<br>कृपया अपना सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">विशेषण (Adjective) क्विज़</h1>
        <p>100 कठिन प्रश्न | 4 पेज</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    const questionsPool = [
        { q: "'वह बहुत चतुर बालक है' - इस वाक्य में 'बहुत' क्या है?", o: ["विशेषण", "विशेष्य", "प्रविशेषण", "क्रियाविशेषण"], a: 2, t: "जो शब्द विशेषण की भी विशेषता बताए, उसे प्रविशेषण कहते हैं।" },
        { q: "'संज्ञा या सर्वनाम की विशेषता बताने वाले शब्दों को क्या कहते हैं?", o: ["विशेष्य", "विशेषण", "क्रिया", "उपसर्ग"], a: 1, t: "विशेषण की परिभाषा।" },
        { q: "'कश्मीरी सेब सिंदूरी लाल होता है' - इसमें 'सिंदूरी' क्या है?", o: ["गुणवाचक विशेषण", "परिमाणवाचक विशेषण", "प्रविशेषण", "सार्वनामिक विशेषण"], a: 2, t: "यहाँ 'सिंदूरी' विशेषण 'लाल' की विशेषता बता रहा है।" },
        { q: "'अर्चना अत्यंत सुंदर है' - वाक्य में 'सुंदर' शब्द है:", o: ["प्रविशेषण", "सविशेषण", "विशेषण", "विशेष्य"], a: 2, t: "सुंदर मुख्य विशेषण है।" },
        { q: "'ऋषि' शब्द का विशेषण रूप क्या होगा?", o: ["आर्ष", "ऋषिकल्प", "ऋषिवत", "ऋषिणी"], a: 0, t: "ऋषि का विशेषण 'आर्ष' होता है (कठिन स्तर)।" },
        { q: "विशेषण के मुख्य रूप से कितने भेद होते हैं?", o: ["तीन", "चार", "पाँच", "छह"], a: 1, t: "गुणवाचक, संख्यावाचक, परिमाणवाचक और सार्वनामिक।" },
        { q: "'दो किलो दूध' में कौन-सा विशेषण है?", o: ["निश्चित संख्यावाचक", "अनिश्चित परिमाणवाचक", "निश्चित परिमाणवाचक", "गुणवाचक"], a: 2, t: "मात्रा निश्चित है।" },
        { q: "'चौथाई' शब्द में विशेषण है:", o: ["आवृत्तिवाचक", "गणनावाचक", "क्रमवाचक", "अपूर्णकबोधक"], a: 3, t: "पूर्ण संख्या न होने के कारण अपूर्णकबोधक।" },
        { q: "इनमें से कौन-सा शब्द विशेषण है?", o: ["आग", "आग्नेय", "अग्नि", "उपरोक्त कोई नहीं"], a: 1, t: "अग्नि (संज्ञा) से बना विशेषण 'आग्नेय' है।" },
        { q: "ठंडा पानी ठंड पैदा करता है। इस वाक्य में 'विशेष्य' शब्द कौन-सा है?", o: ["ठंडा", "ठंड", "पानी", "पैदा"], a: 2, t: "जिसकी विशेषता बताई जाए (पानी) वह विशेष्य है।" },
        { q: "'समुद्री साँप में घातक परन्तु बहुत कीमती जहर पाया जाता है' - वाक्य में कितने विशेषण और विशेष्य हैं?", o: ["2 विशेषण, 2 विशेष्य", "3 विशेषण, 2 विशेष्य", "2 विशेषण, 3 विशेष्य", "4 विशेषण, 2 विशेष्य"], a: 1, t: "विशेषण: समुद्री, घातक, कीमती। विशेष्य: साँप, जहर।" },
        { q: "'दशरथ के प्राण राम के लिए आकुल थे' - वाक्य में मुख्य विशेष्य क्या है?", o: ["दशरथ", "प्राण", "राम", "आकुल"], a: 1, t: "यहाँ 'प्राण' की विशेषता बताई जा रही है।" },
        { q: "नीचे दिए गए किस वाक्य में विशेषण का प्रयोग हुआ है?", o: ["राम और श्याम भाई हैं", "राम ने माँ से पानी माँगा", "राम ने रोटी खाकर और रोटी माँगी", "माँ ने खाने में दाल बनाई"], a: 2, t: "यहाँ 'और' विशेषण के रूप में प्रयुक्त है (अनिश्चित परिमाण)।" },
        { q: "'धुंधला' शब्द में विशेषण है:", o: ["संख्यावाचक", "गुणवाचक", "सार्वनामिक", "परिमाणवाचक"], a: 1, t: "धुंधला एक गुण/दशा है।" },
        { q: "'शरीखा' शब्द में विशेषण है:", o: ["गणनावाचक", "गुणवाचक", "समुदायवाचक", "क्रमवाचक"], a: 1, t: "गुणवाचक।" },
        { q: "'तीसरा' शब्द में विशेषण है:", o: ["पूर्णांकबोधक", "आवृत्तिवाचक", "गणनावाचक", "क्रमवाचक"], a: 3, t: "पहला, दूसरा, तीसरा क्रम दर्शाते हैं।" },
        { q: "'राम की गाय बहुत काली है' - इसमें 'काली' शब्द है:", o: ["सर्वनाम", "विशेष्य", "विशेषण", "प्रविशेषण"], a: 2, t: "काली विशेषण है।" },
        { q: "'चारों' शब्द किस प्रकार का विशेषण है?", o: ["गणनावाचक", "क्रमवाचक", "आवृत्तिवाचक", "समुदायवाचक"], a: 3, t: "समूह या समुदाय का बोध।" },
        { q: "विशेषण जिस संज्ञा की विशेषता बताता है उसे क्या कहते हैं?", o: ["संख्यावाचक विशेषण", "विशेष्य", "प्रविशेषण", "सार्वनामिक विशेषण"], a: 1, t: "विशेष्य।" },
        { q: "निम्नलिखित में से कौन-सा शब्द विशेषण है?", o: ["कुटिलता", "जटिलता", "कौटिल्य", "कुरुप"], a: 3, t: "कुरुप विशेषण है, बाकी भाववाचक संज्ञाएं हैं।" },
        { q: "'नीली साड़ी' में कौन-सा विशेषण है?", o: ["संख्यावाचक", "परिमाणवाचक", "गुणवाचक", "सार्वनामिक"], a: 2, t: "रंग गुणवाचक में आता है।" },
        { q: "'अत्यंत' में कौन-सा विशेषण है?", o: ["परिमाणवाचक", "प्रविशेषण", "संख्यावाचक", "A और B दोनों"], a: 3, t: "यह परिमाण भी बताता है और विशेषण की विशेषता भी (प्रविशेषण)।" },
        { q: "'परिमाणवाचक विशेषण' द्वारा किसका बोध होता है?", o: ["क्रिया के होने के समय का", "क्रिया के नाप-तौल का", "क्रिया के स्थान का", "क्रिया की रीति का"], a: 1, t: "माप-तौल।" },
        { q: "'पापी' में कौन-सा विशेषण है?", o: ["संख्यावाचक", "सार्वनामिक", "गुणवाचक", "परिमाणवाचक"], a: 2, t: "दोष या गुण।" },
        { q: "वह लड़का छोटा है। यहाँ 'वह' क्या है?", o: ["निश्चयवाचक सर्वनाम", "सार्वनामिक विशेषण", "गुणवाचक विशेषण", "व्यक्तिवाचक विशेषण"], a: 1, t: "संज्ञा से पहले आकर विशेषता बताने वाला सर्वनाम।" },

        // 26-50: कठिन और तुलनात्मक
        { q: "'लड़का' शब्द से बना विशेषण है:", o: ["लड़कपन", "लड़काई", "लड़कापन", "लड़का सा"], a: 3, t: "सा/से/सी लगाकर भी विशेषण बनते हैं।" },
        { q: "'आलस्य' शब्द का विशेषण क्या है?", o: ["अलस", "अलसता", "आलसी", "आलसीपन"], a: 2, t: "आलसी व्यक्ति।" },
        { q: "'दूध' का विशेषण रूप होगा:", o: ["दूधवाला", "दुधारू", "धुधिया", "दुग्ध"], a: 1, t: "दुधारू गाय।" },
        { q: "विशेषणों की तुलना के आधार पर कितनी अवस्थाएं होती हैं?", o: ["दो", "तीन", "चार", "पाँच"], a: 1, t: "मूलावस्था, उत्तरावस्था, उत्तमावस्था।" },
        { q: "'प्रियतर' विशेषण की कौन-सी अवस्था है?", o: ["मूलावस्था", "उत्तरावस्था", "उत्तमावस्था", "कोई नहीं"], a: 1, t: "'तर' प्रत्यय उत्तरावस्था को दर्शाता है।" },
        { q: "'सुंदरतम' विशेषण की कौन-सी अवस्था है?", o: ["मूलावस्था", "उत्तरावस्था", "उत्तमावस्था", "मध्यमावस्था"], a: 2, t: "'तम' प्रत्यय उत्तमावस्था को दर्शाता है।" },
        { q: "निम्नलिखित में से कौन-सा 'गुणवाचक विशेषण' नहीं है?", o: ["गोल", "अधिक", "नुकीला", "भीतरी"], a: 1, t: "'अधिक' परिमाणवाचक है।" },
        { q: "विशेषण का प्रयोग किस स्थिति में होता है?", o: ["विशेष्य के पहले", "विशेष्य के बाद", "दोनों स्थितियों में", "उपरोक्त कोई नहीं"], a: 2, t: "उद्देश्य विशेषण और विधेय विशेषण।" },
        { q: "'थोड़ा पानी दो' - इसमें 'थोड़ा' है:", o: ["निश्चित परिमाणवाचक", "अनिश्चित परिमाणवाचक", "संख्यावाचक", "प्रविशेषण"], a: 1, t: "अनिश्चित मात्रा।" },
        { q: "'एक हरा भरा खेत' - इसमें कितने विशेषण हैं?", o: ["एक", "दो", "तीन", "चार"], a: 1, t: "एक, हरा-भरा।" },
        { q: "'सालों बाद उसका प्रवासी पति लौटा है' - इसमें विशेषण है:", o: ["सालों", "बाद", "प्रवासी", "पति"], a: 2, t: "प्रवासी पति की विशेषता है।" },
        { q: "इनमें से 'संख्यावाचक विशेषण' कौन-सा है?", o: ["सात", "काला", "रावण", "खट्टा"], a: 0, t: "सात।" },
        { q: "'योग्य' व्यक्ति ही सफल होता है - 'योग्य' क्या है?", o: ["संख्यावाचक", "परिमाणवाचक", "गुणवाचक", "सार्वनामिक"], a: 2, t: "गुण।" },
        { q: "किस वाक्य में 'गलत' विशेषण प्रयुक्त हुआ है?", o: ["कविता परिश्रमी युवती है", "प्रबुद्ध जनों से हमारा अटूट संबंध है", "यही सरकारी महिलाओं का अस्पताल है", "वह अच्छा आदमी था"], a: 2, t: "शुद्ध: 'महिलाओं का सरकारी अस्पताल' होना चाहिए।" },
        { q: "'पशु' का विशेषण है:", o: ["पाश्विक", "पशुता", "पशुत्व", "पशुपति"], a: 0, t: "पाश्विक।" },
        { q: "'निशा' का विशेषण रूप है:", o: ["निशीथ", "निशाचर", "निश", "नैश"], a: 3, t: "निशा का विशेषण 'नैश' होता है (अत्यंत कठिन)।" },
        { q: "'उत्साह' शब्द का विशेषण है:", o: ["उत्साहित", "उत्साह", "उत्साही", "A और C दोनों"], a: 3, t: "उत्साहित और उत्साही दोनों प्रयुक्त होते हैं।" },
        { q: "विशेषण की दृष्टि से अशुद्ध वाक्य है:", o: ["वह चतुर है", "वह बहुत चतुर है", "वह सबसे चतुर है", "वह बहुत सबसे चतुर है"], a: 3, t: "दो तुलनात्मक शब्द एक साथ गलत हैं।" },
        { q: "'जलीय' का विशेष्य क्या है?", o: ["जलमय", "जल", "जलकुंभी", "जलादि"], a: 1, t: "जल (संज्ञा) से जलीय (विशेषण) बना।" },

        'D': [50, 99, 2, 75, 12, 88, 33, 64, 1, 44, 81, 19, 92, 7, 55, 30, 85, 11, 66, 23, 77, 4, 41, 95, 20, 69, 8, 52, 15, 83, 37, 70, 98, 28, 61, 46, 90, 16, 59, 10, 48, 93, 24, 63, 89, 35, 72, 9, 51, 84, 18, 60, 97, 26, 56, 40, 87, 31, 67, 91, 22, 54, 86, 13, 58, 94, 32, 65, 74, 39, 82, 14, 53, 79, 25, 68, 96, 3, 45, 80, 17, 62, 71, 34, 57, 78, 6, 43, 76, 21, 49, 73, 5, 42, 65, 47, 38, 29, 36, 0]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `विशेषण मास्टर - SET ${type}`;
        const indices = orders[type];
        currentQuestions = indices.map(idx => questionsPool[idx]);
        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br>व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब है: <b>${item.o[item.a]}</b> <br>व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) { buttons[selIdx].classList.add('correct'); feed.innerHTML = `✅ सही!`; }
        else { buttons[selIdx].classList.add('wrong'); buttons[item.a].classList.add('correct'); feed.innerHTML = `❌ गलत। सही: ${item.o[item.a]}`; }
        feed.style.display = "block";
        feed.innerHTML += `<br>व्याख्या: ${item.t}`;
    }

    function changePage(dir) { currentPage += dir; renderPage(currentPage); }
