    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --success: #27ae60;
            --danger: #c0392b;
            --light: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f1f2f6; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.1em; font-weight: 600; margin-bottom: 12px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 1em; }
        button.opt-btn:hover:not(:disabled) { background: #f8f9fa; border-color: var(--accent); }
        button.correct { background: #d4edda !important; border-color: var(--success) !important; color: #155724; font-weight: bold; }
        button.wrong { background: #f8d7da !important; border-color: var(--danger) !important; color: #721c24; }
        .feedback { margin-top: 10px; padding: 8px; display: none; border-radius: 5px; font-weight: bold; background: #e9ecef; }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 25px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>

        { q: "'आकंठ' में समास है:", o: ["तत्पुरुष", "कर्मधारय", "द्विगु", "अव्ययीभाव"], a: 3, t: "अव्ययीभाव" },
        { q: "'महाकाव्य' में समास है:", o: ["तत्पुरुष", "अव्ययीभाव", "बहुव्रीहि", "कर्मधारय"], a: 3, t: "कर्मधारय" },
        { q: "'नवग्रह' में समास है:", o: ["द्वंद्व", "तत्पुरुष", "अव्ययीभाव", "द्विगु"], a: 3, t: "द्विगु" },
        { q: "'देशभक्त' का विग्रह है:", o: ["देश का भक्त", "देश के लिए भक्त", "देश भक्त", "देश में भक्त"], a: 0, t: "संबंध तत्पुरुष" },
        { q: "'राम-लक्ष्मण' में समास है:", o: ["द्विगु", "तत्पुरुष", "बहुव्रीहि", "द्वंद्व"], a: 3, t: "द्वंद्व" },
        { q: "'वनमानुष' में समास है:", o: ["अव्ययीभाव", "द्विगु", "द्वंद्व", "तत्पुरुष"], a: 3, t: "तत्पुरुष" },
        { q: "'मृगेन्द्र' में समास है:", o: ["तत्पुरुष", "कर्मधारय", "अव्ययीभाव", "बहुव्रीहि"], a: 3, t: "बहुव्रीहि" },

        // Page 4
        { q: "'शताब्दी' में समास है:", o: ["द्वंद्व", "तत्पुरुष", "अव्ययीभाव", "द्विगु"], a: 3, t: "द्विगु" },
        { q: "'अष्टाध्यायी' में समास है:", o: ["बहुव्रीहि", "द्वंद्व", "तत्पुरुष", "द्विगु"], a: 3, t: "द्विगु" },
        { q: "'नरोत्तम' का विग्रह है:", o: ["नरों में उत्तम", "नरों का उत्तम", "नरों के लिए उत्तम", "नरों से उत्तम"], a: 0, t: "अधिकरण तत्पुरुष" },
        { q: "'कमलनयन' में समास है:", o: ["बहुव्रीहि", "कर्मधारय", "तत्पुरुष", "द्वंद्व"], a: 1, t: "कर्मधारय" },
        { q: "'दीनदयाल' में समास है:", o: ["बहुव्रीहि", "कर्मधारय", "तत्पुरुष", "द्वंद्व"], a: 1, t: "कर्मधारय" },
        { q: "'बेखटके' में समास है:", o: ["तत्पुरुष", "कर्मधारय", "बहुव्रीहि", "अव्ययीभाव"], a: 3, t: "अव्ययीभाव" },
        { q: "'रामानुज' का विग्रह है:", o: ["राम का अनुज", "राम के लिए अनुज", "राम और अनुज", "राम में अनुज"], a: 0, t: "संबंध तत्पुरुष" },
        { q: "'अधमरा' में समास है:", o: ["तत्पुरुष", "अव्ययीभाव", "द्विगु", "कर्मधारय"], a: 3, t: "कर्मधारय" },
        { q: "'त्रिभुवन' में समास है:", o: ["द्वंद्व", "बहुव्रीहि", "तत्पुरुष", "द्विगु"], a: 3, t: "द्विगु" },
        { q: "'आमरण' में समास है:", o: ["तत्पुरुष", "बहुव्रीहि", "कर्मधारय", "अव्ययीभाव"], a: 3, t: "अव्ययीभाव" },
        { q: "'कपड़ा-लत्ता' में समास है:", o: ["द्विगु", "तत्पुरुष", "अव्ययीभाव", "द्वंद्व"], a: 3, t: "द्वंद्व" },
        { q: "'षडानन' में समास है:", o: ["द्विगु", "तत्पुरुष", "अव्ययीभाव", "बहुव्रीहि"], a: 3, t: "बहुव्रीहि" },
        { q: "'दुकाल' में समास है:", o: ["तत्पुरुष", "अव्ययीभाव", "द्विगु", "कर्मधारय"], a: 3, t: "कर्मधारय" },
        { q: "'रसोईघर' का विग्रह है:", o: ["रसोई के लिए घर", "रसोई का घर", "रसोई में घर", "रसोई घर"], a: 0, t: "सम्प्रदान तत्पुरुष" },
        { q: "'यथाशक्ति' शब्द किस समास का उदाहरण है?", o: ["तत्पुरुष", "बहुव्रीहि", "द्वंद्व", "अव्ययीभाव"], a: 3, t: "अव्ययीभाव" },
        { q: "'देश-विदेश' में कौन-सा समास है?", o: ["द्विगु", "तत्पुरुष", "अव्ययीभाव", "द्वंद्व"], a: 3, t: "द्वंद्व" },
        { q: "'पंचामृत' का विग्रह है:", o: ["पाँच अमृतों का समाहार", "पाँच और अमृत", "अमृत का पाँच", "अमृतों में पाँच"], a: 0, t: "द्विगु" },
        { q: "'महाकवि' में समास बताइए:", o: ["तत्पुरुष", "बहुव्रीहि", "अव्ययीभाव", "कर्मधारय"], a: 3, t: "कर्मधारय" },
        { q: "'शरणागत' का विग्रह है:", o: ["शरण को आगत", "शरण में आगत", "शरण से आगत", "शरण के लिए आगत"], a: 0, t: "कर्म तत्पुरुष" },
        { q: "'सतसई' में समास है:", o: ["द्वंद्व", "बहुव्रीहि", "तत्पुरुष", "द्विगु"], a: 3, t: "द्विगु" },
        { q: "'लंबोदर' किस समास का उदाहरण है?", o: ["कर्मधारय", "द्विगु", "तत्पुरुष", "बहुव्रीहि"], a: 3, t: "बहुव्रीहि" },
        { q: "'अनुरूप' में कौन-सा समास है?", o: ["तत्पुरुष", "कर्मधारय", "बहुव्रीहि", "अव्ययीभाव"], a: 3, t: "अव्ययीभाव" },
        { q: "'कनफटा' में समास है (एक विशेष संप्रदाय के अर्थ में):", o: ["तत्पुरुष", "द्विगु", "द्वंद्व", "बहुव्रीहि"], a: 3, t: "बहुव्रीहि" },
        { q: "'पॉकेटमार' में समास है:", o: ["अपादान तत्पुरुष", "सम्प्रदान तत्पुरुष", "संबंध तत्पुरुष", "कर्म तत्पुरुष"], a: 3, t: "कर्म तत्पुरुष (पॉकेट को मारने वाला)" },
        { q: "'अव्ययीभाव समास' का उदाहरण चुनिए:", o: ["त्रिनेत्र", "रामानुज", "पल-पल", "महादेव"], a: 2, t: "अव्ययीभाव (पुनरावृत्ति)" }
    ];

    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const currentQs = questions.slice(start, end);

        currentQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = questions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);

        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही! [${item.t}]`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही: <b>${item.o[item.a]}</b> [${item.t}]`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = questions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) buttons[selIdx].classList.add('correct');
        else {
            buttons[selIdx].classList.add('wrong');
            buttons[item.a].classList.add('correct');
        }
        feed.style.display = "block";
        feed.innerHTML = `[${item.t}]`;
    }

    function changePage(dir) {
        currentPage += dir;
        renderPage(currentPage);
    }

    renderPage(0);
</script>
