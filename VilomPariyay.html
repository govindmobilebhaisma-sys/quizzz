<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पर्यायवाची और विलोम - मास्टर क्विज़</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 480px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 12px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); line-height: 1.5; }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">पर्यायवाची एवं विलोम शब्द</h2>
        <p style="color:#666">100 कठिन प्रश्न | प्रतियोगी परीक्षा स्पेशल<br>RO/ARO, UPPSC, SSC GD</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">शब्द ज्ञान मास्टर क्विज़</h1>
        <p>पर्यायवाची (50 प्रश्न) + विलोम शब्द (50 प्रश्न)</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    const questionsPool = [
        // 1-50: पर्यायवाची (Synonyms)
        { q: "निम्नलिखित में से 'अश्व' का पर्यायवाची नहीं है?", o: ["हय", "बाजि", "कटक", "सैन्धव"], a: 2, t: "कटक सेना का पर्यायवाची है। अश्व के पर्यायवाची: हय, बाजि, तुरंग, घोटक, सैन्धव।" },
        { q: "'इन्दीवर' शब्द किसका पर्यायवाची है?", o: ["कमल", "गुलाब", "सफेद कुमुद", "नीला कमल"], a: 3, t: "इन्दीवर विशेष रूप से 'नीले कमल' को कहते हैं।" },
        { q: "'वैश्वानर' किसका पर्यायवाची शब्द है?", o: ["अग्नि", "वायु", "जल", "आकाश"], a: 0, t: "अग्नि के अन्य पर्यायवाची: हुताशन, कृशानु, पावक, अनल।" },
        { q: "'विबुध' किसका पर्यायवाची है?", o: ["पक्षी", "देवता", "बुद्धिमान", "पुष्प"], a: 1, t: "देवता के पर्यायवाची: सुर, अमर, देव, विबुध।" },
        { q: "'प्राची' का पर्यायवाची शब्द है:", o: ["प्राचीन", "प्रकृत", "पूर्व", "प्रज्ञा"], a: 2, t: "प्राची का अर्थ 'पूर्व' दिशा होता है।" },
        { q: "'तरणि' और 'तरणी' के क्रमशः अर्थ हैं:", o: ["सूर्य-नाव", "नाव-सूर्य", "युवती-सूर्य", "सूर्य-युवती"], a: 0, t: "तरणि (ह्रस्व इ) = सूर्य, तरणी (दीर्घ ई) = नाव।" },
        { q: "कौन-सा शब्द 'भ्रमर' का पर्यायवाची नहीं है?", o: ["चंचरीक", "शिलीमुख", "द्विरेफ", "द्विरद"], a: 3, t: "द्विरद हाथी को कहते हैं। भ्रमर के: अली, चंचरीक, मधुकर, मिलिंद।" },
        { q: "'षट्पद' किसका पर्यायवाची है?", o: ["तितली", "भ्रमर", "मकड़ी", "केकड़ा"], a: 1, t: "भ्रमर के छह पैर होते हैं, अतः इसे षट्पद कहते हैं।" },
        { q: "'शशांक' शब्द का पर्यायवाची है:", o: ["सूर्य", "चंद्रमा", "बादल", "किरण"], a: 1, t: "चंद्रमा के: मयंक, हिमकर, शशांक, राकापति।" },
        { q: "इनमें से 'वारिद' किसका पर्यायवाची है?", o: ["कमल", "समुद्र", "बादल", "बिजली"], a: 2, t: "वारि (जल) + द (देने वाला) = बादल।" },
        { q: "'तामरस' शब्द किसका पर्यायवाची है?", o: ["तांबा", "सोना", "कमल", "क्रोध"], a: 2, t: "तामरस कमल का पर्यायवाची है।" },
        { q: "'अतिथ' का पर्यायवाची है:", o: ["अमृतफल", "अभ्यागत", "आजन्म", "अच्युत"], a: 1, t: "अभ्यागत, पाहुन, आगंतुक।" },
        { q: "पक्षी का पर्यायवाची शब्द 'द्विज' क्यों है?", o: ["दो बार जन्म लेने वाला", "दो पंख वाला", "दो आँख वाला", "हवा में उड़ने वाला"], a: 0, t: "अंडे से और जन्म से, दो बार जन्म के कारण द्विज कहते हैं (ब्राह्मण और दांत को भी द्विज कहते हैं)।" },
        { q: "'जान्हवी' शब्द किसका पर्यायवाची है?", o: ["कुमुदनी", "रश्मि", "गंगा", "यमुना"], a: 2, t: "गंगा के: त्रिपथगा, देवपगा, सुरसरि।" },
        { q: "'मृगांक' किसका पर्यायवाची है?", o: ["हिरण", "सिंह", "चंद्रमा", "हाथी"], a: 2, t: "चंद्रमा।" },
        { q: "'केसरी' किसका पर्यायवाची है?", o: ["घोड़ा", "हाथी", "सिंह", "बंदर"], a: 2, t: "सिंह के: नाहर, केहरी, शार्दूल, वनराज।" },
        { q: "'विपिन' का अर्थ है:", o: ["बाजार", "जंगल", "शून्य", "विशाल"], a: 1, t: "जंगल के: अरण्य, कानन, कान्तार।" },
        { q: "इनमें से 'पावक' किसका पर्यायवाची है?", o: ["वायु", "जल", "अग्नि", "पृथ्वी"], a: 2, t: "अग्नि।" },
        { q: "'कौमुदी' किसका पर्यायवाची है?", o: ["चाँदनी", "चंद्रमा", "ज्योति", "रोशनी"], a: 0, t: "चाँदनी।" },
        { q: "'पुंडरीक' शब्द किसके लिए प्रयुक्त होता है?", o: ["सफेद कमल", "लाल कमल", "नीला कमल", "पीला कमल"], a: 0, t: "सफेद कमल।" },
        { q: "'सिंधुसुता' किसका पर्यायवाची है?", o: ["गंगा", "यमुना", "सरस्वती", "लक्ष्मी"], a: 3, t: "समुद्र की पुत्री अर्थात् लक्ष्मी।" },
        { q: "बादल का पर्यायवाची शब्द नहीं है:", o: ["नीरद", "तोयद", "अम्बुज", "पयोधर"], a: 2, t: "अम्बुज (जल में जन्मा) कमल को कहते हैं।" },
        { q: "'विनायक' किसका पर्यायवाची है?", o: ["विष्णु", "गणेश", "महेश", "ब्रह्मा"], a: 1, t: "गणेश।" },
        { q: "'कानन' का पर्यायवाची शब्द है:", o: ["वन", "पुष्प", "विहिप", "उपरोक्त कोई नहीं"], a: 0, t: "वन।" },
        { q: "'मार' शब्द किसका पर्यायवाची है?", o: ["जादू का", "अधम का", "स्वर्ण का", "अनंग (कामदेव) का"], a: 3, t: "मार, मन्मथ, कंदर्प, अनंग कामदेव के नाम हैं।" },
        { q: "'विशिख' किस शब्द का पर्यायवाची है?", o: ["बाण", "बुद्ध", "तरु", "सरोवर"], a: 0, t: "बाण के: तीर, शर, सायक, विशिख।" },
        { q: "'खद्योत' का अर्थ है:", o: ["गधा", "कौआ", "जुगनू", "उल्लू"], a: 2, t: "जुगनू (आकाश का प्रकाश)।" },
        { q: "'अर्णव' किसका पर्यायवाची है?", o: ["नदी", "समुद्र", "बादल", "झरना"], a: 1, t: "समुद्र के: रत्नाकर, जलधि, उदधि।" },
        { q: "'व्योम' शब्द का अर्थ है?", o: ["अंबर", "अग्नि", "वायु", "मिट्टी"], a: 0, t: "आकाश।" },
        { q: "'मनसिज' किसका पर्यायवाची है?", o: ["कामदेव", "पुष्प", "चंद्रमा", "ब्रह्मा"], a: 0, t: "मन में जन्म लेने वाला (कामदेव)।" },
        { q: "'अतनु' किसका पर्यायवाची है?", o: ["शिव", "कामदेव", "कृष्ण", "राम"], a: 1, t: "कामदेव।" },
        { q: "'पाहुन' का पर्यायवाची होगा:", o: ["पैर", "मेहमान", "पत्थर", "पर्वत"], a: 1, t: "पाहुन = अतिथि।" },
        { q: "'रजनी' का पर्यायवाची शब्द है:", o: ["दिन", "निशा", "प्रकाश", "सुबह"], a: 1, t: "रात्रि।" },
        { q: "सरस्वती का पर्यायवाची नहीं है:", o: ["शारदा", "वाणी", "वीणापाणि", "कमला"], a: 3, t: "कमला लक्ष्मी का नाम है।" },
        { q: "'कलानिधि' किसका पर्यायवाची है?", o: ["सूर्य", "चंद्रमा", "सोना", "सागर"], a: 1, t: "चंद्रमा।" },
        { q: "हाथी का पर्यायवाची शब्द है:", o: ["बाजी", "मतंग", "कुरंग", "केहरी"], a: 1, t: "मतंग, गज, कुंजर, द्विरद।" },
        { q: "'सुधाकर' किसका पर्यायवाची है?", o: ["चंद्रमा", "सूर्य", "बादल", "समुद्र"], a: 0, t: "चंद्रमा।" },
        { q: "यमुना का पर्यायवाची नहीं है:", o: ["रविजा", "तनुजा", "सूरजभान", "अर्कजा"], a: 1, t: "तनुजा बेटी को कहते हैं। यमुना: कालिंदी, अर्कजा, कृष्णा।" },
        { q: "बिजली का पर्यायवाची है:", o: ["सौदामिनी", "सरिता", "तनया", "रमणी"], a: 0, t: "तड़ित, दामिनी, चंचला, बिजली।" },
        { q: "'अम्बु' का अर्थ है?", o: ["बादल", "कमल", "जल", "समुद्र"], a: 2, t: "अम्बु = जल।" },
        { q: "'पार्थ' किसका नाम था?", o: ["भीष्म", "अर्जुन", "युधिष्ठिर", "श्रीकृष्ण"], a: 1, t: "अर्जुन (पृथा का पुत्र)।" },
        { q: "मछली का पर्यायवाची शब्द है:", o: ["झष", "तोय", "वारि", "नीरज"], a: 0, t: "झष, मीन, मत्स्य।" },
        { q: "'सरवर' किसका पर्यायवाची है?", o: ["नदी", "समुद्र", "तालाब", "आकाश"], a: 2, t: "तालाब।" },
        { q: "'विहग' का अर्थ है?", o: ["पक्षी", "हवा", "आकाश", "तीर"], a: 0, t: "पक्षी।" },
        { q: "वायु का पर्यायवाची नहीं है?", o: ["अनिल", "मारुत", "पवन", "अनल"], a: 3, t: "अनल अग्नि को कहते हैं, अनिल हवा को।" },
        { q: "'भार्गवी' किसका पर्यायवाची है?", o: ["पार्वती", "लक्ष्मी", "सरस्वती", "यमुना"], a: 1, t: "लक्ष्मी।" },
        { q: "'अवनि' का अर्थ है:", o: ["आकाश", "वायु", "पृथ्वी", "जल"], a: 2, t: "पृथ्वी।" },
        { q: "'समीर' का पर्यायवाची है:", o: ["अनल", "पवन", "पयोद", "पयोधि"], a: 1, t: "पवन।" },
        { q: "'शार्दूल' किसका पर्यायवाची है?", o: ["हाथी", "सिंह", "बाघ", "घोड़ा"], a: 1, t: "सिंह (Lion)।" },
        { q: "'निशीथ' का अर्थ है?", o: ["दिन", "अर्धरात्रि", "शाम", "सुबह"], a: 1, t: "आधी रात।" },

        // 51-100: विलोम शब्द (Antonyms)
        { q: "'स्थावर' का विलोम शब्द है:", o: ["सचल", "चंचल", "चेतन", "जंगम"], a: 3, t: "स्थावर (जो स्थिर है) -> जंगम (जो चल सके)।" },
        { q: "'अर्वाचीन' शब्द का सही विलोम क्या है?", o: ["नवीन", "प्राचीन", "आधुनिक", "पाश्चात्य"], a: 1, t: "अर्वाचीन (नया) -> प्राचीन (पुराना)।" },
        { q: "'उन्मीलन' का विलोम शब्द बताइए:", o: ["अनुमीलन", "निमीलन", "अवमीलन", "मिलन"], a: 1, t: "उन्मीलन (आँख खुलना) -> निमीलन (आँख बंद होना)।" },
        { q: "'मृदुल' का विलोम शब्द है:", o: ["कठिन", "खराब", "रुक्ष", "कठोर"], a: 2, t: "मृदुल (कोमल) -> रुक्ष (खुरदरा/कठोर)।" },
        { q: "'अभिज्ञ' का विलोम शब्द है:", o: ["अज्ञ", "तज्ञ", "प्रज्ञ", "चतुर"], a: 0, t: "अभिज्ञ (जानने वाला) -> अज्ञ (न जानने वाला)।" },
        { q: "'कृतज्ञ' का सही विलोम चुनिए:", o: ["दयालु", "उदार", "कृतघ्न", "निर्देयी"], a: 2, t: "कृतज्ञ (उपकार मानने वाला) -> कृतघ्न (उपकार न मानने वाला)।" },
        { q: "'संकीर्ण' का विलोम शब्द है:", o: ["संक्षेप", "विस्तार", "विकर्ण", "विस्तीर्ण"], a: 3, t: "संकीर्ण -> विस्तीर्ण।" },
        { q: "'अनुरक्ति' का विलोम है:", o: ["विराम", "विरक्ति", "तिरोभाव", "संशक्ति"], a: 1, t: "अनुरक्ति -> विरक्ति।" },
        { q: "'अपेक्षा' का विलोम शब्द क्या है?", o: ["उपेक्षा", "अनुपेक्षा", "सापेक्षा", "विपेक्षा"], a: 0, t: "अपेक्षा -> उपेक्षा।" },
        { q: "'विग्रह' का विलोम शब्द है:", o: ["संधि", "अविग्रह", "आग्रह", "ग्रहण"], a: 0, t: "विग्रह (अलग करना) -> संधि (जोड़ना)।" },
        { q: "'सृष्टि' का विलोम शब्द है:", o: ["विनाश", "प्रलय", "मरण", "मोक्ष"], a: 1, t: "सृष्टि -> प्रलय।" },
        { q: "'इप्सित' का विलोम शब्द है:", o: ["अभिप्सित", "अनिप्सित", "परोप्सित", "सुनिक्सित"], a: 1, t: "इप्सित (चाहा हुआ) -> अनिप्सित।" },
        { q: "'साहचर्य' का विलोम शब्द है:", o: ["वैमनस्य", "असहयोग", "विनियोग", "पृथक्करण"], a: 3, t: "साहचर्य (जुड़ाव) -> पृथक्करण (अलगाव)।" },
        { q: "'विराट' का विलोम शब्द है:", o: ["बृहत", "छोटापन", "क्षुद्र", "बड़ा"], a: 2, t: "विराट -> क्षुद्र।" },
        { q: "'अज्ञ' का विलोम शब्द है:", o: ["विज्ञ", "यज्ञ", "सर्वज्ञ", "अनज्ञ"], a: 0, t: "अज्ञ -> विज्ञ।" },
        { q: "'गौरव' का विलोम शब्द है:", o: ["लाघव", "सौरभ", "रौरव", "अपमान"], a: 0, t: "गौरव -> लाघव।" },
        { q: "'बहिरंग' का विलोम शब्द है:", o: ["सर्वांग", "अंतरंग", "चतुरंग", "अभ्यंग"], a: 1, t: "बहिरंग -> अंतरंग।" },
        { q: "'ग्रस्त' का विलोम शब्द है:", o: ["सुप्त", "मुक्त", "ग्राही", "लुप्त"], a: 1, t: "ग्रस्त (जकड़ा हुआ) -> मुक्त।" },
        { q: "'उत्कर्ष' का विलोम शब्द है:", o: ["पतन", "अपकर्ष", "अपभ्रंश", "विकर्ष"], a: 1, t: "उत्कर्ष -> अपकर्ष।" },
        { q: "'अंतर्मुखी' का विलोम है:", o: ["जगतमुखी", "वाचाल", "चतुर्मुखी", "बहिर्मुखी"], a: 3, t: "अंतर्मुखी -> बहिर्मुखी।" },
        { q: "'अतिवृष्टि' का विलोम शब्द है:", o: ["अल्पवृष्टि", "अनावृष्टि", "अकाल", "सूखा"], a: 1, t: "अतिवृष्टि (अधिक वर्षा) -> अनावृष्टि (बिल्कुल वर्षा न होना)।" },
        { q: "'आलोक' का विलोम शब्द है:", o: ["प्रकाश", "रात्रि", "अंधकार", "अज्ञात"], a: 2, t: "आलोक (प्रकाश) -> अंधकार।" },
        { q: "'उद्यत' का विलोम शब्द है:", o: ["तैयार", "विनीत", "सौम्य", "उत्तम"], a: 1, t: "उद्यत (अक्खड़/तैयार) -> विनीत।" },
        { q: "'जंगम' का विलोम है:", o: ["अगम", "दुर्गम", "स्थावर", "चंचल"], a: 2, t: "जंगम -> स्थावर।" },
        { q: "'निरोग' का विलोम शब्द है:", o: ["रोगी", "रुग्ण", "स्वस्थ", "बीमार"], a: 1, t: "निरोग -> रुग्ण (बीमार)।" },
        { q: "'परोक्ष' का विलोम शब्द है:", o: ["प्रत्यक्ष", "स्थूल", "दृष्टव्य", "अपरोक्ष"], a: 0, t: "परोक्ष (आँखों से दूर) -> प्रत्यक्ष (आँखों के सामने)।" },
        { q: "'ह्रास' का विलोम शब्द है:", o: ["हँसी", "वृद्धि", "विकास", "हास्य"], a: 1, t: "ह्रास (कमी) -> वृद्धि।" },
        { q: "'उपत्यका' का विलोम शब्द है:", o: ["पर्वत", "घाटी", "अधित्यका", "विसर्जन"], a: 2, t: "उपत्यका (पर्वत के नीचे की भूमि) -> अधित्यका (पर्वत के ऊपर की समतल भूमि)।" },
        { q: "'पाश्चात्य' का विलोम शब्द है:", o: ["प्रतिची", "प्राची", "पौरस्त्य", "प्रत्यक्ष"], a: 2, t: "पाश्चात्य -> पौरस्त्य (या पौर्वात्य)।" },
        { q: "'अवनि' का विलोम शब्द है:", o: ["आकाश", "अंबर", "आसमान", "गगन"], a: 1, t: "अवनि (धरती) -> अंबर।" },
        { q: "'हर्ष' का विलोम शब्द है:", o: ["खुशी", "विषाद", "उल्लास", "आनंद"], a: 1, t: "हर्ष -> विषाद।" },
        { q: "'उद्धत' का विलोम शब्द है:", o: ["शौम्य", "कोमल", "अनुद्धत", "A और C दोनों"], a: 3, t: "उद्धत के विलोम सौम्य और विनीत दोनों होते हैं।" },
        { q: "'उन्मुख' का विलोम शब्द है:", o: ["प्रमुख", "विमुख", "अभिमुख", "सन्मुख"], a: 1, t: "उन्मुख -> विमुख।" },
        { q: "'आविर्भाव' का विलोम शब्द है:", o: ["अंतर्धान", "तिरोभाव", "विनाश", "अभाव"], a: 1, t: "आविर्भाव (प्रकट होना) -> तिरोभाव (लोप होना)।" },
        { q: "'चपल' का विलोम शब्द है:", o: ["गंभीर", "वाचाल", "चंचल", "उद्यमी"], a: 0, t: "चपल -> गंभीर।" },
        { q: "'प्रवृत्ति' का विलोम शब्द है:", o: ["वृत्ति", "निवृत्ति", "सदवृत्ति", "अवृत्ति"], a: 1, t: "प्रवृत्ति -> निवृत्ति।" },
        { q: "'सम्प्रसारण' का विलोम शब्द है:", o: ["विस्तार", "आकुंचन", "संकुचन", "B और C दोनों"], a: 3, t: "सम्प्रसारण (फैलना) -> संकुचन या आकुंचन (सिकुड़ना)।" },
        { q: "'निषिद्ध' का विलोम शब्द है:", o: ["विहित", "सिद्ध", "अनपेक्षित", "प्रतिबंधित"], a: 0, t: "निषिद्ध -> विहित।" },
        { q: "'कौटिल्य' का विलोम शब्द है:", o: ["मृदुलता", "आर्तव", "मृदुता", "आर्जव"], a: 3, t: "कौटिल्य (कुटिलता) -> आर्जव (सरलता)।" },
        { q: "'अव्यय' का विलोम शब्द है:", o: ["व्यय", "मितव्यय", "अल्पव्यय", "बहुव्यय"], a: 0, t: "अव्यय -> व्यय।" },
        { q: "'शाश्वत' का विलोम शब्द है:", o: ["मृत्यु", "मर्त्य", "नश्वर", "क्षणिक"], a: 2, t: "शाश्वत (हमेशा रहने वाला) -> नश्वर (नष्ट होने वाला)।" },
        { q: "'आमिष' का विलोम शब्द है:", o: ["शाकाहारी", "मांसाहारी", "निरामिष", "सामिष"], a: 2, t: "आमिष (मांस सहित) -> निरामिष।" },
        { q: "'शुष्क' का विलोम शब्द है:", o: ["गीला", "आर्द्र", "ठंडा", "नमी"], a: 1, t: "शुष्क (सूखा) -> आर्द्र (गीला)।" },
        { q: "'श्रीगणेश' का विलोम शब्द है:", o: ["समापन", "इतिश्री", "अंत", "अथ"], a: 1, t: "श्रीगणेश (प्रारंभ) -> इतिश्री (समाप्ति)।" },
        { q: "'अथ' का विलोम शब्द है:", o: ["इति", "अन्त", "अध", "पूर्ण"], a: 0, t: "अथ -> इति।" },
        { q: "'बरबर' का विलोम शब्द है:", o: ["सभ्य", "बुरा", "सीधा", "अनपढ़"], a: 0, t: "बरबर -> सभ्य।" },
        { q: "'धनी' का विलोम शब्द है:", o: ["धनहीन", "अधनी", "निर्धन", "गरीब"], a: 2, t: "धनी -> निर्धन।" },
        { q: "'उन्मूलन' का विलोम शब्द है:", o: ["अमूलन", "नमूलन", "रोपण", "विनाश"], a: 2, t: "उन्मूलन (जड़ से उखाड़ना) -> रोपण (लगाना)।" },
        { q: "'अमित' का विलोम शब्द है:", o: ["सुमित", "कुमित", "परिमित", "दुर्मित"], a: 2, t: "अमित -> परिमित।" },
        { q: "'अधिकृत' का विलोम शब्द है:", o: ["अनाधिकृत", "अनधिकृत", "प्राधिकृत", "अधिकार"], a: 1, t: "शुद्ध वर्तनी 'अनधिकृत' (B) है।" }
    ];

    const orders = {
        'A': Array.from({length: 100}, (_, i) => i),
        'B': Array.from({length: 100}, (_, i) => 99 - i),
        'C': [14, 82, 3, 91, 55, 21, 7, 66, 40, 0, 12, 88, 4, 73, 50, 29, 19, 95, 6, 31, 77, 44, 11, 85, 2, 38, 60, 93, 17, 45, 28, 70, 99, 53, 8, 84, 33, 1, 54, 89, 20, 68, 96, 15, 43, 26, 72, 51, 87, 35, 9, 64, 30, 81, 18, 63, 97, 42, 13, 86, 34, 58, 25, 79, 16, 49, 71, 32, 59, 83, 47, 76, 92, 10, 24, 65, 56, 41, 74, 37, 69, 94, 22, 57, 80, 36, 61, 90, 52, 78, 46, 23, 67, 14, 5, 75, 98, 39, 27, 62],
        'D': [50, 99, 2, 75, 12, 88, 33, 64, 1, 44, 81, 19, 92, 7, 55, 30, 85, 11, 66, 23, 77, 4, 41, 95, 20, 69, 8, 52, 15, 83, 37, 70, 98, 28, 61, 46, 90, 16, 59, 10, 48, 93, 24, 63, 89, 35, 72, 9, 51, 84, 18, 60, 97, 26, 56, 40, 87, 31, 67, 91, 22, 54, 86, 13, 58, 94, 32, 65, 74, 39, 82, 14, 53, 79, 25, 68, 96, 3, 45, 80, 17, 62, 71, 34, 57, 78, 6, 43, 76, 21, 49, 73, 5, 42, 47, 38, 29, 36, 0, 13, 11]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `शब्दावली मास्टर - SET ${type}`;
        const indices = orders[type];
        currentQuestions = indices.map(idx => questionsPool[idx]);
        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br> व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब है: <b>${item.o[item.a]}</b> <br> व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) { buttons[selIdx].classList.add('correct'); feed.innerHTML = `✅ सही!`; }
        else { buttons[selIdx].classList.add('wrong'); buttons[item.a].classList.add('correct'); feed.innerHTML = `❌ गलत। सही: ${item.o[item.a]}`; }
        feed.style.display = "block";
        feed.innerHTML += `<br>व्याख्या: ${item.t}`;
    }

    function changePage(dir) { currentPage += dir; renderPage(currentPage); }
</script>
