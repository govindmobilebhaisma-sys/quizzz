<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा हिन्दी टेस्ट सेंटर</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #5f6368; margin-bottom: 30px; }
        
        .file-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #e8eaed;
            border-radius: 10px;
            text-decoration: none;
            color: #3c4043;
            font-weight: 600;
            transition: all 0.2s;
        }
        .file-item:hover {
            background: #e8f0fe;
            border-color: #1a73e8;
            transform: translateY(-2px);
        }
        .icon {
            margin-right: 15px;
            font-size: 20px;
        }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 हिन्दी टेस्ट सेंटर नफसीन अकैडमी </h1>
    <p>नीचे दिए गए किसी भी टेस्ट को चुनें और अभ्यास शुरू करें:</p>
    
    <div id="loader" class="loading">फाइलें स्कैन की जा रही हैं...</div>
    <ul class="file-list" id="fileList">
        </ul>
</div>

<script>
    // --- अपनी जानकारी यहाँ भरें ---
    const username = "govindmobilebhaisma-sys"; // अपना GitHub यूजरनाम यहाँ लिखें
    const repoName = "quizzz";     // अपनी रिपॉजिटरी का नाम यहाँ लिखें
    // ----------------------------

    async function fetchFiles() {
        const url = `https://api.github.com/repos/${username}/${repoName}/contents/`;
        const listElement = document.getElementById('fileList');
        const loader = document.getElementById('loader');

        try {
            const response = await fetch(url);
            const files = await response.json();

            loader.style.display = 'none';

            files.forEach(file => {
                // सिर्फ .html फाइलों को दिखाएं और index.html को छुपा दें
                if (file.name.endsWith('.html') && file.name !== 'index.html') {
                    const li = document.createElement('li');
                    
                    // फाइल का नाम सुंदर बनाने के लिए (e.g. samas_quiz.html -> Samas Quiz)
                    let displayName = file.name.replace('.html', '').replace(/_/g, ' ').toUpperCase();
                    
                    li.innerHTML = `
                        <a href="${file.name}" class="file-item">
                            <span class="icon">📄</span>
                            <span>${displayName}</span>
                        </a>
                    `;
                    listElement.appendChild(li);
                }
            });

            if (listElement.children.length === 0) {
                loader.style.display = 'block';
                loader.innerText = "कोई नया टेस्ट नहीं मिला।";
            }

        } catch (error) {
            console.error("Error fetching files:", error);
            loader.innerText = "फाइलें लोड करने में समस्या हुई।";
        }
    }

    fetchFiles();
</script>

</body>
</html>
