<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200 विविध संधि प्रश्न - कोई रिपीट नहीं</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --success: #27ae60;
            --danger: #c0392b;
            --light: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 18px; margin-bottom: 20px; border-left: 6px solid #3498db; }
        .q-text { font-size: 1.1em; font-weight: 600; margin-bottom: 12px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; }
        button.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: bold; }
        button.wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        .feedback { margin-top: 10px; padding: 8px; display: none; border-radius: 5px; font-weight: bold; background: #e9ecef; }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 25px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>हिन्दी व्याकरण: 200 मास्टर संधि प्रश्न</h1>
        <p>बिना रिपीटेशन | 4 पेज | विविध प्रश्न प्रकार</p>
    </header>

    <div class="stats-bar">
        <div id="scoreDisplay">स्कोर: 0 / 200</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>

    <div id="quiz-content"></div>

    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला पेज</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला पेज</button>
    </div>
</div>

<script>

        { q: "'इत्यादि' का सही विच्छेद है:", o: ["इति + आदि", "इती + आदि", "इत + आदि", "इत्य + आदि"], a: 0, t: "यण संधि" },

        { q: "'षट् + मास' की संधि:", o: ["षटमास", "षड्मास", "षण्मास", "षतमास"], a: 2, t: "व्यंजन संधि" },
        { q: "'अन् + त' की संधि:", o: ["अन्त", "अन्त", "अन्न", "अन्नत"], a: 0, t: "व्यंजन संधि" },
        { q: "'अप् + मय' की संधि:", o: ["अपमय", "अम्मय", "अप्मय", "अबमय"], a: 1, t: "व्यंजन संधि" },
        { q: "'उत + नति' की संधि:", o: ["उन्नति", "उतति", "उद्नति", "उनति"], a: 0, t: "व्यंजन संधि" },
        { q: "'चित् + मय' की संधि:", o: ["चितमय", "चिन्मय", "चिद्मय", "चिन्मय"], a: 1, t: "व्यंजन संधि" },
        { q: "'जगत + ईश' की संधि:", o: ["जगदीश", "जगतिश", "जगदिश", "जगदिश"], a: 0, t: "व्यंजन संधि" },
        { q: "'सत् + आनन्द' की संधि:", o: ["सतानन्द", "सदानन्द", "सत्यानन्द", "सतआनन्द"], a: 1, t: "व्यंजन संधि" },
        { q: "'तत् + अनुसार' की संधि:", o: ["तदनुसार", "ततनुसार", "तत्तानुसर", "तदानुसार"], a: 0, t: "व्यंजन संधि" },
        { q: "'षट् + आनन' की संधि:", o: ["षटानन", "षडानन", "षट्नन", "षदानन"], a: 1, t: "व्यंजन संधि" },
        { q: "'अच + अन्त' की संधि:", o: ["अचन्त", "अजन्त", "अच्चन्त", "अकन्त"], a: 1, t: "व्यंजन संधि" },
        { q: "'दिक + अन्तः' की संधि:", o: ["दिक्कन्तः", "दिगन्तः", "दिकान्त", "दिगन्त"], a: 1, t: "व्यंजन संधि" },
        { q: "'परि + कृत' की संधि:", o: ["परिष्कृत", "परिकृत", "परिकृत", "परीकृत"], a: 0, t: "व्यंजन संधि" },
        { q: "'सम् + कार' की संधि:", o: ["सनकार", "संस्कार", "समकार", "सनस्कार"], a: 1, t: "व्यंजन संधि" },
        { q: "'परि + छेद' की संधि:", o: ["परिच्छेद", "परिछेद", "परीछेद", "परिक्षेद"], a: 0, t: "व्यंजन संधि" },
        { q: "'लक्ष्मीच्छाया' का विच्छेद:", o: ["लक्ष्मी + छाया", "लक्ष्मी + च्छाया", "लक्ष्म + छाया", "लक्ष्मी + छाय"], a: 1, t: "व्यंजन संधि" },
        { q: "'स्व + छन्द' की संधि:", o: ["स्वच्छन्द", "स्वछन्द", "स्वाछन्द", "सुच्छन्द"], a: 0, t: "व्यंजन संधि" },
        { q: "'वि + सम' की संधि:", o: ["विशम", "विषम", "विसम", "विष्म"], a: 1, t: "व्यंजन संधि" },
        { q: "'प्रति + स्था' की संधि:", o: ["प्रतिष्ठा", "प्रतिस्था", "प्रतिस्त", "प्रतीष्ठा"], a: 0, t: "व्यंजन संधि" },
        { q: "'अनु + संगी' की संधि:", o: ["अनुसंगी", "अनुषंगी", "अनुसंगी", "अनूषंगी"], a: 1, t: "व्यंजन संधि" },
        { q: "'नि + षेध' की संधि:", o: ["निषेध", "निसेध", "नीषेध", "निशेध"], a: 0, t: "व्यंजन संधि" },
        { q: "'सम् + कृत' की संधि:", o: ["सङ्कृत", "संस्कृत", "सनकृत", "समकृत"], a: 1, t: "व्यंजन संधि" },
        { q: "'राम + अयन' की संधि:", o: ["रामायण", "रामायन", "रामयण", "रामायणः"], a: 0, t: "दीर्घ + व्यंजन" },
        { q: "'परि + नाम' की संधि:", o: ["परिनाम", "परिणाम", "परीनाम", "परनाम"], a: 1, t: "व्यंजन संधि" },
        { q: "'प्र + मान' की संधि:", o: ["प्रमान", "प्रमाण", "प्रामाण", "प्रमण"], a: 1, t: "व्यंजन संधि" },
        { q: "'प्रातः + काल' की संधि:", o: ["प्रातःकाल", "प्रातकाल", "प्रातोकाल", "प्रातकाल"], a: 0, t: "विसर्ग संधि" },
        { q: "'मनः + हर' की संधि:", o: ["मनहर", "मनोहर", "मनहरः", "मनोहरः"], a: 1, t: "विसर्ग संधि" },
        { q: "'नी + रस' की संधि:", o: ["निरस", "नीरस", "नीरसः", "निरसः"], a: 1, t: "विसर्ग संधि" },
        { q: "'दुः + तर' की संधि:", o: ["दुतर", "दुस्तर", "दुतरः", "दुशतर"], a: 1, t: "विसर्ग संधि" },
        { q: "'अन्तः + पुर' की संधि:", o: ["अन्तःपुर", "अन्तपुर", "अन्तोपुर", "अन्तपुरः"], a: 0, t: "विसर्ग संधि" },
        { q: "'नमः + ते' की संधि:", o: ["नमस्ते", "नमते", "नमस्तेः", "नमोते"], a: 0, t: "विसर्ग संधि" },
        { q: "'यशः + गाथा' की संधि:", o: ["यशगाथा", "यशोगाथा", "यशगाथाः", "यशोगाथाः"], a: 1, t: "विसर्ग संधि" },
        { q: "'दुः + बल' की संधि:", o: ["दुबल", "दुर्बल", "दुबलः", "दुरबल"], a: 1, t: "विसर्ग संधि" },
        { q: "'निः + चल' की संधि:", o: ["निचल", "निश्चल", "निचलः", "निशचल"], a: 1, t: "विसर्ग संधि" },
        { q: "'निः + चिन्ता' की संधि:", o: ["निचिन्ता", "निश्चिन्त", "निश्चिंता", "निश्चिंत"], a: 3, t: "विसर्ग संधि" },
        { q: "'मनः + कामना' की संधि:", o: ["मनोकामना", "मनःकामना", "मनकामना", "मनोकामना"], a: 1, t: "विसर्ग संधि" },
        { q: "'तेजः + पुंज' की संधि:", o: ["तेजोपुंज", "तेजःपुंज", "तेजपुंज", "तेजोपुंजः"], a: 1, t: "विसर्ग संधि" },
        { q: "'पयः + धर' की संधि:", o: ["पयधर", "पयोधर", "पयःधर", "पयोदर"], a: 1, t: "विसर्ग संधि" }
    ];

    let score = 0;
    let currentPage = 0;
    const qPerPage = 50;
    const userSelections = {}; 

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const currentQs = allQuestions.slice(start, end);

        currentQs.forEach((item, i) => {
            const idx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${item.q}</div>
                <div class="options" id="opt-${idx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="checkAnswer(${idx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${idx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[idx] !== undefined) restoreSelection(idx, userSelections[idx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function checkAnswer(qIdx, selIdx, btn) {
        const item = allQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);

        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही! [${item.t}]`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही उत्तर: <b>${item.o[item.a]}</b> [${item.t}]`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `स्कोर: ${score} / 200`;
    }

    function restoreSelection(qIdx, selIdx) {
        const item = allQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) buttons[selIdx].classList.add('correct');
        else {
            buttons[selIdx].classList.add('wrong');
            buttons[item.a].classList.add('correct');
        }
        feed.style.display = "block";
        feed.innerHTML = `[${item.t}]`;
    }

    function changePage(dir) {
        currentPage += dir;
        renderPage(currentPage);
    }

    renderPage(0);
</script>
</body>
</html>
