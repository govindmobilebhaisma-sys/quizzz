<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>उपसर्ग और प्रत्यय - मास्टर क्विज़ (100 प्रश्न)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #8e44ad;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            color: #2c3e50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        .set-btn {
            display: inline-block;
            width: 140px;
            padding: 15px;
            margin: 10px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #e74c3c; }
        .btn-c { background: #2ecc71; }
        .btn-d { background: #f39c12; }
        .set-btn:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 15px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .q-card { background: #fff; border: 1px solid #e1e8ed; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 2px solid #e1e8ed; background: #f8f9fa; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; transition: 0.2s; color: #333; }
        button.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #f4ebf9; }
        button.correct { background: #d4edda !important; border-color: var(--success) !important; color: #155724; font-weight: bold; }
        button.wrong { background: #f8d7da !important; border-color: var(--danger) !important; color: #721c24; }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); font-size: 0.95em; }
        .pagination { display: flex; justify-content: center; gap: 20px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 12px 30px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h1 style="color: var(--accent); margin-top:0;">उपसर्ग-प्रत्यय (कठिन स्तर)</h1>
        <p style="font-size: 1.1em; color: #555;">प्रतियोगी परीक्षाओं हेतु 100 महत्वपूर्ण प्रश्न।<br>कृपया अपना सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button><br>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
        <p style="font-size: 0.9em; margin-top: 15px; color: #7f8c8d;">नोट: हर सेट में क्रम फिक्स है, जो रिफ्रेश करने पर नहीं बदलेगा।</p>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">उपसर्ग और प्रत्यय मास्टर टेस्ट</h1>
        <p>कुल 100 प्रश्न | 4 पेज | स्तर: मध्यम से कठिन</p>
    </header>

    <div class="stats-bar">
        <div id="scoreDisplay">कुल स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>

    <div id="quiz-content"></div>

    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला पेज</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला पेज</button>
    </div>
</div>

<script>
    // 100 Unique Medium to High Difficulty Questions (Upsarg & Pratyay)
    const baseData = [
        // 1-25: उपसर्ग (कठिन/संधि आधारित)
        { q: "'अत्युक्ति' शब्द में कौन-सा उपसर्ग है?", o: ["अत", "अति", "अत्य", "अ"], a: 1, t: "अति + उक्ति (यण संधि नियम)" },
        { q: "'प्रागैतिहासिक' में किस उपसर्ग का प्रयोग हुआ है?", o: ["प्रा", "प्राग", "प्राक्", "प्रागे"], a: 2, t: "प्राक् + ऐतिहासिक (व्यंजन संधि)" },
        { q: "'अध्यक्ष' में कौन-सा उपसर्ग है?", o: ["अध", "अधि", "अध्य", "अ"], a: 1, t: "अधि + अक्ष" },
        { q: "'उज्ज्वल' में प्रयुक्त उपसर्ग बताइए:", o: ["उज", "उज्", "उत्", "उद्"], a: 2, t: "उत् + ज्वल" },
        { q: "किस शब्द में 'आ' उपसर्ग नहीं है?", o: ["आज़न्म", "आगमन", "आदरणीय", "आकर्षण"], a: 2, t: "'आदरणीय' में 'आदर' मूल शब्द है, 'आ' उपसर्ग नहीं।" },
        { q: "'दुर्व्यवहार' में कौन-सा उपसर्ग है?", o: ["दु", "दुर्", "दुस्", "दुः"], a: 1, t: "दुर् + व्यवहार" },
        { q: "'निस्संदेह' में प्रयुक्त उपसर्ग है:", o: ["नि", "निर्", "निस्", "निसः"], a: 2, t: "निस् उपसर्ग (निस् + संदेह)" },
        { q: "'अन्वेषण' शब्द में उपसर्ग बताइए:", o: ["अन्", "अनु", "अन्व", "अ"], a: 1, t: "अनु + एषण (यण संधि)" },
        { q: "इनमें से किस शब्द में 'सु' उपसर्ग का प्रयोग नहीं हुआ है?", o: ["सुशील", "सुंदर", "सुरेश", "सुलेख"], a: 2, t: "'सुरेश' = सुर + ईश (यहाँ 'सुर' मूल शब्द है, सु उपसर्ग नहीं)" },
        { q: "'पुरोहित' में उपसर्ग है:", o: ["पुर", "पुरस्", "पुरः", "पुर्"], a: 2, t: "पुरः + हित (विसर्ग संधि के प्रभाव से)" },
        { q: "'प्रत्युपकार' में उपसर्ग है:", o: ["प्र", "प्रति", "प्रत", "प्रत्यु"], a: 1, t: "प्रति + उपकार" },
        { q: "किस शब्द में एक से अधिक उपसर्ग हैं?", o: ["पर्यावरण", "स्वाभिमान", "व्याकरण", "असुरक्षित"], a: 2, t: "व्याकरण = वि + आ + करण (दो उपसर्ग)" },
        { q: "'उद्धार' शब्द में उपसर्ग है:", o: ["उत्", "उद्", "उ", "उध"], a: 0, t: "उत् + हार" },
        { q: "'सदाचार' में कौन-सा उपसर्ग प्रयुक्त है?", o: ["सदा", "सद्", "सत्", "स"], a: 2, t: "सत् + आचार" },
        { q: "'संगम' शब्द में उपसर्ग बताइए:", o: ["सं", "सम्", "सन्", "स"], a: 1, t: "सम् + गम" },
        { q: "'उपनिवेश' शब्द में कौन-सा उपसर्ग है?", o: ["उप", "उपनि", "उ", "उप + नि"], a: 0, t: "उप + निवेश" },
        { q: "'दुष्परिणाम' में प्रयुक्त उपसर्ग है:", o: ["दु", "दुष्", "दुस्", "दुर्"], a: 2, t: "दुस् + परिणाम (संधि नियम से ष हुआ है)" },
        { q: "किस शब्द में 'नि' उपसर्ग नहीं है?", o: ["निबंध", "नियम", "निर्बल", "निवास"], a: 2, t: "'निर्बल' में 'निर्' उपसर्ग है, 'नि' नहीं।" },
        { q: "'उल्लंघन' में उपसर्ग है:", o: ["उल", "उत्", "उद्", "उल्ल"], a: 1, t: "उत् + लंघन" },
        { q: "'परिणाम' में उपसर्ग बताइए:", o: ["पर", "परा", "परि", "परी"], a: 2, t: "परि + नाम (व्यंजन संधि से ण)" },
        { q: "'चिरायु' में कौन-सा उपसर्ग है?", o: ["चिर", "चिर्", "चि", "चिरा"], a: 0, t: "चिर (संस्कृत का अव्यय/उपसर्ग)" },
        { q: "'बदबू' में कौन-सा उपसर्ग है?", o: ["ब", "बद", "बद्", "बदब"], a: 1, t: "बद (उर्दू-फ़ारसी उपसर्ग)" },
        { q: "'हमदर्द' में 'हम' उपसर्ग किस भाषा का है?", o: ["संस्कृत", "हिंदी", "उर्दू-फ़ारसी", "अंग्रेजी"], a: 2, t: "'हम' (समान) उर्दू-फ़ारसी का उपसर्ग है।" },
        { q: "'अलमस्त' में उपसर्ग है:", o: ["अल", "अल्", "अ", "अलम्"], a: 0, t: "अल (अरबी-फ़ारसी)" },
        { q: "'नादान' में उपसर्ग 'ना' का अर्थ क्या है?", o: ["अधिक", "बिना/अभाव", "थोड़ा", "समान"], a: 1, t: "ना = नहीं/अभाव" },

        // 26-50: प्रत्यय (कृदंत और तद्धित)
        { q: "'लुटेरा' शब्द में मूल शब्द और प्रत्यय क्या है?", o: ["लूट + एरा", "लुट + एरा", "लूट + रा", "लुट + ऐरा"], a: 0, t: "मूल शब्द 'लूट' + एरा (जुड़ने पर ह्रस्व 'उ' हो जाता है)" },
        { q: "कृदंत (कृत्) प्रत्यय किन शब्दों के साथ जुड़ते हैं?", o: ["संज्ञा", "सर्वनाम", "विशेषण", "क्रिया (धातु)"], a: 3, t: "क्रिया या धातु के अंत में जुड़ने वाले प्रत्यय कृदंत कहलाते हैं।" },
        { q: "'बुढ़ापा' शब्द में कौन-सा प्रत्यय है?", o: ["पा", "आपा", "पापा", "बढ़ापा"], a: 1, t: "बूढ़ा + आपा = बुढ़ापा (तद्धित प्रत्यय)" },
        { q: "इनमें से किस शब्द में 'आवट' प्रत्यय नहीं है?", o: ["सजावट", "लिखावट", "थकावट", "महावट"], a: 3, t: "महावट एक स्वतंत्र शब्द है (या महा + वट)। शेष में क्रिया + आवट है।" },
        { q: "'मिठास' में कौन-सा प्रत्यय है?", o: ["आस", "ठास", "स", "मीठा"], a: 0, t: "मीठा + आस = मिठास" },
        { q: "'भुलक्कड़' में प्रत्यय बताइए:", o: ["अक्कड़", "क्कड़", "कड़", "आकड़"], a: 0, t: "भूलना (धातु) + अक्कड़" },
        { q: "'तेजस्वी' शब्द में कौन-सा प्रत्यय प्रयुक्त है?", o: ["वी", "स्वि", "स्वी", "इ"], a: 0, t: "तेजस् + विन् (हिंदी में 'वी' माना जाता है)" },
        { q: "इनमें से तद्धित प्रत्यय का उदाहरण कौन-सा है?", o: ["तैराक", "लड़ाकू", "सुनार", "पढ़ाई"], a: 2, t: "'सुनार' (सोना + आर) संज्ञा से बना है, बाकी क्रिया (धातु) से बने हैं।" },
        { q: "'गवैया' शब्द में मूल धातु क्या है?", o: ["गाना", "गौ", "गा", "गवय"], a: 2, t: "गा (धातु) + ऐया = गवैया" },
        { q: "किस शब्द में 'इत' प्रत्यय नहीं है?", o: ["हर्षित", "पल्लवित", "अमित", "पुष्पित"], a: 2, t: "'अमित' में 'अ' उपसर्ग और 'मित' मूल शब्द है।" },
        { q: "'सावधानी' शब्द में प्रयुक्त प्रत्यय है:", o: ["धानी", "आनी", "ई", "नी"], a: 2, t: "सावधान (मूल शब्द) + ई (प्रत्यय)" },
        { q: "'पांडित्य' में कौन-सा प्रत्यय है?", o: ["य", "इत्य", "त्य", "पंडित"], a: 0, t: "पंडित + य = पांडित्य (भाववाचक तद्धित)" },
        { q: "निम्नलिखित में से 'इक' प्रत्यय के योग से अशुद्ध शब्द कौन-सा बना है?", o: ["सामाजिक", "दैनिक", "पक्क्षिक", "भौगोलिक"], a: 2, t: "पक्ष + इक = 'पाक्षिक' होता है, पक्क्षिक नहीं।" },
        { q: "'माधुर्य' शब्द का निर्माण हुआ है:", o: ["माधुर + य", "मधुर + य", "मधुर + र्य", "मधु + र्य"], a: 1, t: "मधुर + य (तद्धित प्रत्यय लगने पर 'म' का 'मा' हो जाता है)" },
        { q: "'कौन्तेय' में कौन-सा प्रत्यय है?", o: ["य", "ऐय", "एय", "तेय"], a: 2, t: "कुंती + एय = कौन्तेय (अपत्यवाचक तद्धित)" },
        { q: "'लेखक' में प्रत्यय है:", o: ["खक", "क", "अक", "आक"], a: 2, t: "लिख् + अक = लेखक" },
        { q: "'भारतीय' में मूल शब्द और प्रत्यय है:", o: ["भारत + ईय", "भारत + इय", "भारती + य", "भरत + ईय"], a: 0, t: "भारत + ईय" },
        { q: "किस शब्द में प्रत्यय का प्रयोग नहीं हुआ है?", o: ["बसंत", "रटंत", "भिड़ंत", "गड़ंत"], a: 0, t: "'बसंत' एक मूल शब्द (ऋतु) है, बाकी में 'अंत' प्रत्यय है।" },
        { q: "'बचपन' में प्रत्यय है:", o: ["पन", "प", "अन", "बच"], a: 0, t: "बच्चा + पन = बचपन" },
        { q: "'गरमाहट' में प्रत्यय बताइए:", o: ["आहट", "हट", "माहट", "ट"], a: 0, t: "गरम + आहट" },
        { q: "'दुकानदार' में प्रत्यय है:", o: ["दार", "आर", "नदार", "दुकान"], a: 0, t: "दुकान + दार" },
        { q: "'वैज्ञानिक' शब्द में मूल शब्द है:", o: ["विज्ञान", "विज्ञ", "ज्ञान", "वैज्ञान"], a: 0, t: "विज्ञान + इक = वैज्ञानिक" },
        { q: "'सपेरा' में प्रयुक्त प्रत्यय है:", o: ["पेरा", "एरा", "रा", "ऐरा"], a: 1, t: "साँप + एरा = सपेरा" },
        { q: "'धार्मिक' में प्रत्यय है:", o: ["मिक", "इक", "क", "र्मिक"], a: 1, t: "धर्म + इक" },
        { q: "इनमें से कौन-सा कृदंत प्रत्यय से बना शब्द है?", o: ["रंगीला", "बिकाऊ", "दूधारू", "कृपालु"], a: 1, t: "'बिकाऊ' (बिकना क्रिया से) कृदंत है, शेष संज्ञा/विशेषण से बने तद्धित हैं।" },

        // 51-75: उपसर्ग और प्रत्यय दोनों, और जटिल शब्द
        { q: "'स्वतंत्रता' शब्द में कितने उपसर्ग व प्रत्यय हैं?", o: ["1 उपसर्ग, 1 प्रत्यय", "2 उपसर्ग, 1 प्रत्यय", "1 उपसर्ग, 2 प्रत्यय", "केवल 2 प्रत्यय"], a: 0, t: "स्व (उपसर्ग) + तंत्र (मूल) + ता (प्रत्यय)" },
        { q: "'अनुकरणीय' में उपसर्ग व प्रत्यय क्रमशः हैं:", o: ["अनु, ईय", "अनु, अनीय", "अ, करणीय", "अनु, नीय"], a: 1, t: "अनु (उपसर्ग) + कृ (धातु) + अनीय (प्रत्यय)" },
        { q: "'परिपूर्णता' में मूल शब्द क्या है?", o: ["परि", "पूर्ण", "पूर्णता", "परिपूर्ण"], a: 1, t: "परि (उप) + पूर्ण (मूल) + ता (प्र)" },
        { q: "'अभिमानी' में उपसर्ग और प्रत्यय हैं:", o: ["अभि, नी", "अभि, ई", "अभिमान, ई", "अ, मानी"], a: 1, t: "अभि (उप) + मान (मूल) + ई (प्र)" },
        { q: "किस शब्द में उपसर्ग और प्रत्यय दोनों का प्रयोग हुआ है?", o: ["ऐतिहासिक", "अधार्मिक", "भारतीय", "लुटेरा"], a: 1, t: "अ (उपसर्ग) + धर्म (मूल) + इक (प्रत्यय) = अधार्मिक" },
        { q: "'दुस्साहसी' में उपसर्ग है:", o: ["दुस्", "दुष्", "दुर्", "दु"], a: 0, t: "दुस् + साहस + ई" },
        { q: "'पारिवारिक' में मूल शब्द है:", o: ["परिवार", "पारिवार", "परीवार", "परि"], a: 0, t: "परिवार + इक = पारिवारिक" },
        { q: "'सम्मानित' शब्द में उपसर्ग व प्रत्यय हैं:", o: ["सम्, इत", "सं, इत", "स, मानित", "सम्, त"], a: 0, t: "सम् + मान + इत" },
        { q: "'लापरवाही' शब्द में मूल शब्द क्या है?", o: ["परवाह", "लापरवाह", "लापर", "वाही"], a: 0, t: "ला (उप) + परवाह (मूल) + ई (प्र)" },
        { q: "'असफलता' में कितने उपसर्ग हैं?", o: ["1", "2", "3", "कोई नहीं"], a: 0, t: "अ (उप) + सफल (मूल) + ता (प्र) -> 1 उपसर्ग" },
        { q: "किस शब्द में 'अ' उपसर्ग का प्रयोग नहीं हुआ है?", o: ["अकाल", "अनाथ", "अमर", "अमन"], a: 3, t: "'अमन' अरबी मूल का पूर्ण शब्द है (शांति)।" },
        { q: "'औपन्यासिक' शब्द किस मूल शब्द से बना है?", o: ["उपन्यास", "उपन्यासक", "न्यास", "औपन्यास"], a: 0, t: "उपन्यास + इक = औपन्यासिक" },
        { q: "'व्यावहारिक' में उपसर्ग है:", o: ["वि", "व्य", "व्या", "वि + अव"], a: 3, t: "वि + अव + हार + इक (दो उपसर्ग: वि, अव)" },
        { q: "'निर्दयी' शब्द का सही विश्लेषण है:", o: ["निर् + दय + ई", "निः + दया + ई", "निर् + दया + ई", "नि + र्दयी"], a: 2, t: "निर् + दया + ई" },
        { q: "'असुरक्षित' में कितने उपसर्ग हैं?", o: ["1", "2", "3", "केवल प्रत्यय है"], a: 1, t: "अ + सु + रक्ष + इत (दो उपसर्ग: अ, सु)" },
        { q: "'दुर्व्यवहार' में मूल शब्द क्या है?", o: ["व्यवहार", "हार", "वहार", "अवहार"], a: 1, t: "दुर् + वि + अव + हार (मूल शब्द 'हार')" },
        { q: "'सुसज्जित' में प्रत्यय है:", o: ["इत", "त", "जित", "सु"], a: 0, t: "सु + सज्जा + इत" },
        { q: "'अप्रत्याशित' में मूल शब्द है:", o: ["प्रत्याशा", "आशा", "प्रत्याश", "अत"], a: 1, t: "अ + प्रति + आशा + इत (मूल शब्द 'आशा')" },
        { q: "'अत्याधुनिक' का सही विश्लेषण है:", o: ["अति + आधुनिक", "अति + अधुना + इक", "अत्य + आधुनिक", "अति + आ + धुनिक"], a: 1, t: "अति + अधुना + इक" },
        { q: "'स्वावलंबन' में उपसर्ग है:", o: ["स्व", "स्वा", "सु", "स्वाव"], a: 0, t: "स्व + अवलंबन (अवलंब + अन)" },
        { q: "किस शब्द में 'इक' प्रत्यय लगने से प्रथम स्वर में वृद्धि नहीं हुई है?", o: ["दैनिक", "मौखिक", "श्रमिक", "ऐतिहासिक"], a: 2, t: "श्रम + इक = श्रमिक (प्रथम स्वर 'अ' में वृद्धि नहीं हुई, जैसे धर्म से धार्मिक में होती है)" },
        { q: "'प्रामाणिक' का मूल शब्द है:", o: ["प्रमाण", "प्रमाणित", "प्रमा", "प्रामाण"], a: 0, t: "प्रमाण + इक = प्रामाणिक" },
        { q: "'अध्यात्म' में उपसर्ग है:", o: ["अध", "अधि", "अध्य", "अ"], a: 1, t: "अधि + आत्म" },
        { q: "'निर्वासित' में मूल शब्द और प्रत्यय:", o: ["निर्वास + इत", "वास + इत", "वासि + त", "निर्व + आसित"], a: 1, t: "निर् + वास + इत (मूल 'वास')" },
        { q: "'सांसारिक' शब्द में मूल शब्द है:", o: ["संसार", "सांसार", "संसारि", "सांसारि"], a: 0, t: "संसार + इक" },

        // 76-100: अपवाद, उर्दू-फ़ारसी, और विशेष नियम
        { q: "'बाइज़्ज़त' में 'बा' उपसर्ग का अर्थ है:", o: ["बिना", "सहित/साथ", "बुरा", "ऊपर"], a: 1, t: "'बा' फ़ारसी उपसर्ग है जिसका अर्थ 'सहित' (इज़्ज़त के साथ) होता है।" },
        { q: "'अलगरज़' में उपसर्ग है:", o: ["अल", "अ", "अलग", "गरज़"], a: 0, t: "अल (अरबी उपसर्ग)" },
        { q: "किस शब्द में 'आवट' प्रत्यय नहीं है?", o: ["बनावट", "तरावट", "रुकावट", "गिरावट"], a: 1, t: "'तरावट' (तर + आवट) में 'तर' विशेषण है, जबकि आवट कृदंत (क्रिया के साथ) लगता है।" },
        { q: "'चमकीला' में प्रत्यय है:", o: ["ईला", "इला", "ला", "कीला"], a: 0, t: "चमक + ईला" },
        { q: "'पौरुष' में मूल शब्द और प्रत्यय क्या है?", o: ["पुरुष + अ", "पौर + उष", "पुरुष + उष", "पौरु + ष"], a: 0, t: "पुरुष + 'अ' प्रत्यय लगने से प्रथम स्वर वृद्धि होकर 'पौरुष' बनता है।" },
        { q: "'राघव' में कौन-सा प्रत्यय है?", o: ["अव", "व", "अ", "घव"], a: 2, t: "रघु + अ = राघव (अपत्यवाचक तद्धित प्रत्यय 'अ')" },
        { q: "'वासुदेव' में प्रत्यय बताइए:", o: ["देव", "एव", "अ", "व"], a: 2, t: "वसुदेव + अ = वासुदेव" },
        { q: "'गौरव' का सही निर्माण है:", o: ["गौर + व", "गुरु + अ", "गौ + रव", "गुरु + व"], a: 1, t: "गुरु + अ = गौरव" },
        { q: "किस शब्द में 'इय' प्रत्यय नहीं है?", o: ["राष्ट्रीय", "मानवीय", "पानी", "शासकीय"], a: 2, t: "'पानी' एक रूढ़ शब्द है।" },
        { q: "'कठौती' में प्रत्यय है:", o: ["औती", "ौती", "ती", "कठ"], a: 0, t: "काठ + औती = कठौती" },
        { q: "'ममेरा' में मूल शब्द है:", o: ["मामा", "मम", "माम", "मामी"], a: 0, t: "मामा + एरा = ममेरा" },
        { q: "किस शब्द में 'इन' प्रत्यय है?", o: ["कुलीन", "कठिन", "नवीन", "ग्रामीण"], a: 1, t: "'कठिन' (कठ + इन)। कुलीन, नवीन, ग्रामीण में 'ईन' (दीर्घ) प्रत्यय है।" },
        { q: "'लालिमा' में प्रत्यय है:", o: ["इमा", "मा", "लीमा", "लिमा"], a: 0, t: "लाल + इमा" },
        { q: "कौन-सा शब्द 'आ' प्रत्यय से नहीं बना है?", o: ["भूखा", "प्यासा", "झूला", "भला"], a: 3, t: "'भला' एक मूल विशेषण है (भल + आ नहीं होता)।" },
        { q: "'भिड़ंत' में कौन-सा प्रत्यय है?", o: ["अंत", "ंत", "डंत", "त"], a: 0, t: "भिड़ना (धातु भिड़) + अंत" },
        { q: "'सरपंच' में 'सर' उपसर्ग किस भाषा का है?", o: ["संस्कृत", "हिंदी", "अंग्रेजी", "उर्दू-फ़ारसी"], a: 3, t: "'सर' (मुख्य) उर्दू-फ़ारसी का उपसर्ग है।" },
        { q: "'बदस्तूर' में उपसर्ग है:", o: ["बद", "ब", "बदस्", "बदस्"], a: 1, t: "ब (साथ) + दस्तूर (नियम) = नियम के साथ।" },
        { q: "'दरअस्ल' में 'दर' उपसर्ग का अर्थ है:", o: ["बिना", "में", "ऊपर", "नीचे"], a: 1, t: "दर (फ़ारसी) = में (असल में)।" },
        { q: "'बिलावजह' में उपसर्ग है:", o: ["बिल", "बिला", "बि", "ब"], a: 1, t: "बिला (बिना) अरबी उपसर्ग है।" },
        { q: "'खुशबू' में मूल शब्द क्या है?", o: ["खुश", "बू", "ब", "खुशब"], a: 1, t: "खुश (उपसर्ग) + बू (गंध/मूल शब्द)" },
        { q: "इनमें से कौन-सा शब्द 'अभि' उपसर्ग से नहीं बना है?", o: ["अभ्यागत", "अभ्युदय", "अभिन्न", "अभिशाप"], a: 2, t: "'अभिन्न' = अ (उपसर्ग) + भिन्न।" },
        { q: "किस शब्द में उपसर्ग का प्रयोग नहीं हुआ है?", o: ["विख्यात", "विदेश", "वितान", "विमला"], a: 3, t: "'विमला' (विमल + आ) या एक रूढ़ नाम है जहाँ 'वि' उपसर्ग नहीं माना जाता (या वि+मल)। 'वितान' भी रूढ़ हो सकता है, लेकिन 'विख्यात' सटीक है।" }, // Correction in rendering logic below
        { q: "किस शब्द में 'वि' उपसर्ग नहीं है?", o: ["विकट", "विद्वान", "वितान", "विनाश"], a: 1, t: "'विद्वान' एक पूर्ण संस्कृत शब्द (विद्वस्) है।" },
        { q: "'चिरायु' में 'चिर' का अर्थ क्या है?", o: ["कम", "लंबा/दीर्घ", "बुरा", "अच्छा"], a: 1, t: "चिर = लंबा समय।" },
        { q: "किस शब्द में 'आवट' और 'आहट' प्रत्यय का भेद स्पष्ट है?", o: ["घबराहट-थकावट", "बनावट-सजावट", "मुस्कुराहट-कड़वाहट", "इनमें से कोई नहीं"], a: 0, t: "घबराहट (भाव) और थकावट (दशा) स्पष्ट भिन्न प्रत्यय रूप हैं।" }
    ];

    // 4 Fixed Mixed Order Patterns
    const orders = {
        'A': Array.from({length: 100}, (_, i) => i), // 0 to 99
        'B': Array.from({length: 100}, (_, i) => 99 - i), // 99 to 0
        'C': [], // Odds then Evens
        'D': []  // Every 3rd jump pseudo-random
    };

    // Generating C (Odds then Evens)
    for (let i = 1; i < 100; i += 2) orders['C'].push(i);
    for (let i = 0; i < 100; i += 2) orders['C'].push(i);

    // Generating D (Jump by 7, mod 100 to get a scattered fixed pattern)
    let tempD = new Set();
    let currentD = 0;
    while(tempD.size < 100) {
        tempD.add(currentD);
        currentD = (currentD + 7) % 100;
        if(tempD.has(currentD) && tempD.size < 100) {
            currentD = (currentD + 1) % 100; // avoid infinite loop
        }
    }
    orders['D'] = Array.from(tempD);


    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `उपसर्ग-प्रत्यय टेस्ट: SET ${type}`;

        const orderIndices = orders[type];
        currentQuestions = orderIndices.map(index => baseData[index]);

        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);

        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ बिल्कुल सही! <br><span style="color:#2c3e50; font-weight:normal;">व्याख्या: ${item.t}</span>`;
            feed.style.borderColor = "var(--success)";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत उत्तर। सही जवाब है: <b>${item.o[item.a]}</b> <br><span style="color:#2c3e50; font-weight:normal;">व्याख्या: ${item.t}</span>`;
            feed.style.borderColor = "var(--danger)";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        
        if (selIdx === item.a) {
            buttons[selIdx].classList.add('correct');
            feed.innerHTML = `✅ सही! <br><span style="color:#2c3e50; font-weight:normal;">व्याख्या: ${item.t}</span>`;
            feed.style.borderColor = "var(--success)";
        } else {
            buttons[selIdx].classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत उत्तर। सही: <b>${item.o[item.a]}</b> <br><span style="color:#2c3e50; font-weight:normal;">व्याख्या: ${item.t}</span>`;
            feed.style.borderColor = "var(--danger)";
        }
        feed.style.display = "block";
    }

    function changePage(dir) {
        currentPage += dir;
        renderPage(currentPage);
    }
</script>

</body>
</html>
