<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बाल विकास एवं शिक्षाशास्त्र क्विज़</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 450px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; line-height: 1.5; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); line-height: 1.4; }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">बाल विकास एवं शिक्षाशास्त्र (CDP)</h2>
        <p>25 महत्वपूर्ण प्रश्न | शिक्षक भर्ती परीक्षा स्तर<br>कृपया अपना सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">बाल विकास एवं शिक्षाशास्त्र क्विज़</h1>
        <p>बाल्यावस्था, किशोरावस्था एवं शारीरिक-संवेगात्मक विकास</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">कुल स्कोर: 0 / 25</div>
        <div id="pageDisplay">पेज: 1 / 1</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

            o: ["प्रारंभिक बाल्यावस्था", "युवावस्था", "किशोरावस्था", "बाल्यावस्था"],
            a: 2,
            t: "किशोरावस्था में आत्मसम्मान, पहचान का संकट और स्वायत्तता की चाह के कारण किशोर बड़ों के प्रभुत्व का विरोध करने लगते हैं।"
        },
        {
            q: "दर्पण में अपने चेहरे को निरंतर देखते रहना, केवल अपने आप से प्यार करना एवं घनिष्ठ मित्रता की प्रवृत्ति— फ्रायड ने इस अवस्था एवं गुण को किस प्रकार वर्णित किया है?",
            o: ["आत्ममोह, बाल्यावस्था", "समूह प्रवृत्ति, युवावस्था", "आत्ममोह, किशोरावस्था", "लैंगिक प्रेरण, शैशवावस्था"],
            a: 2,
            t: "सिगमंड फ्रायड के अनुसार किशोरावस्था में 'नार्सिसिज्म' (आत्ममोह/स्वमोह) देखा जाता है और इसी अवस्था में घनिष्ठ मित्रता की प्रवृत्ति पाई जाती है।"
        },
        {
            q: "बाल्यावस्था में बालक का व्यक्तित्व प्रायः होता है—<br>I. अंतर्मुखी<br>II. बहिर्मुखी<br>III. तर्कसंगत<br>IV. अपरिवर्तनशील",
            o: ["I और II", "II और III", "I, III, IV", "III और IV"],
            a: 1,
            t: "बाल्यावस्था में बच्चे बाहरी परिवेश व साथियों के साथ सक्रिय रहते हैं (बहिर्मुखी) तथा उनमें प्रत्यक्ष वस्तुओं के प्रति तर्कसंगत चिंतन का विकास होता है।"
        },
        {
            q: "आनुवंशिकता को कैसी सामाजिक संरचना के रूप में माना जाता है?",
            o: ["माध्यमिक", "गतिशील", "स्थिर", "प्राथमिक"],
            a: 2,
            t: "आनुवंशिकता को एक स्थिर (Static) संरचना माना जाता है क्योंकि गर्भाधान के समय जो जीन्स बच्चे को मिलते हैं, उनमें बाद में बुनियादी बदलाव नहीं किया जा सकता।"
        },
        {
            q: "किशोरावस्था में चरित्र निर्माण से जो अवस्था संबंधित है, वह निम्न में से है—",
            o: [
                "परंपराओं को धारण करने की अवस्था",
                "आधारहीन आत्म-चेतना अवस्था",
                "आधारयुक्त आत्म-चेतना अवस्था",
                "स्वकेन्द्रित अवस्था"
            ],
            a: 1,
            t: "किशोरावस्था को 'आधारहीन आत्म-चेतना अवस्था' कहा जाता है, जहाँ किशोर बिना किसी ठोस आधार के अपनी पहचान और आत्म-छवि को लेकर अत्यधिक संवेदनशील रहता है।"
        },
        {
            q: "शारीरिक वृद्धि पर सीधा प्रभाव डालने वाली प्रमुख ग्रंथि कौन सी है?",
            o: ["एड्रिनल", "थायमस", "पीनियल", "पिट्यूटरी"],
            a: 3,
            t: "पिट्यूटरी ग्रंथि (पीयूष ग्रंथि) से वृद्धि हार्मोन (HGH) स्रावित होता है, जो मांसपेशियों और अस्थियों की वृद्धि को नियंत्रित करता है।"
        }
    ];

    const totalQ = questionsPool.length;
    const qPerPage = 25;

    const orders = {
        'A': Array.from({length: totalQ}, (_, i) => i),
        'B': Array.from({length: totalQ}, (_, i) => totalQ - 1 - i),
        'C': [14, 3, 21, 7, 0, 12, 4, 19, 6, 11, 2, 17, 8, 20, 15, 9, 18, 13, 16, 24, 10, 22, 23, 5, 1],
        'D': [2, 12, 1, 19, 7, 11, 23, 4, 20, 8, 15, 16, 10, 24, 9, 18, 22, 13, 14, 3, 17, 6, 21, 5, 0]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `बाल विकास एवं शिक्षाशास्त्र - SET ${type}`;
        const indices = orders[type];
        currentQuestions = indices.map(idx => questionsPool[idx]);
        renderPage(0);
    }

    function renderPage(page) {
        currentPage = page;
        const totalPages = Math.ceil(totalQ / qPerPage);
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = Math.min(start + qPerPage, totalQ);
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / ${totalPages}`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page >= totalPages - 1);
        window.scrollTo(0,0);
    }

    function changePage(direction) {
        const totalPages = Math.ceil(totalQ / qPerPage);
        const newPage = currentPage + direction;
        if (newPage >= 0 && newPage < totalPages) {
            renderPage(newPage);
        }
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br><b>व्याख्या:</b> ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत उत्तर। सही जवाब है: <b>${item.o[item.a]}</b> <br><b>व्याख्या:</b> ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / ${totalQ}`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) { 
            buttons[selIdx].classList.add('correct'); 
            feed.innerHTML = `✅ सही उत्तर!`; 
            feed.style.color = "green";
        } else { 
            buttons[selIdx].classList.add('wrong'); 
            buttons[item.a].classList.add('correct'); 
            feed.innerHTML = `❌ गलत उत्तर। सही जवाब है: <b>${item.o[item.a]}</b>`; 
            feed.style.color = "red";
        }
        feed.style.display = "block";
        feed.innerHTML += `<br><b>व्याख्या:</b> ${item.t}`;
    }
</script>
