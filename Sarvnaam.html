<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सर्वनाम मास्टर क्विज़ - 100 प्रश्न</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 450px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #e67e22; }
        .btn-d { background: #16a085; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">हिन्दी व्याकरण मास्टर टेस्ट</h2>
        <p>विषय: सर्वनाम (Sarvnaam)<br>कृपया अपना सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">सर्वनाम क्विज़</h1>
        <p>100 कठिन प्रश्न | प्रतियोगी परीक्षा स्तर</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">कुल स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    const questionsPool = [
        { q: "'वह कल आएगा' - इस वाक्य में 'वह' सर्वनाम का कौन सा भेद है?", o: ["उत्तम पुरुष", "मध्यम पुरुष", "अन्य पुरुष", "निश्चयवाचक"], a: 2, t: "पुरुषवाचक सर्वनाम के तीन भेदों में 'वह' अन्य पुरुष है।" },
        { q: "'मैं अपने आप काम कर लूँगा' - वाक्य में 'अपने आप' है:", o: ["पुरुषवाचक", "निश्चयवाचक", "निजवाचक", "संबंधवाचक"], a: 2, t: "स्वयं, खुद, या अपने आप के लिए निजवाचक सर्वनाम होता है।" },
        { q: "सर्वनाम के कितने भेद होते हैं?", o: ["चार", "पाँच", "छह", "सात"], a: 2, t: "सर्वनाम के 6 भेद होते हैं।" },
        { q: "'कोई आ रहा है' - इस वाक्य में 'कोई' किस प्रकार का सर्वनाम है?", o: ["निश्चयवाचक", "अनिश्चयवाचक", "संबंधवाचक", "निजवाचक"], a: 1, t: "अनिश्चित व्यक्ति के लिए 'कोई' अनिश्चयवाचक सर्वनाम है।" },
        { q: "'जो करेगा सो भरेगा' - रेखांकित शब्दों में सर्वनाम है:", o: ["संबंधवाचक", "निश्चयवाचक", "निजवाचक", "पुरुषवाचक"], a: 0, t: "दो बातों में संबंध जोड़ने वाले शब्द संबंधवाचक कहलाते हैं।" },
        { q: "हिंदी में कुल कितने सर्वनाम (मूल) हैं?", o: ["9", "10", "11", "12"], a: 2, t: "हिंदी में मूल सर्वनाम 11 हैं: मैं, तू, आप, यह, वह, जो, सो, कोई, कुछ, कौन, क्या।" },
        { q: "निम्नलिखित में से कौन सा शब्द 'पुरुषवाचक सर्वनाम' नहीं है?", o: ["मैं", "तुम", "वह", "कौन"], a: 3, t: "'कौन' प्रश्नवाचक सर्वनाम है।" },
        { q: "'यह मेरा घर है' - इस वाक्य में 'यह' क्या है?", o: ["निश्चयवाचक सर्वनाम", "अनिश्चयवाचक सर्वनाम", "निजवाचक सर्वनाम", "संज्ञा"], a: 0, t: "निकट की वस्तु का निश्चित बोध कराने वाला।" },
        { q: "'शायद कमरे में कोई छिपा हुआ है' - इस वाक्य में रेखांकित शब्द है:", o: ["प्रश्नवाचक", "अनिश्चयवाचक", "निजवाचक", "संबंधवाचक"], a: 1, t: "अनिश्चयवाचक।" },
        { q: "'आप' सर्वनाम का प्रयोग किस अर्थ में निजवाचक के रूप में होता है?", o: ["आदर के लिए", "स्वयं के लिए", "मध्यम पुरुष के लिए", "अन्य पुरुष के लिए"], a: 1, t: "जब 'आप' का प्रयोग 'स्वयं' हेतु हो, तो वह निजवाचक है।" },
        { q: "'तुम' सर्वनाम का प्रयोग किस पुरुष के अंतर्गत होता है?", o: ["उत्तम पुरुष", "मध्यम पुरुष", "अन्य पुरुष", "प्रथम पुरुष"], a: 1, t: "श्रोता के लिए मध्यम पुरुष का प्रयोग होता है।" },
        { q: "उत्तम पुरुष सर्वनाम का उदाहरण है:", o: ["मैं", "तुम", "वह", "वे"], a: 0, t: "वक्ता स्वयं के लिए उत्तम पुरुष (मैं/हम) का प्रयोग करता है।" },
        { q: "'वह बहुत अच्छा लड़का है' - वाक्य में 'वह' कौन सा सर्वनाम है?", o: ["निश्चयवाचक", "अनिश्चयवाचक", "निजवाचक", "संबंधवाचक"], a: 0, t: "निश्चयवाचक।" },
        { q: "'कुछ' सर्वनाम का प्रयोग इनमें से किसके लिए होता है?", o: ["सजीव के लिए", "निर्जीव/पदार्थ के लिए", "दोनों के लिए", "कोई नहीं"], a: 1, t: "'कुछ' प्रायः वस्तुओं या अनिश्चित मात्रा के लिए आता है।" },
        { q: "संबंधवाचक सर्वनाम शब्द है:", o: ["कौन", "कोई", "जो", "वह"], a: 2, t: "जो-सो संबंधवाचक हैं।" },
        { q: "'जिसकी लाठी उसकी भैंस' - रेखांकित शब्दों में सर्वनाम का प्रकार है:", o: ["निजवाचक", "निश्चयवाचक", "संबंधवाचक", "अनिश्चयवाचक"], a: 2, t: "संबंधवाचक।" },
        { q: "'आप कहाँ जा रहे हैं?' - वाक्य में 'आप' है:", o: ["निजवाचक", "मध्यम पुरुष", "उत्तम पुरुष", "अन्य पुरुष"], a: 1, t: "यहाँ 'आप' आदरसूचक मध्यम पुरुष है।" },
        { q: "निम्न में से कौन सा शब्द प्रश्नवाचक सर्वनाम नहीं है?", o: ["क्या", "कौन", "कैसे", "किसी"], a: 3, t: "'किसी' अनिश्चयवाचक है।" },
        { q: "'दूध में कुछ गिर गया है' - वाक्य में 'कुछ' है:", o: ["निश्चयवाचक", "अनिश्चयवाचक", "प्रश्नवाचक", "निजवाचक"], a: 1, t: "अनिश्चयवाचक।" },
        { q: "पुरुषवाचक सर्वनाम के कितने उपभेद हैं?", o: ["दो", "तीन", "चार", "पाँच"], a: 1, t: "तीन: उत्तम, मध्यम और अन्य पुरुष।" },
        { q: "'वे' सर्वनाम है:", o: ["उत्तम पुरुष", "मध्यम पुरुष", "अन्य पुरुष", "निजवाचक"], a: 2, t: "अन्य पुरुष।" },
        { q: "निजवाचक सर्वनाम का प्रयोग किस वाक्य में हुआ है?", o: ["यह मेरी निजी पुस्तक है", "आज अपनापन कहाँ है", "मैं आप ही चला आता", "अपनों से क्या छिपाना"], a: 2, t: "'मैं आप ही' (स्वयं ही) निजवाचक है।" },
        { q: "'यह' सर्वनाम का बहुवचन रूप क्या है?", o: ["वे", "इन", "ये", "ए"], a: 2, t: "यह का बहुवचन 'ये' होता है।" },
        { q: "'वह' का बहुवचन रूप है:", o: ["वे", "वो", "वहाँ", "इन्हें"], a: 0, t: "वह का बहुवचन 'वे'।" },
        { q: "इनमें से कौन सा शब्द सर्वनाम नहीं है?", o: ["कुछ", "क्या", "इधर", "कौन"], a: 2, t: "'इधर' क्रियाविशेषण है, सर्वनाम नहीं।" },
        
        // 26-50: कारक और सर्वनाम (Karak & Sarvnaam)
        { q: "'मैंने' शब्द में कौन सा कारक है?", o: ["कर्ता", "कर्म", "करण", "सम्प्रदान"], a: 0, t: "मैं + ने (कर्ता कारक)।" },
        { q: "सर्वनाम का प्रयोग किस कारक में नहीं होता?", o: ["कर्ता", "कर्म", "संबोधन", "अपादान"], a: 2, t: "सर्वनामों में 'संबोधन' कारक नहीं होता।" },
        { q: "'मुझसे' में सर्वनाम और कारक है:", o: ["उत्तम पुरुष, करण", "मध्यम पुरुष, कर्म", "उत्तम पुरुष, अपादान", "A और C दोनों"], a: 3, t: "'मुझसे' करण (साधन) और अपादान (अलगाव) दोनों हो सकता है।" },
        { q: "'तुम्हारे लिए' में कौन सा कारक है?", o: ["सम्प्रदान", "संबंध", "अधिकरण", "करण"], a: 0, t: "तुम्हारे 'लिए' (सम्प्रदान)।" },
        { q: "'उसका' शब्द में कारक है:", o: ["कर्म", "करण", "संबंध", "अपादान"], a: 2, t: "वह + का = उसका (संबंध कारक)।" },
        { q: "'हम' का कारक रूप 'हमें' किस कारक में है?", o: ["कर्ता", "कर्म", "करण", "अपादान"], a: 1, t: "हमें (कर्म कारक)।" },
        { q: "किस वाक्य में 'यह' सार्वनामिक विशेषण है?", o: ["यह मेरा घर है", "यह घर मेरा है", "यह कल आएगा", "यह क्या है"], a: 1, t: "जब सर्वनाम संज्ञा से तुरंत पहले आए, तो वह विशेषण बन जाता है।" },
        { q: "'उसे' शब्द में मूल सर्वनाम और कारक है:", o: ["वह, कर्म", "वह, कर्ता", "उत, कर्म", "उ, सम्प्रदान"], a: 0, t: "वह + को = उसे (कर्म)।" },
        { q: "'कोई' का कर्म कारक रूप होगा:", o: ["कोई को", "किसी को", "किन्हीं को", "कौन को"], a: 1, t: "किसी को।" },
        { q: "'जो' का संबंध कारक रूप है:", o: ["जिसका", "जिसको", "जिससे", "जिन्होंने"], a: 0, t: "जिसका।" },
        { q: "'मैं' सर्वनाम का सम्प्रदान कारक रूप (एकवचन) है:", o: ["मुझको", "मेरे लिए", "A और B दोनों", "मुझसे"], a: 2, t: "मुझको/मेरे लिए दोनों सम्प्रदान हैं।" },
        { q: "सर्वनाम वाले वाक्यों में लिंग का पता किससे चलता है?", o: ["संज्ञा से", "क्रिया से", "विशेषण से", "वचन से"], a: 1, t: "जैसे: 'वह जाता है' vs 'वह जाती है'।" },
        { q: "'तुमको' और 'तुम्हें' किस कारक के रूप हैं?", o: ["कर्ता", "कर्म", "करण", "अपादान"], a: 1, t: "कर्म।" },
        { q: "'अपना' सर्वनाम का प्रयोग किसके लिए होता है?", o: ["निजवाचक", "निश्चयवाचक", "पुरुषवाचक", "प्रश्नवाचक"], a: 0, t: "निजवाचक।" },
        { q: "'कौन सा' किस प्रकार का सर्वनाम है?", o: ["प्रश्नवाचक", "निश्चयवाचक", "संबंधवाचक", "अनिश्चयवाचक"], a: 0, t: "प्रश्नवाचक।" },
        { q: "अनिश्चयवाचक सर्वनाम का अपादान कारक (बहुवचन) रूप है:", o: ["किसी से", "किनसे", "किन्हीं से", "किनको"], a: 2, t: "किन्हीं से।" },
        { q: "'आप' शब्द का प्रयोग आदरार्थ किस पुरुष में होता है?", o: ["उत्तम पुरुष", "मध्यम पुरुष", "अन्य पुरुष", "निजवाचक"], a: 1, t: "मध्यम पुरुष।" },
        { q: "'स्वयं' सर्वनाम का भेद है:", o: ["पुरुषवाचक", "निश्चयवाचक", "निजवाचक", "प्रश्नवाचक"], a: 2, t: "निजवाचक।" },
        { q: "'तेरा, तेरी' किस कारक के चिह्न हैं?", o: ["कर्ता", "कर्म", "करण", "संबंध"], a: 3, t: "संबंध कारक।" },
        { q: "संबंधवाचक सर्वनाम का प्रयोग किस वाक्य में है?", o: ["कौन आया है", "वह मेरी कार है", "जैसी करनी वैसी भरनी", "मैं खुद कर लूँगा"], a: 2, t: "जैसी-वैसी।" },
        { q: "'किन्हीं' शब्द सर्वनाम का कौन सा रूप है?", o: ["एकवचन", "बहुवचन", "त्रिवचन", "द्विवचन"], a: 1, t: "कोई का बहुवचन किन्हीं।" },
        { q: "'हमसे' शब्द में मूल शब्द है:", o: ["हम्म", "हम", "मैं", "हमें"], a: 2, t: "मैं (उत्तम पुरुष) का बहुवचन रूप 'हम' है।" },
        { q: "प्रश्नवाचक सर्वनाम 'क्या' का प्रयोग किसके लिए होता है?", o: ["व्यक्तियों के लिए", "वस्तुओं के लिए", "स्थानों के लिए", "A और B दोनों"], a: 1, t: "क्या वस्तुओं हेतु, कौन व्यक्तियों हेतु।" },
        { q: "सर्वनाम का विकारी शब्द क्या है?", o: ["लिंग", "वचन", "कारक", "B और C दोनों"], a: 3, t: "सर्वनाम लिंग से नहीं, वचन और कारक से बदलते हैं।" },

        { q: "श्रोता के लिए किस सर्वनाम का प्रयोग होता है?", o: ["उत्तम पुरुष", "मध्यम पुरुष", "अन्य पुरुष", "सभी"], a: 1, t: "मध्यम पुरुष।" },
        { q: "'वह' जा रहा है - यहाँ 'वह' किस पुरुष का है?", o: ["उत्तम", "मध्यम", "अन्य", "प्रथम"], a: 2, t: "अन्य पुरुष।" },
        { q: "'मुझे' किस प्रकार का सर्वनाम है?", o: ["उत्तम पुरुष", "मध्यम पुरुष", "अन्य पुरुष", "निश्चयवाचक"], a: 0, t: "मैं का विकारी रूप।" },
        { q: "'कुछ न कुछ' किस सर्वनाम का उदाहरण है?", o: ["अनिश्चयवाचक", "निश्चयवाचक", "संयुक्त सर्वनाम", "निजवाचक"], a: 2, t: "दो सर्वनामों का मेल (डॉ. दीमशित्स के अनुसार संयुक्त)।" },
        { q: "'कौन' आया है? - इसमें कौन है:", o: ["निश्चयवाचक", "अनिश्चयवाचक", "प्रश्नवाचक", "संबंधवाचक"], a: 2, t: "प्रश्नवाचक।" },
        { q: "निजवाचक सर्वनाम 'स्वयं' का मूल शब्द है:", o: ["स्व", "निज", "अपना", "खुद"], a: 0, t: "स्व।" },
        { q: "'उसने' पत्र लिखा - 'उसने' है:", o: ["मध्यम पुरुष", "अन्य पुरुष", "उत्तम पुरुष", "निजवाचक"], a: 1, t: "अन्य पुरुष।" },
        { q: "निश्चयवाचक सर्वनाम 'यह' का प्रयोग होता है:", o: ["निकट की वस्तु के लिए", "दूर की वस्तु के लिए", "अनिश्चित वस्तु के लिए", "व्यक्तियों के लिए"], a: 0, t: "निकटवर्ती हेतु।" },

        { q: "संबंधवाचक सर्वनाम का उदाहरण नहीं है:", o: ["जो", "सो", "वह", "जिसकी"], a: 2, t: "'वह' निश्चय या पुरुषवाचक है।" },

        { q: "'को' विभक्ति किस सर्वनाम के साथ कर्म कारक बनाती है?", o: ["मुझको", "उसको", "किन्हीं को", "ये सभी"], a: 3, t: "सभी कर्म कारक हैं।" },
        { q: "सर्वनाम संज्ञा के स्थान पर प्रयुक्त होने वाला शब्द है, यह कथन:", o: ["सत्य है", "असत्य है", "आंशिक सत्य है", "निरर्थक है"], a: 0, t: "सर्वनाम की परिभाषा।" },
        { q: "'तुम' का बहुवचन रूप है:", o: ["तुम लोग", "तुम सब", "तुम", "ये सभी"], a: 3, t: "सभी बहुवचन भाव देते हैं।" },
        { q: "'हम' किस कारक का रूप है?", o: ["कर्ता", "कर्म", "करण", "संबंध"], a: 0, t: "मैं का कर्ता कारक बहुवचन।" },
        { q: "'मेरा' शब्द में प्रत्यय जैसा क्या जुड़ा है?", o: ["का", "रा", "ना", "आ"], a: 1, t: "मैं + रा = मेरा (संबंध)।" },
        { q: "निजवाचक सर्वनाम का उदाहरण 'स्व' का अर्थ है:", o: ["दूसरे का", "अपना", "उसका", "किसी का"], a: 1, t: "अपना।" },
        { q: "क्या' किस प्रकार का सर्वनाम है?", o: ["प्रश्नवाचक", "अनिश्चयवाचक", "निश्चयवाचक", "संबंधवाचक"], a: 0, t: "प्रश्नवाचक।" },
        { q: "'कोई' का प्रयोग किस वाक्य में सही है?", o: ["कोई आया है", "कोई पुस्तक लाओ", "दोनों", "कोई नहीं"], a: 2, t: "प्राणी और अप्राणी दोनों हेतु प्रयुक्त हो सकता है (संदर्भ भेद)।" },
        { q: "'किसे' सर्वनाम का रूप है:", o: ["प्रश्नवाचक", "अनिश्चयवाचक", "निश्चयवाचक", "निजवाचक"], a: 0, t: "प्रश्नवाचक।" },
        { q: "'उनको' में कौन सा कारक है?", o: ["कर्ता", "कर्म", "करण", "अपादान"], a: 1, t: "कर्म।" },
        { q: "'जिसने' शब्द में कारक है:", o: ["कर्ता", "कर्म", "करण", "सम्प्रदान"], a: 0, t: "कर्ता।" },
        { q: "'मुझमें' शब्द में कारक है:", o: ["करण", "सम्प्रदान", "अपादान", "अधिकरण"], a: 3, t: "अधिकरण।" },
        { q: "'वे' जा रहे हैं - इसमें 'वे' है:", o: ["बहुवचन", "एकवचन", "दोनों", "कोई नहीं"], a: 0, t: "बहुवचन।" },
        { q: "'तू' सर्वनाम का प्रयोग किसके लिए वर्जित है?", o: ["ईश्वर", "मित्र", "अपनों से बड़े", "बच्चों"], a: 2, t: "बड़ों के लिए 'तू' का प्रयोग अशिष्ट माना जाता है।" },
        { q: "मध्यम पुरुष का आदरार्थक रूप है:", o: ["तू", "तुम", "आप", "वे"], a: 2, t: "आप।" },
        { q: "'मुझसे' काम नहीं होता - यहाँ 'मुझसे' है:", o: ["कर्ता", "करण", "कर्म", "अपादान"], a: 1, t: "करण।" },
        { q: "वह' का तिरस्कारवाचक रूप हो सकता है:", o: ["उसे", "उन्होने", "वह", "वो"], a: 3, t: "आम बोलचाल में 'वो' कभी-कभी कम आदर दर्शाता है।" },
        { q: "संबंधवाचक सर्वनाम 'सो' का आधुनिक रूप है:", o: ["वही", "वह", "जो", "जैसा"], a: 1, t: "जो-सो अब जो-वह के रूप में अधिक प्रयुक्त होता है।" },
        { q: "सर्वनाम का प्रयोग होता है:", o: ["संज्ञा के पहले", "संज्ञा के बाद", "संज्ञा के स्थान पर", "विशेषण के स्थान पर"], a: 2, t: "स्थान पर।" },
        { q: "'जैसा बोओगे वैसा काटोगे' - इसमें 'जैसा' है:", o: ["संबंधवाचक", "निश्चयवाचक", "निजवाचक", "प्रश्नवाचक"], a: 0, t: "संबंधवाचक।" },
        { q: "किस शब्द में 'न' प्रत्यय लगकर सर्वनाम का कारक रूप बना है?", o: ["उसने", "किसने", "जिन्होंने", "ये सभी"], a: 3, t: "ने (कर्ता कारक चिह्न)।" },
        { q: "'तुमको' का एकवचन रूप है:", o: ["तुझे", "तुम्हें", "तुम", "तू"], a: 0, t: "तुझे।" },
        { q: "'हमारा' में मूल शब्द और कारक है:", o: ["हम, संबंध", "मैं, संबंध", "हमें, कर्म", "मुझ, संबंध"], a: 1, t: "मैं (बहुवचन हम) + रा (संबंध)।" },
        { q: "'इन्हें' में कौन सा वचन है?", o: ["एकवचन", "बहुवचन", "उभयवचन", "कोई नहीं"], a: 1, t: "यह का बहुवचन ये + को = इन्हें।" },
        { q: "'वहाँ कौन है?' - रेखांकित शब्द है:", o: ["निश्चयवाचक", "प्रश्नवाचक", "निजवाचक", "अनिश्चयवाचक"], a: 1, t: "प्रश्नवाचक।" },
        { q: "'आप' का प्रयोग अन्य पुरुष में कब होता है?", o: ["स्वयं के लिए", "परिचय देते समय (जैसे गांधीजी... आप...)", "आदर के लिए", "B और C दोनों"], a: 3, t: "परिचय और आदर हेतु अन्य पुरुष में भी होता है।" },
        { q: "'किन्हीं को' बुलाओ - 'किन्हीं' है:", o: ["अनिश्चयवाचक", "निश्चयवाचक", "प्रश्नवाचक", "निजवाचक"], a: 0, t: "अनिश्चयवाचक बहुवचन।" },
        { q: "सर्वनाम में कितने कारक होते हैं?", o: ["6", "7", "8", "9"], a: 1, t: "7 कारक।" }
    ];

    const orders = {
        'A': Array.from({length: 100}, (_, i) => i),
        'B': Array.from({length: 100}, (_, i) => 99 - i),
        'C': [13,42,8,91,25,67,5,84,33,19,56,4,72,99,0,88,11,37,64,22,95,50,6,81,15,44,79,3,28,60,93,48,7,12,85,55,2,39,70,96,17,45,29,62,82,31,69,94,20,53,86,9,26,41,74,30,63,97,18,51,87,1,43,24,65,35,76,92,10,54,89,21,46,73,98,34,58,16,49,71,40,68,23,57,80,36,61,90,14,52,78,32,59,83,47,66,75,38,27,77],
        'D': [50,99,2,75,12,88,33,64,1,44,81,19,92,7,55,30,85,11,66,23,77,4,41,95,20,69,8,52,15,83,37,70,98,28,61,46,90,16,59,10,48,93,24,63,89,35,72,9,51,84,18,60,97,26,56,40,87,31,67,91,22,54,86,13,58,94,32,65,74,39,82,14,53,79,25,68,96,3,45,80,17,62,71,34,57,78,6,43,76,21,49,73,5,42,65,47,38,29,36,0]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `सर्वनाम मास्टर - SET ${type}`;
        const indices = orders[type];
        currentQuestions = indices.map(idx => questionsPool[idx]);
        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही! व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही: <b>${item.o[item.a]}</b> <br>व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) { buttons[selIdx].classList.add('correct'); feed.innerHTML = `✅ सही!`; }
        else { buttons[selIdx].classList.add('wrong'); buttons[item.a].classList.add('correct'); feed.innerHTML = `❌ गलत। सही: ${item.o[item.a]}`; }
        feed.style.display = "block";
        feed.innerHTML += `<br>व्याख्या: ${item.t}`;
    }

    function changePage(dir) { currentPage += dir; renderPage(currentPage); }
</script>
