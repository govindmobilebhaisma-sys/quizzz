<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शिक्षा मनोविज्ञान एवं शिक्षण शास्त्र क्विज़</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 450px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; line-height: 1.5; white-space: pre-line; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; line-height: 1.4; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); line-height: 1.5; }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">बाल विकास एवं शिक्षण शास्त्र</h2>
        <p>25 महत्वपूर्ण प्रश्न | शिक्षक भर्ती परीक्षा स्तर<br>कृपया अपना सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">शिक्षा मनोविज्ञान एवं शिक्षण शास्त्र क्विज़</h1>
        <p>सिद्धांत, अवधारणाएँ और शिक्षण विधियाँ</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">कुल स्कोर: 0 / 25</div>
        <div id="pageDisplay">पेज: 1 / 1</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)" disabled>अगला</button>
    </div>
</div>

            o: ["क्लार्क हल", "बुडवर्थ", "जॉन डीवी", "वॉटसन"],
            a: 2,
            t: "जॉन डीवी ने अपनी पुस्तक 'स्कूल एंड सोसाइटी' में शिक्षा को एक त्रिध्रुवीय/त्रिमुखी प्रक्रिया बताया, जिसमें शिक्षक, शिक्षार्थी और समाज/पाठ्यक्रम शामिल हैं।"
        },
        {
            q: "बालक के व्यवहार का अध्ययन करने के लिए सर्वप्रथम प्रश्नावली विधि का निर्माण किसने किया?",
            o: ["विलियम मैकडूगल", "बी. एफ. स्किनर", "स्टेनली हॉल", "बुडवर्थ"],
            a: 2,
            t: "बालकों के व्यवहार का अध्ययन करने के लिए प्रश्नावली विधि का सर्वप्रथम प्रयोग जी. स्टेनली हॉल ने किया। (सामान्य व्यक्तित्व मूल्यांकन के लिए वुडवर्थ ने पर्सनल डेटा शीट बनाई थी)।"
        },
        {
            q: "शिक्षा मनोविज्ञान की विशेषता नहीं है—",
            o: [
                "शिक्षा मनोविज्ञान विश्लेषणात्मक होती है।",
                "शिक्षा मनोविज्ञान साध्य होती है।",
                "शिक्षा मनोविज्ञान साधन होती है।",
                "शिक्षा मनोविज्ञान का क्षेत्र सीमित होता है।"
            ],
            a: 1,
            t: "शिक्षा मनोविज्ञान साध्य (End) नहीं, बल्कि बालक के सर्वांगीण विकास का एक साधन (Means) है।"
        },
        {
            q: "सूक्ष्म शिक्षण (Micro-teaching) लाभदायक है—",
            o: [
                "किसी विषय पर व्याख्या देने में",
                "पूरे पाठ को पढ़ाने में",
                "दल शिक्षण में",
                "एक कौशल के शिक्षण में"
            ],
            a: 3,
            t: "सूक्ष्म शिक्षण एक स्केल-डाउन अध्यापन प्रक्रिया है जिसका मुख्य उद्देश्य विशिष्ट शिक्षण कौशलों (Teaching Skills) का गहन अभ्यास और विकास कराना है।"
        },
        {
            q: "छात्रों के अनुकूल चरित्र निर्माण में सबसे अधिक महत्वपूर्ण भूमिका किसकी होती है—",
            o: [
                "अध्यापक के उपदेशों की",
                "स्वयं अध्यापक के आदर्श चरित्र की",
                "सहपाठियों के व्यवहार की",
                "बाहरी लोगों के व्यवहार की"
            ],
            a: 1,
            t: "शिक्षक छात्रों के लिए एक आदर्श रोल मॉडल (Role Model) होता है; उपदेश की तुलना में शिक्षक का स्वयं का आचरण बच्चों को सर्वाधिक प्रभावित करता है।"
        },
        {
            q: "शिक्षण में छात्रों की विविध आवश्यकताओं को समझने के लिए शिक्षक को किन कारकों पर ध्यान देना चाहिए—\n(I) प्रत्येक छात्र के सीखने की गति\n(II) छात्रों की व्यक्तिगत रुचि और पूर्व ज्ञान\n(III) सभी छात्रों को एक ही तरीके से पढ़ाने पर जोर देना\n(IV) समूह और व्यक्तिगत आवश्यकताओं के अनुसार शिक्षण शैली में परिवर्तन करना",
            o: ["केवल I, II, III", "केवल I, II, IV", "केवल II, III, IV", "केवल I, III, IV"],
            a: 1,
            t: "कथन III गलत है क्योंकि सभी बच्चों को एक ही तरीके से पढ़ाना व्यक्तिगत विभिन्नताओं की उपेक्षा करता है। अतः I, II और IV सही हैं।"
        }
    ];

    const orders = {
        'A': Array.from({length: 25}, (_, i) => i),
        'B': Array.from({length: 25}, (_, i) => 24 - i),
        'C': [14, 3, 21, 7, 0, 12, 4, 19, 6, 11, 2, 17, 20, 15, 9, 18, 13, 16, 10, 24, 22, 1, 8, 23, 5],
        'D': [2, 12, 1, 19, 7, 11, 4, 20, 8, 15, 16, 10, 24, 9, 18, 13, 22, 14, 23, 3, 17, 6, 21, 5, 0]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `शिक्षा मनोविज्ञान एवं शिक्षण शास्त्र - SET ${type}`;
        const indices = orders[type];
        currentQuestions = indices.map(idx => questionsPool[idx]);
        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx},${oi}, this)"><b>(${String.fromCharCode(65 + oi)})</b>${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 1`;
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
        window.scrollTo(0, 0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br>व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब है: <b>(${String.fromCharCode(65 + item.a)}) ${item.o[item.a]}</b> <br>व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / 25`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) { 
            buttons[selIdx].classList.add('correct'); 
            feed.innerHTML = `✅ सही!`; 
        } else { 
            buttons[selIdx].classList.add('wrong'); 
            buttons[item.a].classList.add('correct'); 
            feed.innerHTML = `❌ गलत। सही: <b>(${String.fromCharCode(65 + item.a)}) ${item.o[item.a]}</b>`; 
        }
        feed.style.display = "block";
        feed.innerHTML += `<br>व्याख्या: ${item.t}`;
    }

    function changePage(dir) { 
        currentPage += dir; 
        renderPage(currentPage); 
    }
</script>
