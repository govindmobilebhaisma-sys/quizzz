    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --info: #8e44ad;
            --light: #f5f7fa;
            --dark: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; color: var(--primary); }
        .score-board {
            position: sticky;
            top: 10px;
            background: var(--dark);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 20px;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 1.2em;
            font-weight: bold;
        }
        .question-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            transition: transform 0.2s;
        }
        .q-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #34495e;
        }
        .q-number {
            color: var(--primary);
            font-weight: bold;
            margin-right: 10px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        button.option {
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            background: #fafafa;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1em;
            transition: all 0.2s;
            color: #2c3e50;
        }
        button.option:hover:not(:disabled) {
            background-color: #ebf5fb;
            border-color: var(--primary);
        }
        button.option:disabled {
            cursor: default;
            opacity: 0.9;
        }
        button.correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
        }
        button.correct::after { content: ' ✔'; float: right; font-weight: bold; }
        button.wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24;
        }
        button.wrong::after { content: ' ✖'; float: right; font-weight: bold; }
        
        /* Feedback Box Styling */
        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 1em;
            line-height: 1.5;
            background-color: #f8f9fa;
            border-left: 5px solid #ccc;
        }
        .sandhi-type {
            display: inline-block;
            background-color: var(--info);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>

        ["दुर्बल", ["दुर + बल", "दुः + बल", "दुर् + बल", "दु + बल"], 1, "विसर्ग संधि"],
        ["आशीर्वाद", ["आशीर + वाद", "आशिः + वाद", "आशीः + वाद", "आशी + वाद"], 2, "विसर्ग संधि"],
        ["दुराशा", ["दुर + आशा", "दुरा + शा", "दुः + आशा", "दुर् + आशा"], 2, "विसर्ग संधि"],

        // --- विसर्ग संधि (भाग 2) ---
        ["निस्सन्देह", ["निः + सन्देह", "निस् + सन्देह", "नि + सन्देह", "नी + सन्देह"], 0, "विसर्ग संधि"],
        ["नमस्ते", ["नमस् + ते", "नमः + ते", "नमो + ते", "नम + स्ते"], 1, "विसर्ग संधि"],
        ["मनस्ताप", ["मनस् + ताप", "मनः + ताप", "मन + ताप", "मनो + ताप"], 1, "विसर्ग संधि"],
        ["दुस्तर", ["दुस् + तर", "दुः + तर", "दुर + तर", "दु + तर"], 1, "विसर्ग संधि"],
        ["निश्चल", ["निश् + चल", "निः + चल", "निस् + चल", "नी + चल"], 1, "विसर्ग संधि"],
        ["दुश्चरित्र", ["दुः + चरित्र", "दुश् + चरित्र", "दुस् + चरित्र", "दु + चरित्र"], 0, "विसर्ग संधि"],
        ["हरिश्चन्द्र", ["हरिश् + चन्द्र", "हरिः + चन्द्र", "हरि + चन्द्र", "हरी + चन्द्र"], 1, "विसर्ग संधि"],
        ["निष्ठुर", ["निष् + ठुर", "निः + ठुर", "नि + ठुर", "नी + ठुर"], 1, "विसर्ग संधि"],
        ["धनुष्टंकार", ["धनुष् + टंकार", "धनुः + टंकार", "धनु + टंकार", "धनु + ष्टंकार"], 1, "विसर्ग संधि"],
        ["निष्कपट", ["निष् + कपट", "निस् + कपट", "निः + कपट", "नि + कपट"], 2, "विसर्ग संधि"],

        // --- मिश्रित (कठिन प्रश्न) ---
        ["दुष्कर्म", ["दुष् + कर्म", "दुः + कर्म", "दुस् + कर्म", "दु + कर्म"], 1, "विसर्ग संधि"],
        ["आविष्कार", ["आविष् + कार", "आवि + कार", "आविः + कार", "आवी + कार"], 2, "विसर्ग संधि"],
        ["निरोग", ["निर + रोग", "निः + रोग", "निर् + रोग", "नी + रोग"], 1, "विसर्ग संधि"],
        ["नीरस", ["नीर + रस", "निर् + रस", "निः + रस", "नी + रस"], 2, "विसर्ग संधि"],
        ["अतएव", ["अत + एव", "अतः + एव", "अत + ऐव", "अते + व"], 1, "विसर्ग संधि"],
        ["प्रातःकाल", ["प्रात + काल", "प्रातो + काल", "प्रातः + काल", "प्रातस + काल"], 2, "विसर्ग संधि"],
        ["अन्तःकरण", ["अन्त + करण", "अन्तर + करण", "अन्तः + करण", "अन्न + करण"], 2, "विसर्ग संधि"],
        ["पुरस्कार", ["पुरस् + कार", "पुरः + कार", "पुर + कार", "पुरो + कार"], 1, "विसर्ग संधि"],
        ["भास्कर", ["भाः + कर", "भास + कर", "भाष् + कर", "भा + कर"], 0, "विसर्ग संधि"],
        ["वाचस्पति", ["वाचस् + पति", "वाच + पति", "वाचः + पति", "वाक् + पति"], 2, "विसर्ग संधि"]
    ];

    // Convert rawData to object array for easier processing
    const questions = rawData.map(item => ({
        q: item[0],
        o: item[1],
        a: item[2],
        t: item[3]
    }));

    let score = 0;
    let attempted = 0;
    const totalQuestions = questions.length; // 100

    function renderQuestions() {
        const quizArea = document.getElementById('quiz-area');
        
        questions.forEach((qObj, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${index}`;

            const qText = document.createElement('div');
            qText.className = 'q-text';
            qText.innerHTML = `<span class="q-number">प्र.${index + 1}</span> '${qObj.q}' का सही संधि विच्छेद है:`;
            card.appendChild(qText);

            const optGrid = document.createElement('div');
            optGrid.className = 'options-grid';

            qObj.o.forEach((optText, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(index, optIndex, btn);
                optGrid.appendChild(btn);
            });

            card.appendChild(optGrid);

            const feedback = document.createElement('div');
            feedback.className = 'feedback-box';
            feedback.id = `feedback-${index}`;
            card.appendChild(feedback);

            quizArea.appendChild(card);
        });

        // Update initial header
        document.querySelector('header p').innerText = `कुल प्रश्न: ${totalQuestions} | स्तर: प्रतियोगी परीक्षा`;
    }

    function checkAnswer(qIndex, selectedOptIndex, btnElement) {
        const qObj = questions[qIndex];
        const card = document.getElementById(`q-${qIndex}`);
        const allBtns = card.querySelectorAll('.option');
        const feedback = document.getElementById(`feedback-${qIndex}`);

        // Disable buttons after click
        allBtns.forEach(btn => btn.disabled = true);
        attempted++;

        let feedbackHtml = "";

        if (selectedOptIndex === qObj.a) {
            // User is Correct
            btnElement.classList.add('correct');
            score++;
            feedback.style.borderLeftColor = "#2ecc71";
            feedback.style.backgroundColor = "#d4edda";
            feedback.style.color = "#155724";
            feedbackHtml = `<strong>✅ बिलकुल सही उत्तर!</strong>`;
        } else {
            // User is Wrong
            btnElement.classList.add('wrong');
            allBtns[qObj.a].classList.add('correct'); // Show correct answer
            feedback.style.borderLeftColor = "#e74c3c";
            feedback.style.backgroundColor = "#f8d7da";
            feedback.style.color = "#721c24";
            feedbackHtml = `<strong>❌ गलत उत्तर!</strong> <br> सही विच्छेद: <b>${qObj.o[qObj.a]}</b>`;
        }

        // Add Sandhi Type details at the bottom of the feedback box
        feedbackHtml += `<br><span class="sandhi-type">📌 ${qObj.t}</span>`;
        
        feedback.innerHTML = feedbackHtml;
        feedback.style.display = 'block';

        updateScore();
    }

    function updateScore() {
        document.getElementById('scoreBoard').innerText = `स्कोर: ${score} / ${totalQuestions}`;
    }

    // Initialize Quiz
    renderQuestions();
</script>
