<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>व्याकरण मेगा टेस्ट: वाच्य, अव्यय और काल</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 480px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 12px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); line-height: 1.5; }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">हिन्दी व्याकरण मास्टर टेस्ट</h2>
        <p style="color:#666">विषय: वाच्य, अव्यय और काल (100 प्रश्न)<br>तैयारी: भारतीय प्रतियोगी परीक्षाएँ</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">व्याकरण क्विज़</h1>
        <p>वाच्य, अव्यय और काल - महत्वपूर्ण अभ्यास</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">कुल स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    const questionsPool = [
        // 1-35: वाच्य (Voice)
        { q: "'राम पुस्तक पढ़ता है' - इसमें कौन-सा वाच्य है?", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "संयुक्त वाच्य"], a: 0, t: "यहाँ क्रिया का सीधा संबंध कर्ता (राम) से है।" },
        { q: "'राम द्वारा पुस्तक पढ़ी गई' - यह उदाहरण है:", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "क्रिया वाच्य"], a: 1, t: "क्रिया कर्म (पुस्तक) के अनुसार बदली है, 'द्वारा' का प्रयोग कर्मवाच्य की पहचान है।" },
        { q: "'उससे बैठा नहीं जाता' - इसमें वाच्य है:", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "अकर्मक वाच्य"], a: 2, t: "अकर्मक क्रिया + असमर्थता का भाव = भाववाच्य।" },
        { q: "'चलो, अब सोया जाए' - यह वाक्य किस वाच्य में है?", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "सामान्य वाच्य"], a: 2, t: "यहाँ भाव की प्रधानता है, क्रिया सदा पुल्लिंग एकवचन रहती है।" },
        { q: "किस वाच्य में क्रिया सदैव एकवचन, पुल्लिंग तथा अन्य पुरुष में होती है?", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "उपरोक्त सभी"], a: 2, t: "यह भाववाच्य का मुख्य लक्षण है।" },
        { q: "कर्मवाच्य में किसकी प्रधानता होती है?", o: ["कर्ता की", "भाव की", "कर्म की", "विचार की"], a: 2, t: "कर्म की।" },
        { q: "'लड़की ने पत्र लिखा' - इसमें वाच्य है:", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "मिश्रित वाच्य"], a: 0, t: "ने विभक्ति वाले वाक्यों में क्रिया कर्म के अनुसार होने पर भी वाच्य 'कर्तृवाच्य' ही रहता है।" },
        { q: "'धूप में चला नहीं जाता' - इसमें वाच्य है:", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "निषेध वाच्य"], a: 2, t: "भाववाच्य।" },
        { q: "'सफाई की गई' - वाक्य में वाच्य पहचानिए:", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "कोई नहीं"], a: 1, t: "यहाँ कर्ता अज्ञात है और सफाई (कर्म) प्रधान है।" },
        { q: "'अखबार पढ़े जाते हैं' - वाक्य में वाच्य है:", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "उपरोक्त सभी"], a: 1, t: "कर्मवाच्य।" },
        { q: "कर्तृवाच्य का प्रयोग नहीं हुआ है:", o: ["महेश स्कूल गया", "अखबार पढ़े गए", "सीता पढ़ती है", "वह हँसता है"], a: 1, t: "'अखबार पढ़े गए' कर्मवाच्य है।" },
        { q: "भाववाच्य वाला वाक्य चुनिए:", o: ["मालिन माला बुनती है", "मुझसे बैठा नहीं जाता", "अशोक ने पुस्तक पढ़ी", "पेड़ काट दिया गया"], a: 1, t: "भाववाच्य।" },
        { q: "किस वाच्य में क्रिया अकर्मक और सकर्मक दोनों हो सकती है?", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "A और B दोनों"], a: 0, t: "कर्तृवाच्य में दोनों प्रकार की क्रियाएँ आती हैं।" },
        { q: "'राम सेब खाता है' का कर्मवाच्य रूप होगा:", o: ["राम से सेब खाया जाता है", "राम ने सेब खाया", "राम द्वारा सेब खाया गया", "A और C दोनों"], a: 3, t: "दोनों सही कर्मवाच्य रूप हैं।" },
        { q: "भाववाच्य में क्रिया सदैव होती है:", o: ["सकर्मक", "अकर्मक", "द्विकर्मक", "यौगिक"], a: 1, t: "भाववाच्य हमेशा अकर्मक क्रियाओं से बनता है।" },
        { q: "पुस्तक पढ़ी जाती है - इसमें वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "कोई नहीं"], a: 1, t: "कर्मवाच्य।" },
        { q: "वाच्य के कितने भेद हैं?", o: ["2", "3", "4", "5"], a: 1, t: "कर्तृ, कर्म और भाव।" },
        { q: "'मैं यह बोझ नहीं उठा सकता' का कर्मवाच्य होगा:", o: ["मुझसे यह बोझ नहीं उठाया जाता", "मेरे द्वारा बोझ नहीं उठेगा", "मैंने बोझ नहीं उठाया", "मुझसे बोझ नहीं उठे"], a: 0, t: "मुझसे ... उठाया जाता।" },
        { q: "निम्नलिखित में से 'कर्मवाच्य' का वाक्य चुनिए:", o: ["पक्षी उड़ रहे हैं", "राम के द्वारा पत्र लिखा जाता है", "मैं पढ़ता हूँ", "मुझसे चला नहीं जाता"], a: 1, t: "द्वारा + पत्र।" },
        { q: "जिस वाक्य में क्रिया का मुख्य विषय 'कर्ता' होता है, उसे कहते हैं:", o: ["कर्तृवाच्य", "कर्मवाच्य", "भाववाच्य", "विशेष वाच्य"], a: 0, t: "कर्तृवाच्य।" },
        { q: "'बालक से रोया नहीं जाता' - इसमें वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "अपूर्ण"], a: 2, t: "भाववाच्य।" },
        { q: "वह पढ़ता है - इसका भाववाच्य रूप क्या होगा?", o: ["उससे पढ़ा जाता है", "उसके द्वारा पढ़ा गया", "उसने पढ़ा", "पढ़ता है वह"], a: 0, t: "अकर्मक भाव में 'जाना' सहायक क्रिया जुड़ती है।" },
        { q: "'चोर पकड़ा गया' - इसमें वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "कोई नहीं"], a: 1, t: "कर्मवाच्य (कर्ता लुप्त है)।" },
        { q: "किस वाच्य में क्रिया का लिंग-वचन कर्म के अनुसार होता है?", o: ["कर्तृ", "कर्म", "भाव", "सभी"], a: 1, t: "कर्मवाच्य।" },
        { q: "पक्षी से उड़ा जाता है - इसमें वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "संयुक्त"], a: 2, t: "भाववाच्य।" },
        { q: "'मैं रामायण नहीं पढ़ सका' का भाववाच्य रूप है:", o: ["मुझसे रामायण नहीं पढ़ी गई", "मेरे द्वारा रामायण नहीं पढ़ी जा सकी", "मुझसे रामायण नहीं पढ़ी जा सकी", "मैंने रामायण नहीं पढ़ी"], a: 2, t: "सही रूपांतरण।" },
        { q: "'मजदूर पत्थर तोड़ रहे हैं' - वाच्य बताइए:", o: ["कर्तृ", "कर्म", "भाव", "यौगिक"], a: 0, t: "कर्तृवाच्य।" },
        { q: "'रोगी को दवा दी गई' - वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "कोई नहीं"], a: 1, t: "कर्मवाच्य।" },
        { q: "क्या उनसे पढ़ा जाएगा? - वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "अपूर्ण"], a: 2, t: "भाववाच्य।" },
        { q: "अकर्मक क्रिया किस वाच्य में नहीं होती?", o: ["कर्तृ", "भाव", "कर्म", "किसी में नहीं"], a: 2, t: "कर्मवाच्य के लिए कर्म (सकर्मक क्रिया) का होना अनिवार्य है।" },
        { q: "वाच्य का शाब्दिक अर्थ क्या है?", o: ["बोलने का विषय", "सुनने का विषय", "पढ़ने का विषय", "लिखने का विषय"], a: 0, t: "वाच्य = बोलने का विषय।" },
        { q: "क्रिया के जिस रूपांतर से कर्ता की प्रधानता का बोध हो, उसे कहते हैं:", o: ["कर्तृ", "कर्म", "भाव", "कारक"], a: 0, t: "कर्तृवाच्य।" },
        { q: "लड़के ने फल खाए - वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "कोई नहीं"], a: 0, t: "भले ही क्रिया फल के अनुसार है, पर 'ने' आने पर यह कर्तृवाच्य ही रहता है।" },
        { q: "चलो टहला जाए - वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "कोई नहीं"], a: 2, t: "भाववाच्य।" },
        { q: "आम खाया जाता है - वाच्य है:", o: ["कर्तृ", "कर्म", "भाव", "कोई नहीं"], a: 1, t: "कर्मवाच्य।" },

        // 36-70: अव्यय (Indeclinable)
        { q: "निम्नलिखित में से 'अव्यय' शब्द कौन-सा है?", o: ["उत्तर", "जापान", "ठीक", "कृष्णा"], a: 2, t: "ठीक एक अव्यय है, इसमें लिंग-वचन से बदलाव नहीं आता।" },
        { q: "अव्यय के कितने भेद होते हैं?", o: ["3", "4", "5", "6"], a: 1, t: "मुख्यतः 4 भेद (क्रियाविशेषण, संबंधबोधक, समुच्चयबोधक, विस्मयादिबोधक)।" },
        { q: "'वह धीरे-धीरे चलता है' - इसमें 'धीरे-धीरे' क्या है?", o: ["विशेषण", "क्रियाविशेषण", "संज्ञा", "सर्वनाम"], a: 1, t: "क्रिया की रीति बताने वाला अव्यय।" },
        { q: "'राम और श्याम भाई हैं' - इसमें 'और' शब्द है:", o: ["संबंधबोधक", "समुच्चयबोधक", "विस्मयादिबोधक", "निपात"], a: 1, t: "दो शब्दों को जोड़ने वाला।" },
        { q: "निम्न में से कौन-सा शब्द 'निपात' है?", o: ["भी", "पर", "और", "इसलिए"], a: 0, t: "भी, ही, तक निपात कहलाते हैं।" },
        { q: "'अहा! कितना सुंदर दृश्य है' - इसमें 'अहा' शब्द है:", o: ["विस्मयादिबोधक", "संबंधबोधक", "क्रियाविशेषण", "समुच्चयबोधक"], a: 0, t: "हर्ष सूचक विस्मयादिबोधक।" },
        { q: "'वह घर के सामने खड़ा है' - इसमें 'सामने' क्या है?", o: ["समुच्चयबोधक", "संबंधबोधक", "विस्मयादिबोधक", "निपात"], a: 1, t: "घर के साथ संबंध बता रहा है।" },
        { q: "'लड़का जल्दी-जल्दी चल रहा है' - 'जल्दी-जल्दी' है:", o: ["परिमाणवाचक", "स्थानवाचक", "कालवाचक", "रीतिवाचक"], a: 3, t: "कार्य करने का तरीका।" },
        { q: "'मैं कल आऊँगा' - इसमें 'कल' किस प्रकार का क्रियाविशेषण है?", o: ["स्थानवाचक", "कालवाचक", "रीतिवाचक", "परिमाणवाचक"], a: 1, t: "समय का बोध।" },

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `व्याकरण मास्टर - SET ${type}`;

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);

            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br>व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब है: <b>${item.o[item.a]}</b> <br>व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) { buttons[selIdx].classList.add('correct'); feed.innerHTML = `✅ सही!`; }
        else { buttons[selIdx].classList.add('wrong'); buttons[item.a].classList.add('correct'); feed.innerHTML = `❌ गलत। सही: ${item.o[item.a]}`; }
        feed.style.display = "block";
        feed.innerHTML += `<br>व्याख्या: ${item.t}`;
    }

    function changePage(dir) { currentPage += dir; renderPage(currentPage); }
</script>
</body>
</html>
