<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शब्द-भेद मास्टर: तत्सम, तद्भव, देशज, विदेशज</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 450px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">शब्द-भेद मास्टर टेस्ट</h2>
        <p>तत्सम, तद्भव, देशज और विदेशज<br>कृपया अपना सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">शब्द-भेद क्विज़</h1>
        <p>100 कठिन प्रश्न | प्रतियोगी परीक्षा स्तर</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">कुल स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला पेज</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला पेज</button>
    </div>
</div>

<script>
    const questionsPool = [
        // 1-50: तत्सम-तद्भव (Tatsam-Tadbhav)
        { q: "'गोधूम' शब्द का तद्भव रूप है:", o: ["गेहूँ", "गाय", "गोबर", "गोधन"], a: 0, t: "गोधूम (तत्सम) -> गेहूँ (तद्भव)" },
        { q: "निम्नलिखित में से 'तत्सम' शब्द का चयन कीजिए:", o: ["बारात", "हाथी", "वर्षा", "आँसू"], a: 2, t: "वर्षा तत्सम है, इसका तद्भव 'बरसात' है।" },
        { q: "'अमी' का तत्सम रूप क्या है?", o: ["अमीय", "अमृत", "अमृत्यु", "अमी"], a: 1, t: "अमी (तद्भव) -> अमृत (तत्सम)" },
        { q: "'ईख' शब्द का तत्सम रूप है:", o: ["गन्ना", "इक्षु", "इखु", "इक्ष"], a: 1, t: "इक्षु (तत्सम) -> ईख (तद्भव)" },
        { q: "'किवाड़' का तत्सम रूप बताइए:", o: ["कपाट", "कुटी", "कोना", "कपट"], a: 0, t: "कपाट (तत्सम) -> किवाड़ (तद्भव)" },
        { q: "निम्न में से 'तद्भव' शब्द कौन सा है?", o: ["उष्ट्र", "दधि", "भ्रमर", "अंगूठा"], a: 3, t: "अंगूठा तद्भव है, इसका तत्सम 'अंगुष्ठ' है।" },
        { q: "'उपालम्भ' का तद्भव रूप है:", o: ["उलाहना", "उपवास", "उड़ान", "उलझना"], a: 0, t: "उपालम्भ (तत्सम) -> उलाहना (तद्भव)" },
        { q: "'अक्षवाट' का तद्भव रूप क्या है?", o: ["अखरोट", "अखाड़ा", "अक्षत", "वाटिका"], a: 1, t: "अक्षवाट (तत्सम) -> अखाड़ा (तद्भव)" },
        { q: "'घोटक' का सही तद्भव शब्द है:", o: ["घड़ा", "घोड़ा", "घर", "घायल"], a: 1, t: "घोटक (तत्सम) -> घोड़ा (तद्भव)" },
        { q: "'मक्षिका' किसका तत्सम रूप है?", o: ["मछली", "मच्छर", "मक्खी", "मिट्टी"], a: 2, t: "मक्षिका (तत्सम) -> मक्खी (तद्भव)" },
        { q: "'यजमान' का तद्भव रूप है:", o: ["जजमान", "योगी", "जामुन", "जनता"], a: 0, t: "यजमान (तत्सम) -> जजमान (तद्भव)" },
        { q: "'हरिद्रा' शब्द का तद्भव रूप है:", o: ["हरदी", "हल्का", "हल्दी", "हरिद्वार"], a: 2, t: "हरिद्रा (तत्सम) -> हल्दी (तद्भव)" },
        { q: "'परसु' का तत्सम रूप क्या है?", o: ["परसों", "पार्श्व", "परशु", "पत्थर"], a: 2, t: "परशु (तत्सम) कुल्हाड़ी को कहते हैं।" },
        { q: "निम्न में से कौन सा शब्द तत्सम नहीं है?", o: ["स्कन्ध", "कपोत", "ईर्ष्या", "हल्दी"], a: 3, t: "हल्दी तद्भव है, इसका तत्सम 'हरिद्रा' है।" },
        { q: "'सूत' का तत्सम रूप क्या है?", o: ["सूत", "सूत्र", "सौत", "सूति"], a: 1, t: "सूत्र (तत्सम) -> सूत (तद्भव)" },
        { q: "'दृष्टि' का तद्भव रूप है:", o: ["दीठ", "देखना", "दृष्ट", "नजर"], a: 0, t: "दृष्टि (तत्सम) -> दीठ (तद्भव)" },
        { q: "'शर्करा' का तद्भव रूप है:", o: ["शकर", "शक्कर", "गुड़", "मिठाई"], a: 1, t: "शर्करा (तत्सम) -> शक्कर (तद्भव)" },
        { q: "'उज्ज्वल' का तद्भव रूप है:", o: ["उजला", "उजाला", "सफ़ेद", "स्वच्छ"], a: 0, t: "उज्ज्वल (तत्सम) -> उजला (तद्भव)" },
        { q: "तत्सम शब्द का चयन कीजिए:", o: ["शेर", "बब्बर शेर", "व्याघ्र", "बाघ"], a: 2, t: "व्याघ्र तत्सम है, बाघ तद्भव है।" },
        { q: "'दीपावली' का तद्भव रूप है:", o: ["दीवाली", "दिवाली", "दीप", "दीया"], a: 1, t: "दिवाली तद्भव रूप है।" },
        { q: "'अग्निष्ठिका' का तद्भव है:", o: ["अंगारा", "अग्नि", "अंगीठी", "अंग"], a: 2, t: "अग्निष्ठिका (तत्सम) -> अंगीठी (तद्भव)" },
        { q: "'कर्कट' का तद्भव रूप है:", o: ["कछुआ", "केकड़ा", "कमर", "काटना"], a: 1, t: "कर्कट (तत्सम) -> केकड़ा (तद्भव)" },
        { q: "'खर्पर' का तद्भव रूप है:", o: ["खप्पर", "खिड़की", "खपड़ा", "खरगोश"], a: 2, t: "खर्पर (तत्सम) -> खपड़ा (तद्भव)" },
        { q: "'चणक' का तद्भव रूप है:", o: ["चना", "चाँद", "चोर", "चणक"], a: 0, t: "चणक (तत्सम) -> चना (तद्भव)" },
        { q: "'तैल' का तद्भव रूप है:", o: ["तिल", "तेल", "ताला", "तैरना"], a: 1, t: "तैल (तत्सम) -> तेल (तद्भव)" },

        // 26-60: देशज-विदेशज-संकर (Deshaj-Videshaj-Sankar)
        { q: "निम्नलिखित में से 'देशज' शब्द कौन सा है?", o: ["आग", "बच्चा", "लोटा", "फूल"], a: 2, t: "लोटा, पगड़ी, झोला देशज शब्द हैं।" },
        { q: "'कैंची' किस भाषा का शब्द है?", o: ["अरबी", "तुर्की", "फारसी", "जापानी"], a: 1, t: "कैंची, चाकू, तोप, कुली तुर्की शब्द हैं।" },
        { q: "'रिक्शा' किस भाषा का शब्द है?", o: ["चीनी", "जापानी", "रूसी", "अंग्रेजी"], a: 1, t: "रिक्शा जापानी शब्द है।" },
        { q: "'आलमारी' किस भाषा का शब्द है?", o: ["पुर्तगाली", "फ्रेंच", "तुर्की", "डच"], a: 0, t: "आलमारी, बाल्टी, गमला पुर्तगाली हैं।" },
        { q: "'लीची' और 'चाय' किस भाषा के शब्द हैं?", o: ["जापानी", "चीनी", "अरबी", "फ्रेंच"], a: 1, t: "चाय, लीची चीनी शब्द हैं।" },
        { q: "'अदालत' किस भाषा का शब्द है?", o: ["फारसी", "अरबी", "तुर्की", "पुर्तगाली"], a: 1, t: "अदालत, मुल्जिम, तारीख अरबी शब्द हैं।" },
        { q: "'चश्मा' किस भाषा का शब्द है?", o: ["फारसी", "अरबी", "हिंदी", "अंग्रेजी"], a: 0, t: "चश्मा, आईना, जादू फारसी शब्द हैं।" },
        { q: "'रेलगाड़ी' शब्द है:", o: ["तद्भव", "देशज", "विदेशी", "संकर"], a: 3, t: "रेल (Eng) + गाड़ी (Hindi) = संकर (Hybrid)" },
        { q: "निम्न में से कौन सा शब्द 'तुर्की' भाषा का है?", o: ["कमरा", "आलू", "कैंची", "काजू"], a: 2, t: "कैंची तुर्की है, बाकी पुर्तगाली हैं।" },
        { q: "'पुलिस' किस भाषा का शब्द है?", o: ["अंग्रेजी", "फ्रेंच", "डच", "जर्मन"], a: 1, t: "पुलिस, कर्फ्यू, कारतूस फ्रेंच (फ्रांसीसी) शब्द हैं।" },
        { q: "'काजू' शब्द का संबंध किस भाषा से है?", o: ["जापानी", "चीनी", "पुर्तगाली", "फ्रांसीसी"], a: 2, t: "काजू, तंबाकू पुर्तगाली शब्द हैं।" },
        { q: "'खिड़की' किस प्रकार का शब्द है?", o: ["तत्सम", "तद्भव", "देशज", "विदेशज"], a: 2, t: "खिड़की देशज शब्द है।" },
        { q: "'छायादार' शब्द किसका उदाहरण है?", o: ["तत्सम", "देशज", "विदेशज", "संकर"], a: 3, t: "छाया (Sanskrit) + दार (Persian) = संकर।" },
        { q: "'पगड़ी' शब्द है:", o: ["देशज", "विदेशज", "तत्सम", "तद्भव"], a: 0, t: "पगड़ी देशज है।" },
        { q: "'गमला' और 'तौलिया' किस भाषा के शब्द हैं?", o: ["पुर्तगाली", "फ्रेंच", "तुर्की", "अंग्रेजी"], a: 0, t: "पुर्तगाली।" },
        { q: "'वकील' किस भाषा का शब्द है?", o: ["फारसी", "अरबी", "तुर्की", "पुर्तगाली"], a: 1, t: "वकील अरबी भाषा का शब्द है।" },
        { q: "'समोसा' किस भाषा का मूल शब्द है?", o: ["अरबी", "फारसी", "तुर्की", "हिंदी"], a: 1, t: "समोसा फारसी शब्द है।" },
        { q: "'कांच' किस भाषा का शब्द है?", o: ["हिंदी", "तुर्की", "डच", "पुर्तगाली"], a: 1, t: "कांच तुर्की शब्द है।" },
        { q: "'टिकटघर' कैसा शब्द है?", o: ["तत्सम", "तद्भव", "देशज", "संकर"], a: 3, t: "टिकट (Eng) + घर (Hindi) = संकर।" },
        { q: "'सजावट' शब्द में प्रत्यय के आधार पर भेद है:", o: ["तत्सम", "तद्भव", "देशज", "विदेशी"], a: 1, t: "सजावट तद्भव क्रिया रूप से बना है।" },

        // 61-100: कठिन मिश्रित (Hard Mixed)
        { q: "'अट्टालिका' का तद्भव रूप है:", o: ["अटल", "अटारी", "कमरा", "मकान"], a: 1, t: "अटारी।" },
        { q: "'उष्ट्र' का तद्भव रूप है:", o: ["ऊपर", "ऊँट", "उल्टा", "उजाला"], a: 1, t: "ऊँट।" },
        { q: "'कर्पूर' का तद्भव रूप है:", o: ["कपड़ा", "कपूर", "कपाट", "काटना"], a: 1, t: "कपूर।" },
        { q: "'गोमय' का तद्भव रूप है:", o: ["गेहूँ", "गाय", "गोबर", "गुड़"], a: 2, t: "गोबर।" },
        { q: "'चर्म' का तद्भव रूप है:", o: ["चमड़ा", "चमार", "चाँद", "चूरन"], a: 0, t: "चमड़ा।" },
        { q: "'दधि' का तद्भव रूप है:", o: ["दूध", "दही", "दाँत", "दीप"], a: 1, t: "दही।" },
        { q: "'नारिकेल' का तद्भव रूप है:", o: ["नारी", "नारियल", "नया", "नाव"], a: 1, t: "नारियल।" },
        { q: "'पर्यंक' का तद्भव रूप है:", o: ["पलंग", "पैर", "पूरा", "पार्क"], a: 0, t: "पलंग।" },
        { q: "'भ्रमर' का तद्भव रूप है:", o: ["भंवरा", "भाई", "भीख", "भाला"], a: 0, t: "भंवरा।" },
        { q: "'मृतिका' का तद्भव रूप है:", o: ["मौत", "मिट्टी", "मरना", "मीठा"], a: 1, t: "मिट्टी।" },
        { q: "'हस्ती' का तद्भव रूप है:", o: ["हाथ", "हंसी", "हाथी", "हथियार"], a: 2, t: "हाथी।" },
        { q: "'क्षीर' का तद्भव रूप है:", o: ["खीर", "खेत", "खारा", "दूध"], a: 0, t: "खीर।" },
        { q: "'अद्य' का तद्भव रूप है:", o: ["आज", "आधा", "अंधेरा", "आगे"], a: 0, t: "आज।" },
        { q: "'क्षेत्र' का तद्भव रूप है:", o: ["खेत", "खारा", "छाती", "खेती"], a: 0, t: "खेत।" },
        { q: "'ग्राहक' का तद्भव रूप है:", o: ["गौ", "गाहक", "गांव", "गधा"], a: 1, t: "गाहक।" },
        { q: "'ज्येष्ठ' का तद्भव रूप है:", o: ["जेठ", "बड़ा", "जवान", "जुलाई"], a: 0, t: "जेठ।" },
        { q: "'ताम्र' का तद्भव रूप है:", o: ["ताँबा", "तलवार", "तारा", "तालाब"], a: 0, t: "ताँबा।" },
        { q: "'दंत' का तद्भव रूप है:", o: ["दूध", "दाँत", "दाल", "दया"], a: 1, t: "दाँत।" },
        { q: "'धैर्य' का तद्भव रूप है:", o: ["धीरज", "धूल", "धुआँ", "धनी"], a: 0, t: "धीरज।" },
        { q: "'नग्न' का तद्भव रूप है:", o: ["नंगा", "नया", "नहर", "नाम"], a: 0, t: "नंगा।" },
        { q: "'पर्वत' का तद्भव रूप है:", o: ["पहाड़", "पत्थर", "पैर", "पूरा"], a: 0, t: "पहाड़।" },
        { q: "'बिन्दु' का तद्भव रूप है:", o: ["बिंदी", "बूंद", "बिंदु", "बेटा"], a: 1, t: "बूंद।" },
        { q: "'भ्राता' का तद्भव रूप है:", o: ["भाई", "भतीजा", "भगत", "भाला"], a: 0, t: "भाई।" },
        { q: "'रात्रि' का तद्भव रूप है:", o: ["रात", "रैन", "शाम", "अंधेरा"], a: 0, t: "रात।" },
        { q: "'लोह' का तद्भव रूप है:", o: ["लोहा", "लोहार", "लाल", "लौह"], a: 0, t: "लोहा।" },
        { q: "'विवाह' का तद्भव रूप है:", o: ["ब्याह", "बारात", "बहू", "बेटा"], a: 0, t: "ब्याह।" },
        { q: "'सत्य' का तद्भव रूप है:", o: ["सच", "सही", "सच्चा", "सपूत"], a: 0, t: "सच।" },
        { q: "'हस्त' का तद्भव रूप है:", o: ["हाथ", "हंसी", "हाथी", "हथौड़ा"], a: 0, t: "हाथ।" },
        { q: "'घृणा' का तद्भव रूप है:", o: ["गिन", "घिन", "घायल", "घड़ा"], a: 1, t: "घिन।" },
        { q: "'छत्र' का तद्भव रूप है:", o: ["छाता", "छत", "छाया", "छैला"], a: 1, t: "छत।" },
        { q: "'दुग्ध' का तद्भव रूप है:", o: ["दही", "दूध", "दाँत", "दीप"], a: 1, t: "दूध।" },
        { q: "'नक्षत्र' का तद्भव रूप है:", o: ["नख", "नखत", "तारा", "नाम"], a: 1, t: "नखत।" },
        { q: "'पत्र' का तद्भव रूप है:", o: ["पत्ता", "पात्र", "पैर", "पक्षी"], a: 0, t: "पत्ता।" },
        { q: "'बालुका' का तद्भव रूप है:", o: ["बाल", "बालू", "बेटा", "बकरा"], a: 1, t: "बालू।" },
        { q: "'भिक्षा' का तद्भव रूप है:", o: ["भीख", "भगत", "भूखा", "भाई"], a: 0, t: "भीख।" },
        { q: "'मुख' का तद्भव रूप है:", o: ["मुँह", "मस्तक", "माथा", "मोर"], a: 0, t: "मुँह।" },
        { q: "'लज्जा' का तद्भव रूप है:", o: ["लाज", "लड़ाई", "लाल", "लोहा"], a: 0, t: "लाज।" },
        { q: "'शिक्षा' का तद्भव रूप है:", o: ["सीख", "पढ़ाई", "शिक्षक", "स्कूल"], a: 0, t: "सीख।" },
        { q: "'हृदय' का तद्भव रूप है:", o: ["हिया", "दिल", "छाती", "हाथ"], a: 0, t: "हिया।" },
        { q: "'श्रृंग' का तद्भव रूप है:", o: ["सींग", "शिखर", "सिर", "सजावट"], a: 0, t: "सींग।" }
    ];

    const orders = {
        'A': Array.from({length: 100}, (_, i) => i),
        'B': Array.from({length: 100}, (_, i) => 99 - i),
        'C': [42,8,91,25,67,5,84,33,19,56,4,72,99,0,88,11,37,64,22,95,50,6,81,15,44,79,3,28,60,93,48,7,12,85,55,2,39,70,96,17,45,29,62,82,31,69,94,20,53,86,9,26,41,74,30,63,97,18,51,87,1,43,24,65,35,76,92,10,54,89,21,46,73,98,34,58,16,49,71,40,68,23,57,80,36,61,90,14,52,78,32,59,83,47,66,75,38,27,77,13],
        'D': [50,99,2,75,12,88,33,64,1,44,81,19,92,7,55,30,85,11,66,23,77,4,41,95,20,69,8,52,15,83,37,70,98,28,61,46,90,16,59,10,48,93,24,63,89,35,72,9,51,84,18,60,97,26,56,40,87,31,67,91,22,54,86,13,58,94,32,65,74,39,82,14,53,79,25,68,96,3,45,80,17,62,71,34,57,78,6,43,76,21,49,73,5,42,47,38,29,36,0]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `शब्द-भेद टेस्ट - SET ${type}`;
        const indices = orders[type];
        currentQuestions = indices.map(idx => questionsPool[idx]);
        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br>व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब: <b>${item.o[item.a]}</b> <br>व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) { buttons[selIdx].classList.add('correct'); feed.innerHTML = `✅ सही उत्तर!`; }
        else { buttons[selIdx].classList.add('wrong'); buttons[item.a].classList.add('correct'); feed.innerHTML = `❌ गलत। सही: ${item.o[item.a]}`; }
        feed.style.display = "block";
        feed.innerHTML += `<br>व्याख्या: ${item.t}`;
    }

    function changePage(dir) { currentPage += dir; renderPage(currentPage); }
</script>
