<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शब्द भेद मास्टर क्विज़ - 100 प्रश्न</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f1f2f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 90%;
        }
        .set-btn {
            display: inline-block;
            width: 130px;
            padding: 18px;
            margin: 10px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.1); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h1 style="margin-top:0; color: var(--primary);">शब्द भेद: तत्सम-तद्भव</h1>
        <p style="font-size: 1.2em; color: #555;">प्रतियोगी परीक्षा हेतु 100 महत्वपूर्ण प्रश्न।<br>एक सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadMixedSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadMixedSet('B')">SET B</button><br>
        <button class="set-btn btn-c" onclick="loadMixedSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadMixedSet('D')">SET D</button>
        <p style="font-size: 0.9em; margin-top: 20px; color: #7f8c8d;">नोट: प्रत्येक सेट का अपना एक विशिष्ट और स्थिर क्रम है।</p>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">शब्द भेद क्विज़</h1>
        <p>तत्सम, तद्भव, देशज, विदेशज और संकर शब्द</p>
    </header>

    <div class="stats-bar">
        <div id="scoreDisplay">स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>

    <div id="quiz-content"></div>

    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    const baseQuestions = [
        { q: "'अग्निष्ठिका' का तद्भव रूप क्या है?", o: ["अंगीठी", "अग्नि", "अंगारा", "अगहन"], a: 0, t: "अग्निष्ठिका (तत्सम) -> अंगीठी (तद्भव)" },
        { q: "'अकार्य' शब्द का तद्भव रूप है:", o: ["अकाम", "अकाज", "अकार्थ", "अनर्थ"], a: 1, t: "अकार्य (तत्सम) -> अकाज (तद्भव)" },
        { q: "निम्नलिखित में से तत्सम शब्द चुनिए:", o: ["चौपाया", "चारों", "चतुष्पद", "चारपाए"], a: 2, t: "चतुष्पद तत्सम शब्द है।" },
        { q: "'शर्करा' का तद्भव रूप बताइए:", o: ["शकर", "शक्कर", "खांड़", "गुड़"], a: 1, t: "शर्करा (तत्सम) -> शक्कर (तद्भव)" },
        { q: "निम्न में से कौन-सा शब्द 'देशज' है?", o: ["आग", "बच्चा", "खिड़की", "फूल"], a: 2, t: "खिड़की, लोटा, पगड़ी देशज शब्द हैं।" },
        { q: "'कर्पट' का तद्भव रूप क्या है?", o: ["कपट", "कारपेट", "कपूर", "कपड़ा"], a: 3, t: "कर्पट (तत्सम) -> कपड़ा (तद्भव)" },
        { q: "'श्मश्रु' शब्द का तद्भव रूप होगा:", o: ["मूँछ", "अश्रु", "ससुर", "मशाल"], a: 0, t: "श्मश्रु (तत्सम) -> मूँछ (तद्भव)" },
        { q: "किस भाषा का शब्द 'रिक्शा' है?", o: ["चीनी", "जापानी", "तुर्की", "रूसी"], a: 1, t: "रिक्शा जापानी भाषा का शब्द है।" },
        { q: "'अट्टालिका' का तद्भव रूप है:", o: ["अटला", "अटल", "अटारी", "कमरा"], a: 2, t: "अट्टालिका (तत्सम) -> अटारी (तद्भव)" },
        { q: "'गोमय' का तद्भव रूप बताइए:", o: ["गेहूँ", "गोबर", "गाय", "गंदा"], a: 1, t: "गोमय (तत्सम) -> गोबर (तद्भव)" },
        { q: "निम्नलिखित में से 'विदेशी' शब्द है:", o: ["उष्ट्र", "अमीर", "प्रिय", "भक्त"], a: 1, t: "अमीर अरबी भाषा का शब्द है।" },
        { q: "'खर्पर' का तद्भव रूप है:", o: ["खप्पर", "खिड़की", "खपड़ा", "खरगोश"], a: 2, t: "खर्पर (तत्सम) -> खपड़ा (तद्भव)" },
        { q: "कौन-सा शब्द 'संकर' (Hybrid) है?", o: ["नारी", "रेलगाड़ी", "सूरज", "पेड़"], a: 1, t: "रेल (अंग्रेजी) + गाड़ी (हिंदी) = संकर शब्द" },
        { q: "'हरिद्रा' का तद्भव रूप क्या है?", o: ["हरिद्वार", "हरदी", "हल्दी", "हलदर"], a: 2, t: "हरिद्रा (तत्सम) -> हल्दी (तद्भव)" },
        { q: "'धूम्र' का तद्भव रूप बताइए:", o: ["धुँध", "धुआँ", "धूम", "धूल"], a: 1, t: "धूम्र (तत्सम) -> धुआँ (तद्भव)" },
        { q: "निम्न में से तत्सम शब्द है:", o: ["कान", "मुँह", "जीभ", "मुख"], a: 3, t: "मुख (तत्सम) -> मुँह (तद्भव)" },
        { q: "'गर्दभ' का तद्भव रूप है:", o: ["गधा", "गर्व", "गागर", "गौ"], a: 0, t: "गर्दभ (तत्सम) -> गधा (तद्भव)" },
        { q: "'मक्षिका' का तद्भव रूप है:", o: ["मछली", "मक्खी", "मच्छर", "मिट्टी"], a: 1, t: "मक्षिका (तत्सम) -> मक्खी (तद्भव)" },
        { q: "'आलपिन' और 'गमला' किस भाषा के शब्द हैं?", o: ["फ्रेंच", "पुर्तगाली", "अंग्रेजी", "जापानी"], a: 1, t: "आलपिन, गमला, तौलिया पुर्तगाली शब्द हैं।" },
        { q: "'पर्यंक' का तद्भव रूप बताइए:", o: ["पलंग", "पानी", "पर्णा", "पार्क"], a: 0, t: "पर्यंक (तत्सम) -> पलंग (तद्भव)" },
        { q: "किस शब्द में तत्सम-तद्भव का मेल अशुद्ध है?", o: ["दूध-दुग्ध", "हाथ-हस्त", "आम-आम्र", "दही-दधि"], a: 0, t: "विकल्प में तद्भव पहले और तत्सम बाद में है, क्रम अशुद्ध है।" },
        { q: "'कैंची' किस भाषा का शब्द है?", o: ["हिंदी", "तुर्की", "अरबी", "फारसी"], a: 1, t: "कैंची, चाकू, तोप, कुली तुर्की शब्द हैं।" },
        { q: "'क्षीर' का तद्भव रूप है:", o: ["खीर", "क्षेत्र", "खारी", "दूध"], a: 0, t: "क्षीर (तत्सम) -> खीर (तद्भव)" },
        { q: "'उष्ट्र' का तद्भव रूप है:", o: ["ऊपर", "ऊँट", "उल्टा", "उजला"], a: 1, t: "उष्ट्र (तत्सम) -> ऊँट (तद्भव)" },
        { q: "'पगड़ी' कैसा शब्द है?", o: ["तत्सम", "तद्भव", "देशज", "विदेशज"], a: 2, t: "पगड़ी एक स्थानीय देशज शब्द है।" },
        { q: "'मृतिका' का तद्भव रूप है:", o: ["मौत", "मिट्टी", "मरना", "मीठा"], a: 1, t: "मृतिका (तत्सम) -> मिट्टी (तद्भव)" },
        { q: "'लक्ष' का तद्भव रूप है:", o: ["लक्ष्य", "लखपति", "लाख", "लक्ष्मण"], a: 2, t: "लक्ष (तत्सम) -> लाख (तद्भव)" },
        { q: "'वक' का तद्भव रूप बताइए:", o: ["बगुला", "वचन", "बंदर", "वायु"], a: 0, t: "वक (तत्सम) -> बगुला (तद्भव)" },
        { q: "'कुक्कुर' का तद्भव रूप है:", o: ["कबूतर", "कुत्ता", "कौआ", "कीड़ा"], a: 1, t: "कुक्कुर (तत्सम) -> कुत्ता (तद्भव)" },
        { q: "निम्न में से फारसी शब्द है:", o: ["आलमारी", "चश्मा", "कैंची", "कुली"], a: 1, t: "चश्मा फारसी भाषा का शब्द है।" },
        { q: "'नारिकेल' का तद्भव रूप है:", o: ["नारी", "नारियल", "नया", "नाव"], a: 1, t: "नारिकेल (तत्सम) -> नारियल (तद्भव)" },
        { q: "'हस्ती' का तद्भव रूप है:", o: ["हाथ", "हंसी", "हाथी", "हथियार"], a: 2, t: "हस्ती (तत्सम) -> हाथी (तद्भव)" },
        { q: "'गोमल' और 'गोमय' का अर्थ है:", o: ["गेहूँ", "गोबर", "गुड़", "गाय"], a: 1, t: "दोनों तत्सम गोबर के लिए प्रयुक्त होते हैं।" },
        { q: "'अद्य' का तद्भव रूप है:", o: ["आज", "आधा", "अंधेरा", "आगे"], a: 0, t: "अद्य (तत्सम) -> आज (तद्भव)" },
        { q: "अरबी भाषा का शब्द पहचानिए:", o: ["अदालत", "पुलिस", "मेज", "काजू"], a: 0, t: "अदालत अरबी शब्द है।" },
        { q: "'कपूर' शब्द कैसा है?", o: ["तत्सम", "तद्भव", "देशज", "विदेशज"], a: 1, t: "कपूर तद्भव है, इसका तत्सम 'कर्पूर' होता है।" },
        { q: "'लोटा' शब्द किस श्रेणी में आता है?", o: ["तत्सम", "देशज", "तद्भव", "विदेशी"], a: 1, t: "लोटा देशज शब्द है।" },
        { q: "'पुष्प' का तद्भव रूप है:", o: ["पत्ता", "फूल", "पौधा", "पुहुप"], a: 1, t: "पुष्प (तत्सम) -> फूल (तद्भव)" },
        { q: "'चूर्ण' का तद्भव रूप है:", o: ["चोर", "चूर्ण", "चाम", "चूरन"], a: 3, t: "चूर्ण (तत्सम) -> चूरन (तद्भव)" },
        { q: "'मयूर' का तद्भव रूप है:", o: ["मोदक", "मोर", "मामा", "मछली"], a: 1, t: "मयूर (तत्सम) -> मोर (तद्भव)" },
        { q: "'तद्भव' शब्द का चयन कीजिए:", o: ["हस्त", "अग्नि", "निडर", "भ्रमर"], a: 2, t: "निडर तद्भव है, इसका तत्सम 'निर्भय' है।" },
        { q: "'शैया' का तद्भव रूप है:", o: ["सोना", "सेम", "सेज", "सजना"], a: 2, t: "शैया (तत्सम) -> सेज (तद्भव)" },
        { q: "तुर्की शब्द नहीं है:", o: ["चाकू", "तोप", "कमरा", "कुली"], a: 2, t: "कमरा पुर्तगाली शब्द है।" },
        { q: "'अंधकार' का तद्भव रूप है:", o: ["अँधेरा", "रात", "साँझ", "धुआँ"], a: 0, t: "अंधकार (तत्सम) -> अँधेरा (तद्भव)" },
        { q: "'कार्य' का तद्भव रूप है:", o: ["कर्म", "काम", "काज", "क्रिया"], a: 1, t: "कार्य (तत्सम) -> काम (तद्भव)" },
        { q: "'भ्रमर' का तद्भव रूप है:", o: ["भँवरा", "भ्रमण", "भाला", "भईया"], a: 0, t: "भ्रमर (तत्सम) -> भँवरा (तद्भव)" },
        { q: "'दधि' का तद्भव रूप है:", o: ["दूध", "दही", "दाँत", "दीप"], a: 1, t: "दधि (तत्सम) -> दही (तद्भव)" },
        { q: "'श्रृंगार' का शुद्ध तत्सम रूप है:", o: ["शृंगार", "श्रृंगार", "सिंघार", "सज्जा"], a: 0, t: "शृंगार (शुद्ध तत्सम वर्तनी)" },
        { q: "'चैत्र' का तद्भव रूप है:", o: ["चेत", "चैत", "चाँद", "चित्रा"], a: 1, t: "चैत्र (तत्सम) -> चैत (तद्भव)" },
        { q: "'उज्ज्वल' का तद्भव रूप है:", o: ["उजला", "उजाला", "उज्वल", "सफ़ेद"], a: 0, t: "उज्ज्वल (तत्सम) -> उजला (तद्भव)" },
        { q: "'वर्तिका' का तद्भव रूप है:", o: ["बत्ती", "बात", "बर्तन", "वर्ण"], a: 0, t: "वर्तिका (तत्सम) -> बत्ती (तद्भव)" },
        { q: "पुर्तगाली शब्द पहचानिए:", o: ["बाल्टी", "चाकू", "कैंची", "टेलीफोन"], a: 0, t: "बाल्टी, तौलिया, मेज पुर्तगाली हैं।" },
        { q: "'स्वर्ण' का तद्भव रूप है:", o: ["सोना", "सुनार", "सूरज", "स्वप्न"], a: 0, t: "स्वर्ण (तत्सम) -> सोना (तद्भव)" },
        { q: "'अंगुष्ठ' का तद्भव रूप है:", o: ["अंगूठी", "अँगुली", "अंगूठा", "अंगोछा"], a: 2, t: "अंगुष्ठ (तत्सम) -> अंगूठा (तद्भव)" },
        { q: "'मत्स्य' का तद्भव रूप है:", o: ["मच्छर", "मक्खी", "मछली", "मगर"], a: 2, t: "मत्स्य (तत्सम) -> मछली (तद्भव)" },
        { q: "'यजमान' का तद्भव रूप है:", o: ["जजमान", "योगी", "जामुन", "जनता"], a: 0, t: "यजमान (तत्सम) -> जजमान (तद्भव)" },
        { q: "'घोटक' का तद्भव रूप है:", o: ["घोड़ा", "घड़ा", "घर", "घायल"], a: 0, t: "घोटक (तत्सम) -> घोड़ा (तद्भव)" },

    let questions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadMixedSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `शब्द भेद टेस्ट: SET ${type}`;

        const indices = setOrders[type];
        questions = indices.map(idx => baseData[idx]);

        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = questions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = questions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);

        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br> [${item.t}]`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब है: <b>${item.o[item.a]}</b> <br> [${item.t}]`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = questions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            buttons[selIdx].classList.add('correct');
            feed.innerHTML = `✅ सही! <br> [${item.t}]`;
        } else {
            buttons[selIdx].classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही: <b>${item.o[item.a]}</b> <br> [${item.t}]`;
        }
        feed.style.display = "block";
    }

    function changePage(dir) {
        currentPage += dir;
        renderPage(currentPage);
    }
