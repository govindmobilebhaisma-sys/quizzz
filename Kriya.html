<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>क्रिया मास्टर क्विज़ - 100 प्रश्न</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        /* Selection Menu */
        #menu-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
        }
        .menu-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 450px;
        }
        .set-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }
        .btn-a { background: #3498db; }
        .btn-b { background: #9b59b6; }
        .btn-c { background: #27ae60; }
        .btn-d { background: #e67e22; }
        .set-btn:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* Quiz UI */
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 20px; padding-bottom: 10px; }
        .stats-bar { position: sticky; top: 10px; z-index: 1000; display: flex; justify-content: space-between; background: var(--primary); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .q-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 20px; border-left: 6px solid var(--accent); }
        .q-text { font-size: 1.15em; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
        button.opt-btn { padding: 12px; border: 1px solid #dee2e6; background: #fff; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1em; }
        button.correct { background: #d4edda !important; color: #155724; font-weight: bold; border-color: var(--success); }
        button.wrong { background: #f8d7da !important; color: #721c24; border-color: var(--danger); }
        .feedback { margin-top: 12px; display: none; font-weight: 600; padding: 10px; border-radius: 5px; background: #f1f2f6; border-left: 4px solid var(--accent); }
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .nav-btn { padding: 10px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="menu-screen">
    <div class="menu-box">
        <h2 style="margin-top:0">हिन्दी व्याकरण: क्रिया (Verb)</h2>
        <p>100 महत्वपूर्ण प्रश्न | प्रतियोगी परीक्षा स्तर<br>कृपया अपना सेट चुनें:</p>
        <button class="set-btn btn-a" onclick="loadSet('A')">SET A</button>
        <button class="set-btn btn-b" onclick="loadSet('B')">SET B</button>
        <button class="set-btn btn-c" onclick="loadSet('C')">SET C</button>
        <button class="set-btn btn-d" onclick="loadSet('D')">SET D</button>
    </div>
</div>

<div class="container" id="main-container">
    <header>
        <h1 id="quiz-title">क्रिया (Verb) मास्टर क्विज़</h1>
        <p>रचना, अर्थ और प्रयोग के आधार पर क्रिया भेद</p>
    </header>
    <div class="stats-bar">
        <div id="scoreDisplay">कुल स्कोर: 0 / 100</div>
        <div id="pageDisplay">पेज: 1 / 4</div>
    </div>
    <div id="quiz-content"></div>
    <div class="pagination">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>पिछला</button>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
    </div>
</div>

<script>
    const questionsPool = [
        // 1-30: अकर्मक और सकर्मक (Intransitive & Transitive)
        { q: "'बच्चा सो रहा है' - इस वाक्य में क्रिया का कौन-सा भेद है?", o: ["सकर्मक", "अकर्मक", "द्विकर्मक", "प्रेरणार्थक"], a: 1, t: "सोना, हँसना, रोना, जागना सदैव अकर्मक क्रियाएँ होती हैं क्योंकि इनका फल कर्ता पर पड़ता है।" },
        { q: "'राम फल खाता है' - इस वाक्य में क्रिया है:", o: ["अकर्मक", "सकर्मक", "पूर्वकालिक", "नामधातु"], a: 1, t: "क्या खाता है? - 'फल' (कर्म मौजूद है, अतः सकर्मक)।" },
        { q: "'पक्षी आकाश में उड़ रहे हैं' - इस वाक्य में क्रिया का भेद बताइए:", o: ["सकर्मक", "अकर्मक", "अपूर्ण अकर्मक", "संयुक्त"], a: 1, t: "उड़ना अकर्मक क्रिया है। 'आकाश में' अधिकरण कारक है, कर्म नहीं।" },
        { q: "'मैंने उसे पुस्तक दी' - इस वाक्य में क्रिया है:", o: ["एककर्मक", "अकर्मक", "द्विकर्मक", "संयुक्त"], a: 2, t: "क्या दी? - 'पुस्तक', किसको दी? - 'उसे'। दो कर्म होने से यह द्विकर्मक क्रिया है।" },
        { q: "'चिड़िया उड़ती है' - इस वाक्य में उड़ती है क्रिया है:", o: ["सकर्मक", "अकर्मक", "प्रेरणार्थक", "यौगिक"], a: 1, t: "अकर्मक।" },
        { q: "निम्नलिखित में से सकर्मक क्रिया का चयन कीजिए:", o: ["लेटना", "हँसना", "पिघलना", "लिखना"], a: 3, t: "लिखना के साथ 'क्या' (पत्र, लेख) का उत्तर मिल सकता है।" },
        { q: "'राम पुस्तक पढ़ता है' - इसमें क्रिया है:", o: ["अकर्मक", "सकर्मक", "नामधातु", "प्रेरणार्थक"], a: 1, t: "पढ़ना सकर्मक है।" },
        { q: "'सीता गाना गा रही है' - वाक्य में क्रिया का भेद है:", o: ["अकर्मक", "सकर्मक", "द्विकर्मक", "पूर्वकालिक"], a: 1, t: "गाना (Object) मौजूद है।" },
        { q: "अकर्मक क्रिया का उदाहरण है:", o: ["पढ़ना", "खाना", "रोना", "देखना"], a: 2, t: "रोने का फल सीधे कर्ता पर पड़ता है।" },
        { q: "'मोहन ने पत्र पढ़ा' - इसमें 'पढ़ा' कौन-सी क्रिया है?", o: ["अकर्मक", "सकर्मक", "प्रेरणार्थक", "नामधातु"], a: 1, t: "सकर्मक।" },
        { q: "'नदी बह रही है' - वाक्य में क्रिया है:", o: ["अकर्मक", "सकर्मक", "संयुक्त", "द्विकर्मक"], a: 0, t: "बहना अकर्मक है।" },
        { q: "जिस क्रिया का फल कर्म पर न पड़कर कर्ता पर पड़ता है, उसे क्या कहते हैं?", o: ["सकर्मक", "अकर्मक", "द्विकर्मक", "प्रेरणार्थक"], a: 1, t: "अकर्मक की परिभाषा।" },
        { q: "'लड़का आम खाता है' - इस वाक्य में क्रिया है:", o: ["सकर्मक", "अकर्मक", "नामधातु", "संयुक्त"], a: 0, t: "सकर्मक।" },
        { q: "'वह घर जा रहा है' - इसमें 'जा रहा है' कौन सी क्रिया है?", o: ["अकर्मक", "सकर्मक", "द्विकर्मक", "प्रेरणार्थक"], a: 0, t: "जाना अकर्मक क्रिया है (स्थान कर्म नहीं होता)।" },
        { q: "'श्याम सोता है' - वाक्य में क्रिया का भेद है:", o: ["सकर्मक", "अकर्मक", "प्रेरणार्थक", "नामधातु"], a: 1, t: "सोना अकर्मक है।" },
        { q: "द्विकर्मक क्रिया में कौन-सा कर्म प्रधान होता है?", o: ["प्राणीवाचक", "पदार्थवाचक", "दोनों", "कोई नहीं"], a: 1, t: "पदार्थवाचक (मुख्य कर्म) प्रधान होता है, प्राणीवाचक (गौण कर्म) अप्रधान।" },
        { q: "किस वाक्य में सकर्मक क्रिया नहीं है?", o: ["बच्चा फल तोड़ रहा है", "मोहन लिखता है", "मजदूर चाय पी रहा है", "पक्षी उड़ रहे हैं"], a: 3, t: "पक्षी उड़ रहे हैं (अकर्मक)।" },
        { q: "वह पढ़ता है। यहाँ क्रिया है:", o: ["अकर्मक", "सकर्मक", "नामधातु", "प्रेरणार्थक"], a: 1, t: "पढ़ना स्वाभाविक रूप से सकर्मक है, भले ही कर्म न लिखा हो।" },
        { q: "'राजा ने ब्राह्मण को दान दिया' - इसमें दान है:", o: ["मुख्य कर्म", "गौण कर्म", "कर्ता", "सम्प्रदान"], a: 0, t: "दान मुख्य कर्म है।" },
        { q: "'पेड़ से पत्ता गिरा' - इसमें गिरना है:", o: ["अकर्मक", "सकर्मक", "प्रेरणार्थक", "संयुक्त"], a: 0, t: "अकर्मक।" },
        { q: "'माली पौधों को सींचता है' - इसमें क्रिया है:", o: ["अकर्मक", "सकर्मक", "द्विकर्मक", "सहायक"], a: 1, t: "सकर्मक।" },
        { q: "'अकर्मक क्रिया' शब्द का अर्थ है:", o: ["कर्म रहित", "कर्म सहित", "दो कर्म", "क्रिया रहित"], a: 0, t: "बिना कर्म के।" },
        { q: "बूंद-बूंद से घड़ा भरता है। इसमें 'भरता है' है:", o: ["अकर्मक", "सकर्मक", "प्रेरणार्थक", "यौगिक"], a: 0, t: "यहाँ क्रिया स्वतः हो रही है, फल घड़े पर है, अतः अकर्मक।" },
        { q: "'मैं घड़ा भरता हूँ' - इसमें 'भरता हूँ' है:", o: ["अकर्मक", "सकर्मक", "प्रेरणार्थक", "नामधातु"], a: 1, t: "यहाँ कर्ता घड़े को भर रहा है, अतः सकर्मक।" },
        { q: "'सकर्मक क्रिया' का उदाहरण नहीं है:", o: ["पीना", "देना", "पढ़ना", "जागना"], a: 3, t: "जागना अकर्मक है।" },

        // 31-60: प्रेरणार्थक, पूर्वकालिक, नामधातु (Causal, Absolutive, Nominal)
        { q: "'लिखवाना' क्रिया का कौन सा रूप है?", o: ["प्रथम प्रेरणार्थक", "द्वितीय प्रेरणार्थक", "नामधातु", "संयुक्त"], a: 1, t: "जब कर्ता किसी और से कार्य करवाए (वाना प्रत्यय)।" },
        { q: "'वह पढ़कर सो गया' - इस वाक्य में 'पढ़कर' है:", o: ["नामधातु", "पूर्वकालिक", "प्रेरणार्थक", "सकर्मक"], a: 1, t: "मुख्य क्रिया से पहले होने वाली क्रिया पूर्वकालिक कहलाती है।" },
        { q: "'हथियाना' और 'लतियाना' किस प्रकार की क्रियाएँ हैं?", o: ["नामधातु", "प्रेरणार्थक", "यौगिक", "संयुक्त"], a: 0, t: "संज्ञा या विशेषण से बनने वाली क्रियाएँ नामधातु कहलाती हैं।" },
        { q: "'उठना' क्रिया का प्रेरणार्थक रूप क्या होगा?", o: ["उठवाना", "उठाना", "उठ", "उठा"], a: 1, t: "उठाना प्रथम प्रेरणार्थक है।" },
        { q: "'जगाना' मूल रूप क्रिया का कौन-सा रूप है?", o: ["प्रथम प्रेरणार्थक", "द्वितीय प्रेरणार्थक", "मूल क्रिया", "नामधातु"], a: 0, t: "जगाना प्रथम प्रेरणार्थक, जगवाना द्वितीय।" },
        { q: "'चमकना' से बनने वाली नामधातु क्रिया है:", o: ["चमकाना", "चमचमाना", "चमकीला", "चमकवाना"], a: 1, t: "चमचमाना।" },
        { q: "'पढ़ना' का द्वितीय प्रेरणार्थक रूप है:", o: ["पढ़ा", "पढ़ाना", "पढ़वाना", "पढ़ाकर"], a: 2, t: "पढ़वाना।" },
        { q: "प्रेरणार्थक क्रिया में कर्ता:", o: ["स्वयं कार्य करता है", "कार्य नहीं करता", "कार्य करने की प्रेरणा देता है", "इनमें से कोई नहीं"], a: 2, t: "प्रेरणा देने वाला।" },
        { q: "निम्नलिखित में से 'नामधातु' क्रिया कौन सी है?", o: ["पढ़ना", "लिखना", "बतियाना", "चलना"], a: 2, t: "बात (संज्ञा) से बतियाना।" },
        { q: "प्रेरणार्थक क्रिया का उदाहरण है:", o: ["वह खाता है", "वह पढ़ता है", "वह सीता से पत्र लिखवाता है", "वह घर गया"], a: 2, t: "लिखवाना।" },
        { q: "'गरमाना' शब्द में कौन सी क्रिया है?", o: ["नामधातु", "यौगिक", "प्रेरणार्थक", "संयुक्त"], a: 0, t: "गरम (विशेषण) से गरमाना।" },
        { q: "वह खाकर सो गया। यहाँ 'खाकर' क्या है?", o: ["नामधातु", "पूर्वकालिक", "प्रेरणार्थक", "सकर्मक"], a: 1, t: "पूर्वकालिक।" },
        { q: "पक्षी उड़कर पेड़ पर बैठ गए। यहाँ 'उड़कर' है:", o: ["पूर्वकालिक", "प्रेरणार्थक", "नामधातु", "अकर्मक"], a: 0, t: "पूर्वकालिक।" },
        { q: "'दौड़ाना' क्रिया का भेद है:", o: ["अकर्मक", "सकर्मक", "प्रेरणार्थक", "नामधातु"], a: 2, t: "दौड़ना से दौड़ाना (प्रेरणार्थक)।" },
        { q: "'सुलाना' कौन सी क्रिया है?", o: ["मूल", "प्रेरणार्थक", "नामधातु", "यौगिक"], a: 1, t: "सोना से सुलाना।" },
        { q: "संज्ञा, सर्वनाम और विशेषण शब्दों के अंत में प्रत्यय लगाकर जो क्रियाएँ बनती हैं, उन्हें कहते हैं:", o: ["प्रेरणार्थक", "नामधातु", "संयुक्त", "पूर्वकालिक"], a: 1, t: "नामधातु की परिभाषा।" },
        { q: "'शर्माना' क्रिया का आधार शब्द क्या है?", o: ["शर्म", "शरम", "शर्मा", "शर्मिंदगी"], a: 0, t: "शर्म (संज्ञा)।" },
        { q: "'धिक्कारना' क्रिया है:", o: ["प्रेरणार्थक", "नामधातु", "संयुक्त", "यौगिक"], a: 1, t: "धिक्कार से बनी।" },
        { q: "'उठवाना' क्रिया का मूल रूप है:", o: ["उठ", "उठा", "उठना", "उठाना"], a: 2, t: "उठना मूल क्रिया है।" },
        { q: "'जीतना' क्रिया का प्रेरणार्थक रूप होगा:", o: ["जीता", "जिताना", "जीत", "विजयी"], a: 1, t: "जिताना।" },
        { q: "पिता ने पुत्र से पुस्तक मंगवाई। यहाँ क्रिया है:", o: ["नामधातु", "प्रेरणार्थक", "पूर्वकालिक", "अकर्मक"], a: 1, t: "मंगवाई (प्रेरणार्थक)।" },
        { q: "उसने नहाकर भोजन किया। यहाँ 'नहाकर' है:", o: ["पूर्वकालिक", "प्रेरणार्थक", "यौगिक", "सकर्मक"], a: 0, t: "पूर्वकालिक।" },
        { q: "'दुखाना' क्रिया है:", o: ["नामधातु", "प्रेरणार्थक", "यौगिक", "संयुक्त"], a: 0, t: "दुःख से दुखाना।" },

        { q: "किस वाक्य में प्रेरणार्थक क्रिया है?", o: ["सोहन पढ़ता है", "मजदूर पानी पीता है", "अध्यापक छात्र से पाठ पढ़वाता है", "राम सो गया"], a: 2, t: "पढ़वाता है।" },

        // 61-90: संयुक्त क्रिया और सहायक क्रिया (Compound & Auxiliary)

        { q: "संयुक्त क्रिया के कितने भेद होते हैं?", o: ["9", "11", "13", "15"], a: 1, t: "मुख्यतः 11 भेद (आरंभबोधक, समाप्तिबोधक आदि)।" },

        { q: "'पेड़ से फल गिर पड़ा' - गिर पड़ा है:", o: ["संयुक्त क्रिया", "पूर्वकालिक", "नामधातु", "सकर्मक"], a: 0, t: "गिरना + पड़ना = संयुक्त क्रिया।" },
        { q: "सहायक क्रिया (Helping Verb) का कार्य है:", o: ["काल का बोध कराना", "अर्थ स्पष्ट करना", "मुख्य क्रिया की सहायता", "उपरोक्त सभी"], a: 3, t: "सभी कार्य सहायक क्रिया करती है।" },
        { q: "'राम स्कूल चला गया' - चला गया है:", o: ["यौगिक", "संयुक्त", "प्रेरणार्थक", "नामधातु"], a: 1, t: "संयुक्त।" },
        { q: "'वह पढ़ाई कर चुका' - इसमें 'चुका' है:", o: ["अवकाशबोधक", "समाप्तिबोधक", "निश्चयबोधक", "इच्छाबोधक"], a: 1, t: "समाप्तिबोधक।" },
        { q: "'अब वह चलने लगा' - वाक्य में क्रिया है:", o: ["आरंभबोधक", "निश्चयबोधक", "नित्यताबोधक", "शक्तिबोधक"], a: 0, t: "कार्य का आरंभ होना।" },
        { q: "'हवा चल रही है' - इसमें 'रही है' क्या है?", o: ["मुख्य क्रिया", "सहायक क्रिया", "नामधातु", "पूर्वकालिक"], a: 1, t: "सहायक क्रिया।" },
        { q: "'मोहन घर पहुँच गया' - इसमें 'पहुँच' है:", o: ["मुख्य क्रिया", "सहायक क्रिया", "रंजक क्रिया", "नामधातु"], a: 0, t: "पहुँच मुख्य क्रिया है।" },
        { q: "रंजक क्रिया का प्रयोग किसमें होता है?", o: ["अकर्मक में", "सकर्मक में", "संयुक्त क्रिया में", "प्रेरणार्थक में"], a: 2, t: "संयुक्त क्रिया का दूसरा भाग रंजक क्रिया कहलाता है।" },
        { q: "'वह घर आ गया' - इसमें रंजक क्रिया है:", o: ["वह", "घर", "आ", "गया"], a: 3, t: "गया (जाना) रंजक क्रिया है।" },
        { q: "'मुझे पढ़ने दो' - इसमें क्रिया का भेद है:", o: ["अनुमतिबोधक", "निश्चयबोधक", "आरंभबोधक", "शक्तिबोधक"], a: 0, t: "अनुमति माँगी जा रही है।" },
        { q: "'वह आया करता है' - यह है:", o: ["नित्यताबोधक", "अभ्यासबोधक", "इच्छाबोधक", "निश्चयबोधक"], a: 1, t: "अभ्यास का बोध।" },
        { q: "'वर्षा हुआ करती है' - इसमें है:", o: ["नित्यताबोधक", "अभ्यासबोधक", "शक्तिबोधक", "इच्छाबोधक"], a: 1, t: "अभ्यासबोधक।" },
        { q: "'उसे जाने दो' - इसमें क्रिया है:", o: ["इच्छाबोधक", "अनुमतिबोधक", "शक्तिबोधक", "निश्चयबोधक"], a: 1, t: "अनुमतिबोधक।" },
        { q: "वह घर पहुँच गया होगा। यहाँ 'होगा' किस काल की सहायक क्रिया है?", o: ["वर्तमान", "भूत", "भविष्य", "संदीग्ध वर्तमान"], a: 3, t: "संदीग्धता।" },
        { q: "संयुक्त क्रिया का अर्थ है:", o: ["एक क्रिया", "दो या अधिक क्रियाओं का मेल", "कर्म के साथ क्रिया", "कर्ता के साथ क्रिया"], a: 1, t: "दो क्रियाओं का योग।" },
        { q: "'क्रियार्थक संज्ञा' सदा किस रूप में रहती है?", o: ["बहुवचन पुल्लिंग", "एकवचन पुल्लिंग", "एकवचन स्त्रीलिंग", "बहुवचन स्त्रीलिंग"], a: 1, t: "जैसे: टहलना स्वास्थ्य के लिए अच्छा 'है' (पुल्लिंग एकवचन)।" },

        // 91-100: विविध और कठिन (Mixed/Hard)
        { q: "टहलना स्वास्थ्य के लिए अच्छा है। यहाँ 'टहलना' क्या है?", o: ["क्रिया", "क्रियार्थक संज्ञा", "विशेषण", "अव्यय"], a: 1, t: "जब क्रिया संज्ञा की तरह व्यवहार करे।" },
        { q: "'सकर्मक क्रिया' का वाक्य चुनिए:", o: ["मंदाकिनी सोती है", "पक्षी आकाश में उड़ते हैं", "बालक खिलौना पाकर हँसता है", "बालिका निबंध लिख रही है"], a: 3, t: "निबंध (Object) सकर्मक है।" },
        { q: "राम लक्ष्मण से पत्र लिखवाता है। इसमें क्रिया का कौन-सा रूप है?", o: ["पूर्वकालिक", "प्रेरणार्थक", "संयुक्त", "अकर्मक"], a: 1, t: "प्रेरणार्थक।" },
        { q: "रचना की दृष्टि से क्रिया के कितने भेद हैं?", o: ["2", "3", "4", "5"], a: 0, t: "सकर्मक और अकर्मक।" },
        { q: "'हथियाना' क्रिया किस संज्ञा से बनी है?", o: ["हाथी", "हथियार", "हाथ", "हस्त"], a: 2, t: "हाथ (संज्ञा) से।" },
        { q: "निम्नलिखित में से प्रेरणार्थक क्रिया है:", o: ["पढ़ना", "लिखना", "जगाना", "देखना"], a: 2, t: "जगाना (प्रेरणार्थक)।" },
        { q: "वह कल जाएगा। इसमें क्रिया किस काल की है?", o: ["वर्तमान", "भूत", "भविष्य", "सामान्य"], a: 2, t: "भविष्य।" },
        { q: "धातु किसे कहते हैं?", o: ["क्रिया के मूल रूप को", "क्रिया के सामान्य रूप को", "क्रिया के उत्तम रूप को", "क्रिया के संपूर्ण रूप को"], a: 0, t: "क्रिया का मूल अंश धातु है।" },
        { q: "'लिख' धातु से बना सामान्य रूप होगा:", o: ["लिखा", "लिखे", "लिखना", "लिखकर"], a: 2, t: "धातु + ना = सामान्य रूप।" },
        { q: "कौन-सी क्रिया अकर्मक नहीं है?", o: ["हँसना", "रोना", "दौड़ना", "खाना"], a: 3, t: "खाना सकर्मक है (कुछ न कुछ खाएगा ही)।" }
    ];

    const orders = {
        'A': Array.from({length: 100}, (_, i) => i),
        'B': Array.from({length: 100}, (_, i) => 99 - i),
        'C': [14, 82, 3, 91, 55, 21, 7, 66, 40, 0, 12, 88, 4, 73, 50, 29, 19, 95, 6, 31, 77, 44, 11, 85, 2, 38, 60, 93, 17, 45, 28, 70, 99, 53, 8, 84, 33, 1, 54, 89, 20, 68, 96, 15, 43, 26, 72, 51, 87, 35, 9, 64, 30, 81, 18, 63, 97, 42, 13, 86, 34, 58, 25, 79, 16, 49, 71, 32, 59, 83, 47, 76, 92, 10, 24, 65, 56, 41, 74, 37, 69, 94, 22, 57, 80, 36, 61, 90, 52, 78, 46, 23, 67, 14, 5, 75, 98, 39, 27, 62],
        'D': [50, 99, 2, 75, 12, 88, 33, 64, 1, 44, 81, 19, 92, 7, 55, 30, 85, 11, 66, 23, 77, 4, 41, 95, 20, 69, 8, 52, 15, 83, 37, 70, 98, 28, 61, 46, 90, 16, 59, 10, 48, 93, 24, 63, 89, 35, 72, 9, 51, 84, 18, 60, 97, 26, 56, 40, 87, 31, 67, 91, 22, 54, 86, 13, 58, 94, 32, 65, 74, 39, 82, 14, 53, 79, 25, 68, 96, 3, 45, 80, 17, 62, 71, 34, 57, 78, 6, 43, 76, 21, 49, 73, 5, 42, 65, 47, 38, 29, 36, 0]
    };

    let currentQuestions = [];
    let score = 0;
    let currentPage = 0;
    const qPerPage = 25;
    const userSelections = {};

    function loadSet(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        document.getElementById('quiz-title').innerText = `क्रिया मास्टर - SET ${type}`;
        const indices = orders[type];
        currentQuestions = indices.map(idx => questionsPool[idx]);
        renderPage(0);
    }

    function renderPage(page) {
        const list = document.getElementById('quiz-content');
        list.innerHTML = "";
        const start = page * qPerPage;
        const end = start + qPerPage;
        const pageQs = currentQuestions.slice(start, end);

        pageQs.forEach((item, i) => {
            const actualIdx = start + i;
            const card = document.createElement('div');
            card.className = 'q-card';
            card.innerHTML = `
                <div class="q-text">${actualIdx + 1}. ${item.q}</div>
                <div class="options" id="opt-${actualIdx}">
                    ${item.o.map((opt, oi) => `<button class="opt-btn" onclick="check(${actualIdx}, ${oi}, this)">${opt}</button>`).join('')}
                </div>
                <div class="feedback" id="feed-${actualIdx}"></div>
            `;
            list.appendChild(card);
            if (userSelections[actualIdx] !== undefined) restore(actualIdx, userSelections[actualIdx]);
        });

        document.getElementById('pageDisplay').innerText = `पेज: ${page + 1} / 4`;
        document.getElementById('prevBtn').disabled = (page === 0);
        document.getElementById('nextBtn').disabled = (page === 3);
        window.scrollTo(0,0);
    }

    function check(qIdx, selIdx, btn) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        userSelections[qIdx] = selIdx;
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) {
            btn.classList.add('correct');
            score++;
            feed.innerHTML = `✅ सही उत्तर! <br>व्याख्या: ${item.t}`;
            feed.style.color = "green";
        } else {
            btn.classList.add('wrong');
            buttons[item.a].classList.add('correct');
            feed.innerHTML = `❌ गलत। सही जवाब है: <b>${item.o[item.a]}</b> <br>व्याख्या: ${item.t}`;
            feed.style.color = "red";
        }
        feed.style.display = "block";
        document.getElementById('scoreDisplay').innerText = `कुल स्कोर: ${score} / 100`;
    }

    function restore(qIdx, selIdx) {
        const item = currentQuestions[qIdx];
        const buttons = document.getElementById(`opt-${qIdx}`).querySelectorAll('button');
        const feed = document.getElementById(`feed-${qIdx}`);
        buttons.forEach(b => b.disabled = true);
        if (selIdx === item.a) { buttons[selIdx].classList.add('correct'); feed.innerHTML = `✅ सही!`; }
        else { buttons[selIdx].classList.add('wrong'); buttons[item.a].classList.add('correct'); feed.innerHTML = `❌ गलत। सही: ${item.o[item.a]}`; }
        feed.style.display = "block";
        feed.innerHTML += `<br>व्याख्या: ${item.t}`;
    }

    function changePage(dir) { currentPage += dir; renderPage(currentPage); }
</script>
